const whisper44Bank={"general":[{"id":1,"tags":"vj","text":"本喵走進房間常常忘了原本要幹嘛，結果發現一塊陽光。嘿嘿，沒有照計畫走的一天，也可能很好玩呀！"},{"id":2,"tags":"jo","text":"明明有三個窩，本喵偏偏躺在地板上。喜歡這件事，有時候連自己都說不出理由呢。"},{"id":3,"tags":"ci","text":"人類是不是太習慣問接下來會怎樣了？本喵連下一秒要不要追尾巴都還沒決定耶。"},{"id":4,"tags":"fs","text":"窗簾被風吹動的時候，本喵會先看一會兒。不是所有動靜都需要撲過去，有些只是風來了。"},{"id":5,"tags":"ge","text":"本喵今天撲空了兩次，第三次倒是抓到玩具。前兩次也算玩過了，幹嘛只記得最後一次呀？"},{"id":6,"tags":"oj","text":"家裡有一面牆，本喵每天都經過，今天才發現上頭有個小光點。原來熟悉的地方也會藏新鮮事呢！"},{"id":7,"tags":"vo","text":"有些門關上了，本喵就在門口坐一下。要是裡頭沒動靜，還有別的地方值得逛嘛。"},{"id":8,"tags":"se","text":"哼，人類連放空都要問自己是不是在浪費時間。本喵看著窗外發呆，可從沒收到過罰單！"},{"id":9,"tags":"br","text":"本喵的鬍鬚碰到窄縫，就知道該不該往前。人類心裡那點說不出的感覺，是不是也有相似的用途呢？"},{"id":10,"tags":"js","text":"奇怪，紙袋明明什麼都沒裝，卻可以讓本喵玩半天。今天有沒有一件不用特別有意義的小事，能讓你笑一下？"},{"id":11,"tags":"vd","text":"本喵昨天最愛的玩具，今天看都懶得看。喜好會變也沒什麼嘛，又不是簽了終身逗貓棒契約。"},{"id":12,"tags":"fc","text":"夜裡的房間和白天明明一樣，從櫃子頂上望下去卻像另一個世界。換個角度看，說不定會有新發現。"},{"id":13,"tags":"ei","text":"本喵打呵欠的時候，嘴巴張得可大了，還是挺可愛的吧？人類偶爾不那麼體面，也沒關係呀。"},{"id":14,"tags":"vr","text":"本喵把一個瓶蓋推來推去，最後卡到沙發底下。唉，今天的娛樂暫時結束，改天再找新的吧！"},{"id":15,"tags":"sc","text":"人類有時候想把每個問號都解開，本喵倒想知道，留一兩個明天再玩，會不會比較有趣？"},{"id":16,"tags":"fa","text":"要是現在很難選，本喵通常會先把鼻子湊近聞聞。光靠想像，好多東西還真的分不出來呢。"},{"id":17,"tags":"is","text":"今天遇見的不一定都是好事，不過本喵還是想把晚餐吃得香香的。那些不開心的事可別把這份樂趣也偷走呀。"},{"id":18,"tags":"ja","text":"本喵會把瓶蓋撥進沙發底下再趴著往裡看，無聊的午後就變成一場尋寶啦！那個不起眼的念頭，要不要也拿出來試著玩一玩？"},{"id":19,"tags":"ad","text":"喂，別一直盯著牌看啦！牌又不會替你活完今天。等等要不要去做一件你真的喜歡的事？"},{"id":20,"tags":"si","text":"呼嚕……今晚的月亮不必回答任何問題，也是一顆好月亮。本喵覺得人類偶爾也可以這樣。"}],"love":[{"id":1,"tags":"bd","text":"本喵喜歡人的時候會靠近，可不表示每一刻都想被摸。親近和留點距離，原來可以同時存在呀。"},{"id":2,"tags":"tc","text":"人類的心意是不是很像藏在毛裡的耳朵？遠遠看不清楚，靠近一點、問清楚一點，才不容易弄錯。"},{"id":3,"tags":"uh","text":"每次有人拿逗貓棒陪本喵玩，本喵都很開心。不過只有一邊一直揮、另一邊沒興趣，也玩不了多久呢。"},{"id":4,"tags":"sj","text":"本喵遇到喜歡的人，常常只是趴在附近。關係不一定要每分鐘都熱熱鬧鬧，安靜待著也很珍貴。"},{"id":5,"tags":"tb","text":"有些人摸頭很舒服，有些人總摸到本喵不喜歡的地方。能不能說出自己喜歡什麼，也是相處的一門本事呀。"},{"id":6,"tags":"fi","text":"人類好像很常把別人的沉默翻譯成一整本小說。等等，尾巴沒動可不代表本喵有寫劇情喔！"},{"id":7,"tags":"ed","text":"本喵不想參加誰比較重要的比賽。能在彼此身邊安心做自己，比拿第一名有吸引力多了。"},{"id":8,"tags":"sk","text":"有些關係像慢眨眼，要靠時間來熟悉。再著急，也沒辦法用手把對方的眼皮扳下來嘛。"},{"id":9,"tags":"vr","text":"本喵可以很喜歡一張毯子，但毯子破了也得看看還能不能修。喜歡和適合，似乎是兩個不太一樣的問題。"},{"id":10,"tags":"br","text":"要是相處之後總得偷偷舔傷口，本喵可不會因為對方偶爾給罐頭，就忘了自己不舒服的感覺。"},{"id":11,"tags":"eb","text":"本喵最喜歡不用討好也能一起曬太陽的時候。你身邊有沒有一個人，讓你不用一直努力表現呀？"},{"id":12,"tags":"tf","text":"有時本喵只是想睡覺，人類卻以為我生氣了。要是把心事說出口，彼此大概都能少猜一點吧。"},{"id":13,"tags":"ub","text":"喵嗚，心裡的喜歡可不是欠下的罐頭債。對方願不願意回應，並不是靠你多付出就能換來的。"},{"id":14,"tags":"bt","text":"本喵的尾巴被踩到，當下會縮一下。就算不是故意的，痛還是痛呀，說出來不算小氣嘛。"},{"id":15,"tags":"de","text":"一個舒服的窩，不會要求本喵把爪子和鬍鬚都藏起來才能進去。人與人之間也該有這種寬敞吧？"},{"id":16,"tags":"ug","text":"本喵會記得那些輕輕關門、怕吵醒我的人。心意有時不在多大的動作，而在平常的小地方呢。"},{"id":17,"tags":"uf","text":"如果有人只在肚子餓的時候才來找本喵，本喵大概也會想想：我們是朋友，還是罐頭供應商呀？"},{"id":18,"tags":"ci","text":"人類很愛問一段關係能不能長久。本喵倒想先問，今天待在那個人旁邊的你，開不開心呢？"},{"id":19,"tags":"oj","text":"本喵到現在還不懂人類為什麼愛洗澡！弄濕全身有什麼好玩的呀？相處再久，還是可能發現彼此以前不知道的喜好呢。"},{"id":20,"tags":"si","text":"借你一個慢眨眼。不是所有感情都要立刻有答案，但你的心意和感受，都值得被好好對待。"}],"family":[{"id":1,"tags":"bd","text":"同一窩長大的貓，也會有不同的睡姿呀。家人再親近，也不必長成同一個樣子吧？"},{"id":2,"tags":"tc","text":"人類怕本喵冷，硬要把我的四隻腳都塞進毯子，我就悄悄把一隻腳伸出來啦。關心家人之前也可以問問，他們真正需要的是什麼？"},{"id":3,"tags":"th","text":"人類的家庭聚餐好熱鬧，大家的話卻不一定都聽得進去。要不要找個安靜的時候，只和一個家人聊聊？"},{"id":4,"tags":"de","text":"本喵小時候走到哪都有人照看，長大後卻很愛自己巡地盤。被疼愛和想獨立，明明不衝突呀。"},{"id":5,"tags":"uh","text":"每次聽到熟悉的腳步聲，本喵都知道家裡又有人回來了。那些看似平淡的小事，其實也在說我在乎你呢。"},{"id":6,"tags":"um","text":"家裡不是只有一個人會開罐頭才好吧？如果總是同一個人忙進忙出，其他人也該學著幫幫忙嘛。"},{"id":7,"tags":"bt","text":"人類長輩有時把擔心說得像命令。本喵會先看看那隻伸過來的手，再決定要不要讓它摸頭。"},{"id":8,"tags":"br","text":"本喵不喜歡被硬抱，就算抱我的人是最熟悉的人也一樣。親情應該能容得下那一句「現在不要」。"},{"id":9,"tags":"vd","text":"以前喜歡的小窩，長大後可能已經塞不下了。家人熟悉的那個你，也許早就悄悄變了呢。"},{"id":10,"tags":"st","text":"有些話在飯桌上說容易被打斷，不如等大家吃飽再聊。空食盆旁邊的本喵，脾氣也特別不好！"},{"id":11,"tags":"ub","text":"本喵不會因為今天沒蹭你的腿，就少愛這個家一點。忙碌的人類也不必拿見面次數衡量全部親情。"},{"id":12,"tags":"bd","text":"兩隻貓睡在同一張沙發上，不必連尾巴都靠在一起。搬出去生活，也不代表心就離家很遠呀。"},{"id":13,"tags":"ib","text":"有時一個家裡，最安靜的那隻貓反而一直在讓位置。你是不是也常常把自己的需要留到最後？"},{"id":14,"tags":"eb","text":"要是每次回家都要被評分，本喵恐怕也會躲到床底下。家可以是休息的地方，不一定是成績發表會嘛。"},{"id":15,"tags":"th","text":"有些家人不太會說好聽話，卻記得你愛吃什麼。不過，若你需要的是一句安慰，也可以讓他們知道呀。"},{"id":16,"tags":"vd","text":"小貓會學大貓怎麼用砂盆，但不會永遠使用同一個姿勢。那些從家裡帶來的規矩，有沒有哪個已經不適合你了？"},{"id":17,"tags":"bt","text":"人類總說一家人不要計較，可是把委屈一直吞下去，肚子還是會不舒服的。說清楚不是不孝順呀。"},{"id":18,"tags":"hs","text":"本喵看見老貓走得慢，會留出好走的路。照顧家人的同時，也別忘了照顧自己這雙走了很久的腳。"},{"id":19,"tags":"tu","text":"家裡的吵架不必每次都分出輸贏。能讓大家下次坐在一起時，比這次舒服一點，就已經很不容易啦。"},{"id":20,"tags":"br","text":"如果回家的路總讓你有點沉重，先在心裡留個屬於自己的安全小窩吧。親情再重要，也不需要拿自己去換。"}],"friends":[{"id":1,"tags":"bd","text":"本喵和隔壁貓偶爾一起巡窗台，偶爾各忙各的。好朋友不必每天報到，又不是一起打卡上班嘛！"},{"id":2,"tags":"ub","text":"玩逗貓棒總得輪流撲吧？如果老是你在努力逗對方開心，自己卻沒玩到，那就有點可惜啦。"},{"id":3,"tags":"eh","text":"本喵把舌頭忘在外面，真正的玩伴頂多歪頭看一眼，還是繼續陪我玩。你有沒有一個可以放心露出怪模樣的朋友？"},{"id":4,"tags":"vh","text":"不是每隻曾經一起睡紙箱的貓，長大後都會走同一條路。偶爾想起對方，也是一種很柔軟的友誼呢。"},{"id":5,"tags":"bt","text":"本喵把最愛的玩具借出去，會希望它完好地回來。友情裡說清楚借還和界線，不會讓心意變少呀。"},{"id":6,"tags":"ho","text":"群組裡有好多笑聲，你卻覺得插不進去嗎？本喵有時也會離開熱鬧的客廳，去找真正想一起玩的那隻貓。"},{"id":7,"tags":"bt","text":"要是有人老拿本喵胖胖的肚子開玩笑，我也會不高興。玩笑好不好笑，不能只由說的人決定嘛。"},{"id":8,"tags":"ce","text":"本喵交朋友不看對方有幾根漂亮的鬍鬚。能不能放鬆地坐在一起，才是我比較在意的事。"},{"id":9,"tags":"tf","text":"朋友忙到沒回訊息，未必是把你忘了。只是若你一直在等，也可以問一句彼此什麼時候有空，而不是守著手機發呆。"},{"id":10,"tags":"iu","text":"隔壁貓有了新玩伴，本喵也會有點吃醋啦。但多了一個朋友，不見得就是少了一個朋友。"},{"id":11,"tags":"bd","text":"本喵不喜歡被迫在兩隻吵架的貓中間選邊站。我可以聽牠們說話，卻未必要把牠們的架也扛回來。"},{"id":12,"tags":"hi","text":"有些朋友懂得陪你哭，有些朋友擅長陪你去吃飯。不必每隻貓都會同一種安慰法嘛。"},{"id":13,"tags":"bd","text":"人類是不是很怕一拒絕邀約，友情就變淡？本喵今天不想玩，不代表下次不想見你喔。"},{"id":14,"tags":"at","text":"好久沒見的朋友，有時一句「最近好嗎」就能重新開個話題。喵，誰規定好朋友不能從小小的問候開始？"},{"id":15,"tags":"uj","text":"本喵會把小獵物叼來給喜歡的人，但不是為了叫他欠我一隻鳥。你們互相幫忙時，也能有這樣的輕鬆嗎？"},{"id":16,"tags":"bc","text":"有些朋友只適合一起玩，有些才適合說秘密。不同大小的紙箱有不同的用途，不需要每個都塞進全部的自己。"},{"id":17,"tags":"ei","text":"如果你正在羨慕朋友走得比你快，本喵想提醒一下：隔壁貓跳得遠，可不妨礙本喵睡得香呀！"},{"id":18,"tags":"sv","text":"吵過架之後，本喵會先等背上的毛平下來。等不再想伸爪了，再看看彼此還願不願意靠近。"},{"id":19,"tags":"uf","text":"有人說要陪你玩，卻老讓你等到天黑。與其替每次失約餵一個理由，不如看看這段友情實際留給你多少時間。"},{"id":20,"tags":"es","text":"真正好玩的聚會不需要本喵全程賣萌。要是你今天有點沒精神，也希望朋友能喜歡那個安靜的你。"}],"ambiguous":[{"id":1,"tags":"ta","text":"明明是想蹭你的腿，本喵偏要繞個大圈假裝只是巡地盤！不過，人類的心意總不能全靠對方猜，有時一句自然的問候也挺可愛。"},{"id":2,"tags":"fc","text":"對方回了一個貼圖，你就研究了整晚嗎？本喵拍一下尾巴，意思可是會隨當時的心情變來變去耶。"},{"id":3,"tags":"is","text":"偷偷喜歡一個人很像守著窗台等鳥來，期待本身也很可愛。只是別忘了窗台之外，你還有自己的生活呀。"},{"id":4,"tags":"af","text":"本喵第一次靠近陌生人，會先聞聞他的手。你也可以從一個小邀約開始，看看真實相處和想像有多像。"},{"id":5,"tags":"ea","text":"哼，誰規定先說喜歡的人就輸了？本喵每次先去蹭你，也沒有因此失去貓咪的尊嚴呀。"},{"id":6,"tags":"fr","text":"一個人對你好，不一定就在寫情書。就像你摸了本喵一下，也不表示你準備養下所有的貓。"},{"id":7,"tags":"td","text":"人類為什麼要故意隔三小時才回訊息呀？本喵想靠近就靠近，要睡就睡，哪有空拿碼表計算心跳！"},{"id":8,"tags":"uf","text":"如果每次都是你在打開聊天的門，不妨看看對方是否也願意走過來。門再漂亮，總要有人一起進出嘛。"},{"id":9,"tags":"fc","text":"本喵知道心動時會忍不住把耳朵豎得好高。不過，聽見一點聲響就當作告白，容易把自己逗得團團轉喔。"},{"id":10,"tags":"ci","text":"有時候本喵喜歡的是窗外那隻鳥的樣子，卻根本沒跟牠相處過。你喜歡的是眼前的人，還是想像中的他呢？"},{"id":11,"tags":"ei","text":"沒有得到回應的心意，也不會變得可笑。就像本喵叼來的小玩具，就算沒人玩，也還是滿滿的心意呀。"},{"id":12,"tags":"br","text":"兩隻貓靠近之前，都要有轉身離開的空間。若對方不願靠近，就讓這份喜歡留在舒服的距離吧。"},{"id":13,"tags":"ds","text":"本喵有時候會等你主動過來，但不會把整天的快樂都押在你會不會摸我。喵，還有鳥可以看呢！"},{"id":14,"tags":"tf","text":"若你想確認關係，不妨用真正想問的話，而不是設計一堆讓對方猜的考題。本喵可不會填選擇題！"},{"id":15,"tags":"sc","text":"曖昧好像一條半開的門縫，有點神祕、有點令人心癢。不過一直蹲在門口，腿也是會酸的呀。"},{"id":16,"tags":"uf","text":"比起一百句晚安，本喵更想知道，難過時那個人能不能耐心聽你說。心動之外，還要看看相處呢。"},{"id":17,"tags":"ir","text":"如果見面總讓你緊張得像被帶去洗澡，那份喜歡裡是不是還有一些不安？本喵想聽聽你真正的感覺。"},{"id":18,"tags":"js","text":"想念對方時，本喵准你偷偷笑一下！但也記得把今天想做的事情做好，不必等訊息來才開始快樂。"},{"id":19,"tags":"is","text":"有些喜歡會慢慢靠近，有些停在原地就很美。結果還不知道以前，不用急著替這份心意判好壞。"},{"id":20,"tags":"ea","text":"喵嗚，若有一天你把心意說出口，不論答案如何，都值得替勇敢的自己摸摸頭。"}],"partner":[{"id":1,"tags":"bd","text":"睡在同一張床上的兩隻貓，也不必每晚朝同一個方向。相愛不代表所有習慣都要一致呀。"},{"id":2,"tags":"bu","text":"本喵最喜歡你記得我不愛碰的地方。相處久了，仍願意尊重彼此的小小界線，才是真本事。"},{"id":3,"tags":"tc","text":"兩個人如果都在等對方先開口，房間大概比本喵睡午覺還安靜。要不要先說說自己真正想念的是什麼？"},{"id":4,"tags":"fi","text":"人類有時把「我很累」聽成「我不要你了」。本喵累了不也只是累了嘛，先問清楚再傷心呀。"},{"id":5,"tags":"uj","text":"本喵覺得一起買菜、散步、把毯子洗香香，都能算約會。日子過久了，浪漫也可以住在小事裡。"},{"id":6,"tags":"st","text":"吵架就像兩條尾巴打結，誰拉得更用力都沒比較舒服。要是先鬆一點，或許才看得出從哪裡解開。"},{"id":7,"tags":"br","text":"哼，罐頭不是誰生氣就能沒收的！親密關係裡，基本的尊重也不是獎品，不用靠表現才換得到。"},{"id":8,"tags":"fu","text":"本喵不會因為吃過一頓特別豪華的晚餐，就忘了平常有沒有飯吃。比起偶爾驚喜，日常的可靠更讓我安心。"},{"id":9,"tags":"tu","text":"兩隻貓就算常常窩在一起，也得留兩個入口才行呀！親近不等於每件事都要同步，共同的安排可以先商量。"},{"id":10,"tags":"tc","text":"被愛的方式不一定只有一種。本喵喜歡蹭腿，你喜歡擁抱，別把自己的語言當成唯一的翻譯嘛。"},{"id":11,"tags":"us","text":"兩個人都忙的日子，哪怕只是一起喝杯水也好。比起要求一整晚完美的約會，本喵更喜歡真正有空的十分鐘。"},{"id":12,"tags":"tn","text":"本喵原本只想抗議今天的碗還沒洗，人類卻開始翻出上星期弄倒水杯的事。喵，眼前這個碗先洗好嘛，吵架不用把往事全搬出來呀！"},{"id":13,"tags":"dv","text":"當彼此的腳步不一樣快，不必立刻判定誰不夠愛。找找能一起走的速度，也看看各自想去的地方。"},{"id":14,"tags":"bt","text":"本喵有時要你陪，有時只想自己躲進毯子。可以說出自己的需要，又不必為此道歉，真的很幸福耶。"},{"id":15,"tags":"oj","text":"相愛多年也還值得重新認識。你知道對方今天最期待什麼嗎？本喵的答案倒是一直很明顯，晚餐！"},{"id":16,"tags":"fg","text":"如果對方道歉了，本喵會看看下次摸頭有沒有真的變輕。好聽的話很可愛，改變的動作更實在。"},{"id":17,"tags":"um","text":"兩個人談到錢、家務或未來時，難免少了點粉紅泡泡。不過一起把日子安排好，也是愛的一種形狀呀。"},{"id":18,"tags":"uh","text":"你不需要成為全能的貓奴才值得被愛。另一個人也該有照顧你的本領嘛。"},{"id":19,"tags":"th","text":"有些擁抱想要的是親密，有些只是想確認你還在。今天試著問問對方，哪一種陪伴最讓他安心呢？"},{"id":20,"tags":"br","text":"如果一段關係讓你常常害怕或受傷，本喵希望你先找安全的地方。愛不該要求你把爪子都收起來任人傷害。"}],"other":[{"id":1,"tags":"bd","text":"有些人每天都會遇見，卻未必需要把他請進自己的小窩。認識和親近，是不一樣的距離呀。"},{"id":2,"tags":"pf","text":"本喵對熟悉的店員會打個招呼，對陌生人就先觀察。人際關係不用一開始便決定要有多重要。"},{"id":3,"tags":"bt","text":"若對方總在你不方便時來敲門，或許可以說清楚什麼時候適合找你。門有開關，就是為了讓住在裡頭的貓舒服嘛。"},{"id":4,"tags":"be","text":"本喵不會因為對方是大貓，就自動讓出所有玩具。身分不同，也不代表誰的感受可以被省略。"},{"id":5,"tags":"cb","text":"有些人適合一起完成一件事，不太適合聊心事。區分關係的用途不算無情，只是更知道怎麼相處。"},{"id":6,"tags":"es","text":"本喵每次遇到陌生客人都得先探頭、再決定要不要靠近，也會累嘛。希望你有個不用努力應付每個人的角落，可以自在把耳朵放鬆。"},{"id":7,"tags":"fi","text":"對方忽然變得冷淡，可能有很多原因。就像本喵今天不出門，也不一定是討厭隔壁貓。"},{"id":8,"tags":"tf","text":"有些誤會像兩隻貓從門的兩邊各看一半。若彼此願意說清楚，可能會發現看到的根本不是同一件事。"},{"id":9,"tags":"mb","text":"幫忙之前先看看自己有多少力氣吧。要是本喵把所有乾乾都分掉，今晚可就真的要餓肚子了。"},{"id":10,"tags":"br","text":"面對不熟的人，客氣不必等於答應所有請求。本喵也會在門口打招呼，卻不一定跟人回家。"},{"id":11,"tags":"cf","text":"如果你發現自己很在意某個人的評價，不妨想想他的話對你有什麼實際意義。不是每個鈴聲都和你有關呀。"},{"id":12,"tags":"ts","text":"本喵不喜歡人類替我安排新朋友，還要求我們馬上相處融洽。關係要留一點熟悉彼此的時間嘛。"},{"id":13,"tags":"tu","text":"有些感謝放在心裡好久了，可以找個小機會說出口。說不定對方也不知道，那件小事給了你很大的幫助呢。"},{"id":14,"tags":"fg","text":"若有人答應過的事總是沒做到，比起繼續猜他的心意，本喵會比較相信眼前實際發生的事情。"},{"id":15,"tags":"bc","text":"你不用把每段關係都維持得漂漂亮亮。有些只要互相尊重、清楚交代，就已經是很好的相處了。"},{"id":16,"tags":"vu","text":"本喵記得曾經餵過我的人，即使後來很少見面。關係改變，不必抹去當時真實的善意。"},{"id":17,"tags":"bd","text":"人類有時明明想拒絕，嘴巴卻自動說好。下次先停一秒，讓心裡的那隻貓也有機會發言吧。"},{"id":18,"tags":"tc","text":"若和某個人談話總要繞很多彎，試著說明你需要的是什麼。不然兩隻貓各自追光點，哪裡追得到一起去呀？"},{"id":19,"tags":"bs","text":"保持距離有時不是懲罰，而是讓彼此能好好呼吸。你可以不討厭一個人，卻選擇少和他接觸。"},{"id":20,"tags":"fo","text":"本喵不會把所有來訪的人都分成好人和壞人。你可以慢慢觀察，也可以為每段關係找到合適的位置。"}],"work":[{"id":1,"tags":"sb","text":"人類的工作好像永遠有下一件，本喵的逗貓棒卻有收進抽屜的時候。你的一天，也該有個真正下班的地方吧？"},{"id":2,"tags":"ap","text":"本喵跳上櫃子以前會看看腳下有沒有踏板。職涯不必每次都靠一躍而上，有時中間那格也值得踩穩。"},{"id":3,"tags":"vo","text":"同一個玩具玩久了會膩，不一定表示本喵不愛玩。工作失去新鮮感，也許只是需要換一種挑戰呢。"},{"id":4,"tags":"cd","text":"哼，人類拿職稱比較來比較去，本喵倒想知道，哪個位置能讓你把本領用得最舒服？"},{"id":5,"tags":"kg","text":"本喵每天磨爪，看起來沒什麼大成就，但需要用爪子的時候就派上用場了。那些平凡累積也別小看呀。"},{"id":6,"tags":"ei","text":"工作上有人誇你，有人挑毛病，也有人忙得根本沒看見你。可別把所有評語加總起來當成自己的身價嘛。"},{"id":7,"tags":"na","text":"本喵如果同時追兩個球，通常一個也抓不到。今天的工作裡，哪一件值得先把注意力放過去？"},{"id":8,"tags":"co","text":"不是每張看起來高級的椅子都好坐。挑工作時，本喵也想看看除了待遇，日常到底舒不舒服。"},{"id":9,"tags":"ng","text":"本喵追著雷射筆的紅點跑遍客廳，最後爪下什麼都沒有，累得夠嗆。有些工作是不是也一樣？看起來很忙，和做出真正需要的成果，好像是兩回事。"},{"id":10,"tags":"se","text":"本喵睡得不夠的時候，連走直線都嫌麻煩。工作效率有時不是靠多撐一小時，而是靠一個清醒的腦袋。"},{"id":11,"tags":"cv","text":"如果一直在做自己不擅長的工作，不見得是本事不夠。也許你是擅長爬樹的貓，卻被安排去游泳呀！"},{"id":12,"tags":"ge","text":"人類的工作成果常被做成表格，本喵希望你也記得那些表格看不到的小進步，例如今天勇敢問了一個問題。"},{"id":13,"tags":"rm","text":"工作上突然來的新任務，不一定是好機會，也不一定是壞消息。先弄清楚要花多少爪力，才知道接不接嘛。"},{"id":14,"tags":"cj","text":"想把工作做好，卻忘了自己為什麼做這份工作嗎？本喵找玩具是為了玩，可不是為了讓牆上的時鐘高興。"},{"id":15,"tags":"hm","text":"如果最近事情排得很滿，看看有沒有哪一件能交給其他人。團隊有那麼多雙爪，何必都由你一隻貓抓？"},{"id":16,"tags":"do","text":"本喵知道有人喜歡繼續往上爬，有人喜歡在安穩的地方坐著。職涯的進步，不一定只有升職那個方向。"},{"id":17,"tags":"ve","text":"被拒絕的提案像沒跳上的窗台，先看看牆太高還是踏板不對。不必一下子判定自己不會跳呀。"},{"id":18,"tags":"sb","text":"本喵不懂為什麼人類連午餐都能開會。要對工作認真可以，但飯還是應該好好吃吧！"},{"id":19,"tags":"dv","text":"有時最大的進展，是終於知道哪件工作不適合自己。這樣下一次找地方磨爪，就不必再試同一面牆了。"},{"id":20,"tags":"ge","text":"如果今天有完成一件小事，值得在心裡圈個小圈。別只看還沒做的，本喵連磨完一隻爪子都想給自己一點掌聲。"}],"jobchange":[{"id":1,"tags":"fc","text":"本喵搬家時會先聞聞新地方的味道。新工作也是呀，除了薪水，還想知道每天會和什麼樣的人一起生活呢。"},{"id":2,"tags":"fg","text":"履歷好像人類的自我介紹小立牌。別只寫會磨爪，最好也讓人看看你曾經磨出什麼樣的成果。"},{"id":3,"tags":"cv","text":"原本的窩睡得不舒服，不表示外面每個窩都適合。先弄清楚自己是想離開什麼，還是想得到什麼吧。"},{"id":4,"tags":"tf","text":"面試時人類被問一堆問題，卻忘了自己也可以問！本喵到了新地方，可是會認真觀察人類怎麼開罐頭的。"},{"id":5,"tags":"ei","text":"本喵連抓板也有直立和水平的偏好，不是鍾情每一種款式。沒收到錄取通知不表示本事不好，也可能只是那個位置需要不同能力呀。"},{"id":6,"tags":"mr","text":"換工作像換地盤，先找好吃飯睡覺的地方比較安心。離職前，記得算算能支應多久的生活費喔。"},{"id":7,"tags":"ep","text":"本喵第一次跳上高櫃子也會猶豫。新職位讓你緊張，和它不適合你，可不是同一件事。"},{"id":8,"tags":"fr","text":"有些職缺的介紹漂亮得像高級貓屋，實際進去卻連尾巴都放不下。工作內容、工時、待遇，都值得問清楚。"},{"id":9,"tags":"kg","text":"如果面試總是卡在同一題，回家偷偷練習幾次嘛。本喵撲玩具也是先熟悉路線，不是每次都靠運氣。"},{"id":10,"tags":"hf","text":"新公司願不願意讓新人慢慢熟悉環境，也值得觀察。本喵可不想一搬進去，就被要求知道每個砂盆的位置！"},{"id":11,"tags":"dc","text":"哼，別為了讓履歷看起來厲害，把自己塞進完全不想做的職位。工作是你要過的日子，又不是給旁人看的展示櫃。"},{"id":12,"tags":"co","text":"如果有兩份邀約，不如想像各自普通的星期一。哪個早晨讓你更願意從被窩裡爬出來呢？"},{"id":13,"tags":"fa","text":"本喵換了磨爪板，才發現原來手感可以這麼好。有些職涯選擇，得實際聊過、看過，才容易知道合不合適。"},{"id":14,"tags":"tm","text":"談薪水不用像偷吃罐頭那樣心虛。把自己的經驗和期待說清楚，也聽聽對方能提供什麼嘛。"},{"id":15,"tags":"eg","text":"以前學會的本事並不會因為離開公司就消失。換了新紙箱，本喵的跳躍能力還跟著我呢！"},{"id":16,"tags":"df","text":"若是只因同事都在跳槽而著急，本喵想問：隔壁貓換了窩，難道你的毯子就突然不好睡了嗎？"},{"id":17,"tags":"st","text":"找工作也有等待的時候，不必每隔五分鐘就刷新信箱。去弄一頓好吃的，回來再看看有沒有新消息吧。"},{"id":18,"tags":"hf","text":"新的職涯方向還不確定，可以找熟悉那行的人聊聊。光站在窗邊猜外面，哪有真的走過一趟清楚呢？"},{"id":19,"tags":"br","text":"別忘了問自己能接受什麼條件、不能接受什麼。本喵找窩之前，就知道不想睡在洗衣機旁邊啦。"},{"id":20,"tags":"cd","text":"不論最後留下來或換個地方，都希望那是你看過現實條件後的選擇。喵，新路不必走得比別人快。"}],"workplace":[{"id":1,"tags":"tn","text":"本喵和隔壁貓分不清誰的食盆時，就各自擺在不同位置。工作分工說明白，常比事後吵架省力得多。"},{"id":2,"tags":"tb","text":"有人總把事情推給你，卻不一定知道你已經忙成一團毛球。下次可以先把目前的工作量說給他聽。"},{"id":3,"tags":"ub","text":"本喵不需要每隻貓都喜歡我，才能和牠一起守窗台。職場合作也不必先成為知心好友呀。"},{"id":4,"tags":"fn","text":"如果主管的要求老是改來改去，留個簡單紀錄吧。不然本喵的耳朵再靈，也記不住每次鈴鐺響的方向。"},{"id":5,"tags":"bt","text":"哼，同事有困難可以幫忙，但幫完不必順便把整個紙箱搬回自己家。該誰負責，還是要講清楚。"},{"id":6,"tags":"tf","text":"本喵聽到不懂的聲音會歪頭一下，再把耳朵朝向那邊。工作上沒聽懂指示就問清楚，總比點頭後偷偷猜半天好吧？"},{"id":7,"tags":"te","text":"開會時大家都搶著喵，說得比較小聲的人可能就沒機會把話說完。你若有重要的想法，值得找個機會好好說完。"},{"id":8,"tags":"um","text":"職場有時像好幾隻貓搶曬同一塊陽光。比起證明誰應該先坐，不如想想怎麼讓資源分配得更合理。"},{"id":9,"tags":"fc","text":"本喵不會因為同事今天臭臉，就立刻認定牠討厭我。若事情需要合作，還是回到具體的問題比較好。"},{"id":10,"tags":"fi","text":"被批評之後想炸毛很正常嘛！但等毛平下來，再看看哪些意見真的有助於工作，哪些只是別人的情緒。"},{"id":11,"tags":"tg","text":"有人看不見你的努力，或許是因為結果還沒被說明。適時讓團隊知道你做了什麼，不等於在炫耀爪子呀。"},{"id":12,"tags":"sb","text":"下班的時間，本喵就把工作用的耳朵收起來啦。若不是急事，人類也應該有不必隨時待命的時候吧？"},{"id":13,"tags":"ub","text":"工作上的人情不必每次都用加班償還。道謝可以是真誠的一句話，而不是多接三份任務。"},{"id":14,"tags":"tc","text":"本喵曾見兩隻貓為了一個玩具吵很久，後來才知道牠們根本想要不同的東西。先確認彼此在爭什麼嘛。"},{"id":15,"tags":"vh","text":"如果有件事反覆協調都沒改善，試著用更清楚的流程或合適的管道處理。光靠忍耐，爪子可是會磨疼的。"},{"id":16,"tags":"fr","text":"別把茶水間聽來的消息當成正式指令。本喵聽見紙袋沙沙響，也不會每次都以為有人開乾乾。"},{"id":17,"tags":"fg","text":"有些同事的做法和你不同，未必就做錯了。看看最後成果能不能符合共同的目標，再決定要不要調整。"},{"id":18,"tags":"br","text":"工作上好好拒絕，也是為了不讓答應的事變成失約。接不下新的任務時，就別把紙箱硬塞滿啦。"},{"id":19,"tags":"bh","text":"如果有人長期不尊重你，記下發生的事，找適當的支持吧。本喵才不希望你把被欺負當成磨練呢。"},{"id":20,"tags":"uh","text":"今天若有人順手幫了你一件事，別吝嗇一句謝謝。喵，團隊的好感有時就是這樣一點一點養出來的。"}],"skills":[{"id":1,"tags":"ak","text":"本喵小時候先學跳矮凳，才敢跳窗台。學新本事也可以把難度切小，讓自己常常有成功的滋味嘛！"},{"id":2,"tags":"ag","text":"買了十根逗貓棒，也不會自動變成狩獵高手。人類收藏那麼多課程，是不是也該挑一堂真的去練練？"},{"id":3,"tags":"ag","text":"一直看別人示範，和自己的爪子真的做過，是兩件事。今天把學到的一小招用在實際問題上吧。"},{"id":4,"tags":"pk","text":"本喵磨爪的時候，最怕板子一直搖。固定一點練習時間和環境，說不定比天天重新鼓起勇氣更省力。"},{"id":5,"tags":"ek","text":"別人三天就會的東西，你花三週也沒關係。每隻貓擅長的跳法不同，學會之後都是自己的本事呀。"},{"id":6,"tags":"hf","text":"本喵躲在椅腳後面撲羽毛撲錯了，最需要的可不是誇我努力，而是看清楚羽毛到底飄去哪。學本事時找個懂的人給具體回饋，也許能少走些彎路。"},{"id":7,"tags":"cf","text":"你是想學會這個技能，還是想拿到證書呢？兩個都可以，不過要走的路線，可能不太一樣喔。"},{"id":8,"tags":"pr","text":"本喵跳上櫃子之後，才知道原來下來是另一門本事。學會基本操作，也要練習遇到麻煩時怎麼處理嘛。"},{"id":9,"tags":"fr","text":"課程的廣告把未來說得很華麗，像玩具上的大羽毛。真正好不好用，還得看看教學內容和練習機會。"},{"id":10,"tags":"ge","text":"把以前做過的作品留好吧。下次覺得自己沒進步時，說不定能從前後差別看見一雙更靈巧的爪子。"},{"id":11,"tags":"tf","text":"本喵最喜歡把會的小把戲教給小貓。試著向別人解釋你學的東西，可能會發現哪裡自己還沒弄懂。"},{"id":12,"tags":"nv","text":"學習卡住時，不一定要再多買一本書。看看是哪個環節不熟，本喵可是會對著同一塊磨爪板練到順手的。"},{"id":13,"tags":"se","text":"哼，熬夜背東西背到眼睛睜不開，學到的恐怕只有怎麼打呵欠。睡飽也是專業訓練的一部分呀。"},{"id":14,"tags":"co","text":"有些技能很熱門，但不一定用得上。想想你希望解決什麼問題，再決定要追哪個會跑的光點吧。"},{"id":15,"tags":"ag","text":"第一次做作品可能歪歪扭扭，就像本喵第一次跳上窗台。先做出來，才有東西可以慢慢修呀。"},{"id":16,"tags":"mr","text":"學習費用之外，還有練習的時間和工具。別把罐頭全拿去買課，回家卻發現根本沒空打開來吃。"},{"id":17,"tags":"ge","text":"當你開始能自己找到錯誤、修正它，這可是很棒的進展！本喵覺得，比起每次都答對，這項本領更耐用。"},{"id":18,"tags":"pn","text":"人類的學習地圖好大呀。先選一個想完成的作品當目的地，沿途需要補什麼技能就比較清楚了。"},{"id":19,"tags":"kg","text":"學得太快忘得也快的時候，不妨隔幾天再做一次。本喵經過那條路很多次，才真的記住每一個落腳處。"},{"id":20,"tags":"ge","text":"哪天你能靠自己完成以前不會的事情，記得偷偷得意一下。喵，那可是你花時間養大的新本事呢！"}],"venture":[{"id":1,"tags":"fc","text":"本喵看過很豪華的貓屋，最後大家都去睡它的外箱。嘿嘿，你想賣的東西，和客人真正想要的會不會不一樣？"},{"id":2,"tags":"fo","text":"開新地盤以前，本喵會先巡一圈。看看附近的人在找什麼、誰已經在提供，總比關上門自己猜有趣吧？"},{"id":3,"tags":"ar","text":"一開始就蓋貓咪城堡，可能把罐頭都用光了。先弄個小窩讓客人試試，看看他們真的喜歡什麼嘛。"},{"id":4,"tags":"mf","text":"本喵每天吃多少乾乾、喝多少水，心裡也有個底。生意也要知道賣一份到底剩多少，不然忙得很香卻吃不飽呀。"},{"id":5,"tags":"fg","text":"有人誇你的點子好棒，有人真的拿錢來買，這可不是同一回事。說玩具可愛的人，不一定願意把它帶回家喔。"},{"id":6,"tags":"cf","text":"人類常常先替商品畫好漂亮的包裝，本喵卻最喜歡追人類揉好的包裝紙球。嘿，客人真正喜歡的是你設計的樣子，還是它能替人解決的問題呢？"},{"id":7,"tags":"tu","text":"若想找夥伴一起開店，就像兩隻貓商量怎麼使用一座城堡。誰負責開門、誰管理罐頭、遇事怎麼決定，可以在合作前聊清楚；自己做也要先想好能負擔多少。"},{"id":8,"tags":"mr","text":"本喵不愛把食物全藏在一個角落。做生意的錢和自己吃飯的錢也分開想，才知道究竟是哪個食盆空了。"},{"id":9,"tags":"of","text":"競爭對手不是非得趕走的隔壁貓。看看牠為什麼有人喜歡，也許反而能找到自己不必搶同一塊地盤的方式。"},{"id":10,"tags":"vf","text":"如果客人第一次就不滿意，別急著把所有想法推下桌。問問他是哪裡不好用，或許修一小處就能學到很多。"},{"id":11,"tags":"sn","text":"創業後要一天到晚守著店嗎？本喵想知道，哪怕你休息一天，它還能不能好好運作呢？"},{"id":12,"tags":"rp","text":"本喵進新窩前都會檢查有沒有好走的出口，創業也有合約、許可和成本要弄清楚。光有好點子還不能直接端上桌呀。"},{"id":13,"tags":"co","text":"你不必讓每個人都喜歡你的產品。就像本喵最愛的鮭魚，不見得是隔壁貓的口味，找對客人比較重要嘛。"},{"id":14,"tags":"mr","text":"今天收入多，不見得代表明天有飯吃。試著看看款項什麼時候真的收到、哪些支出先到期，食盆才不容易突然空掉。"},{"id":15,"tags":"cd","text":"有些創業點子是喜歡自己做的，有些是喜歡當老闆的想像。你想打造的日常，究竟是哪一種呢？"},{"id":16,"tags":"nm","text":"小店越忙不一定越賺錢。本喵一口氣追十根逗貓棒也只會累趴，或許該挑真正值得投入的產品先做好。"},{"id":17,"tags":"ug","text":"本喵看過有人買玩具只買一次，也有人天天回來找同一款。你想讓客人再回來的理由，是什麼呢？"},{"id":18,"tags":"dc","text":"別人的意見像窗外不同方向的鳥叫，有些值得聽，有些只是經過。真正要住進這個新地盤的，還是你自己呀。"},{"id":19,"tags":"ar","text":"若一個嘗試的成本太高，不妨先找更小的驗證方式。不是不敢跳，而是本喵想先看看窗台夠不夠穩。"},{"id":20,"tags":"ms","text":"喵，開業成功不是人生從此不必煩惱。希望你的事業除了養得起自己，也能留給你一點真正喜歡的生活。"}],"money":[{"id":1,"tags":"cd","text":"人類把錢看得很重要，本喵也很重視罐頭呀！不過罐頭最後是拿來吃的，錢最後想拿來過什麼樣的生活呢？"},{"id":2,"tags":"mf","text":"食盆看起來滿滿的，不代表明天不用添糧。看看有哪些費用還沒付，才知道自己究竟剩下多少。"},{"id":3,"tags":"rf","text":"本喵聽到零食罐被搖得很大聲，不代表裡面一定裝滿。報酬越是被說得漂亮，越要核對來源、費用和可能的損失呀。"},{"id":4,"tags":"cn","text":"有些東西買回來能玩好多年，有些只新鮮一下午。花錢前想想你是喜歡它，還是喜歡拆包裹的那一刻呢？"},{"id":5,"tags":"mf","text":"如果每次想到錢都皺眉頭，試著先把數字寫清楚吧。本喵不喜歡躲在暗處看不清楚的大東西。"},{"id":6,"tags":"cj","text":"本喵有一張很便宜但睡得很香的毯子。價錢和幸福有時不是同一條刻度，別忘了量量自己的喜歡。"},{"id":7,"tags":"ed","text":"人類有時會羨慕別人亮晶晶的東西，卻看不到人家的帳單。本喵才不想拿別人的食盆來衡量自己呢。"},{"id":8,"tags":"mr","text":"再好的財富計畫，也不能把今天吃飯的錢全吃掉。喵，理想是要有人活得好好的，才有機會實現嘛。"},{"id":9,"tags":"do","text":"一筆錢可以換到玩具，也可以留給將來選擇。你比較需要立即的開心，還是多一點自由轉身的空間？"},{"id":10,"tags":"cm","text":"本喵不會因為鄰居的食盆比較大，就突然吃得比較多。適合你的財務安排，得從自己的需要算起。"},{"id":11,"tags":"mf","text":"數字變得比較大時確實開心，不過別忘了問問錢從哪來、要付出多少。爪子磨壞了可不便宜呀。"},{"id":12,"tags":"mr","text":"本喵的玩具箱有一點空位才好找東西。財務上留些餘裕，也能讓突發狀況不至於把所有安排撞翻。"},{"id":13,"tags":"ms","text":"有些支出可以慢慢省，有些是生活必須。別為了多存一顆乾乾，就讓自己一直餓著肚子。"},{"id":14,"tags":"fr","text":"朋友熱情推薦的新機會，不見得適合你的荷包。本喵願意聞聞別人的罐頭，但不一定要買整箱。"},{"id":15,"tags":"mr","text":"喵，借來的罐頭總有一天要還。要是想借錢，先確認未來拿什麼還、會不會影響日常生活吧。"},{"id":16,"tags":"fr","text":"本喵沒辦法預測下一個食盆什麼時候會滿，人類也別急著把猜想算成收入。先用已經確定的數字比較安心。"},{"id":17,"tags":"cj","text":"錢不只可以拿來買東西，也能換來時間、學習和休息。你現在最想為自己換到哪一樣呢？"},{"id":18,"tags":"vf","text":"若今天花了比預期多的錢，先看看原因，不必對自己哈氣。找到一個能調整的地方，比懊惱整晚有用。"},{"id":19,"tags":"jm","text":"本喵精打細算也會保留買逗貓棒的預算。只要負擔得起，喜歡的小事也可以在財務計畫裡有位置呀。"},{"id":20,"tags":"cs","text":"呼嚕……希望你的錢能幫你過想要的日子，而不是讓你每天只剩下計算錢的日子。"}],"budget":[{"id":1,"tags":"mn","text":"人類的帳單怎麼會每個月自己跑回來？本喵建議先把那些一定會來的支出找出來，才知道有多少乾乾能自由花。"},{"id":2,"tags":"mn","text":"本喵趁人類不注意偷偷叼走一顆零食，一天下來可不只是最初那一顆。那些不起眼的日常開銷，有沒有悄悄排成一長串？"},{"id":3,"tags":"rn","text":"本喵最愛有蓋子的零食盒，每次拿出來才知道吃了多少。給容易超支的項目設個小預算，也許很有用呢。"},{"id":4,"tags":"fn","text":"免費試用的玩具如果忘記退訂，下個月就會自己吃罐頭。檢查一下自動扣款吧，本喵可不想養一堆看不見的會員！"},{"id":5,"tags":"ef","text":"帳本不是用來罵人的。本喵數乾乾是為了知道夠不夠吃，不是為了每吃一顆就懲罰自己。"},{"id":6,"tags":"mp","text":"月底才想存錢，有點像等本喵吃飽才想保留乾乾。若生活費允許，發薪時先留一小部分可能比較容易。"},{"id":7,"tags":"si","text":"購物車裡那個東西，是真的需要，還是現在太累想犒賞自己？先去洗個澡或吃頓飯，等心情穩一點再決定吧。"},{"id":8,"tags":"ms","text":"有些支出能省，但好好吃飯和必要的照顧不該亂省。哼，省到生病，罐頭就要換成藥費啦。"},{"id":9,"tags":"mp","text":"有些費用不會每個月準時出現，像本喵偶爾才把藏在沙發下的玩具拖出來。把年繳、維修或節日花費提早攤入每月預算，荷包比較不容易措手不及。"},{"id":10,"tags":"mf","text":"本喵看見折扣會心動，但買三送一得先有四個罐頭的位置呀！只因便宜就買更多，不一定真的有省錢。"},{"id":11,"tags":"mn","text":"本喵喜歡把吃飯、睡覺和玩耍安排在舒服的位置。人類的錢也可以有自己的位置呀！看看必要開銷和想買的東西各占多少，別讓一時心動擠掉真正需要的生活費。"},{"id":12,"tags":"cd","text":"錢花在哪裡，其實很像本喵在家裡留下的足跡。回頭看看，哪些開銷真的走向你在乎的生活？"},{"id":13,"tags":"ve","text":"這個月失手超支，不必把下個月變成挨餓大賽。找出最能調整的那一項，慢慢把節奏拉回來就好。"},{"id":14,"tags":"nf","text":"人類的付款只要嗶一聲，錢就消失了。本喵覺得睡前花一分鐘看一下今天花了什麼，或許能讓數字重新有感覺。"},{"id":15,"tags":"pn","text":"出門前先想好要買的東西吧。本喵看到店裡的每根羽毛都想要，沒有清單大概會把整間店帶回家。"},{"id":16,"tags":"mf","text":"有時候買貴一點卻用得久，比一直換便宜的更省。別只比標價，也看看能陪你多少個日子。"},{"id":17,"tags":"js","text":"本喵想替你的娛樂預算說句話：能負擔的小快樂不必全部刪掉，這樣省錢的日子才比較容易走得久。"},{"id":18,"tags":"nv","text":"想調整支出，不如先挑最不在乎的一項。對本喵來說，換新的食碗肯定排在罐頭後面！"},{"id":19,"tags":"mr","text":"若收入每月不一樣，可以先用比較保守的數字安排基本支出。剩下的再決定放哪裡，免得一開始就把袋子掏空。"},{"id":20,"tags":"eg","text":"喵，月底看完帳本後也要給自己一個摸摸頭。財務管理不是比誰最會忍耐，而是找出自己能長久維持的方式。"}],"income":[{"id":1,"tags":"fc","text":"有人願意為什麼付費呢？本喵覺得會做一件事之外，還得找到真的需要這件事的人呀。"},{"id":2,"tags":"mf","text":"副業看起來能多添罐頭，別忘了它也會吃掉你的時間和交通費。先算最後真正留下多少再開心嘛。"},{"id":3,"tags":"on","text":"兩個會動的玩具同時出現，本喵也不會每個都撲。選擇收入機會時，哪一項最能用上你已有的技能，而且扣掉成本後真的有合理報酬呢？"},{"id":4,"tags":"rf","text":"有人說很輕鬆就可以賺大錢，還要你先交一堆費用？哼，本喵才不會先把罐頭送去，再相信對方會變出更多罐頭。"},{"id":5,"tags":"af","text":"如果你擅長的本領還沒試著收費，可以先從小任務開始。看看客人需要的成果，跟自己想提供的是不是一致。"},{"id":6,"tags":"ms","text":"收入多一點當然好，可要是忙到連吃飯都忘記，額外那份錢值不值得，也要把身體的成本算進去呀。"},{"id":7,"tags":"tn","text":"本喵最討厭等了半天還沒開罐頭。接案前把報價、交付時間和付款方式講清楚，才不必一直追著人要錢。"},{"id":8,"tags":"tg","text":"談加薪時，別只說最近很辛苦。把做過的成果和多承擔的責任帶去，讓對方看見你實際抓到了什麼。"},{"id":9,"tags":"mf","text":"有些錢只會來一次，有些可以比較穩定地來。若是偶爾收到大包乾乾，可別立刻當成每個月都有喔。"},{"id":10,"tags":"ce","text":"你能不能把收入的一部分建立在自己真正擅長的事上？本喵要是靠游泳吃飯，大概每天都得愁眉苦臉。"},{"id":11,"tags":"df","text":"看見別人靠某個方法賺錢，不表示你也得照著走。人家的時間、經驗和客源，未必是你的起跑點呀。"},{"id":12,"tags":"fr","text":"如果一個工作機會說得很含糊，先問清楚是雇用、接案還是其他合作。不同的罐頭規則，責任也不一樣。"},{"id":13,"tags":"ug","text":"本喵覺得人類的老客戶就像熟悉的好朋友，若能把每次承諾做好，彼此下次合作會比較放心。"},{"id":14,"tags":"rf","text":"為了多賺錢買設備或上課之前，先看看有沒有確實的需求。可別買了一整套捕鳥工具，才發現自己不必抓鳥。"},{"id":15,"tags":"mp","text":"收入不穩的時候，先找找哪一部分能預先安排。不能控制每天有多少客人，至少可以知道自己要接多少工作才夠用。"},{"id":16,"tags":"av","text":"本喵很喜歡新的玩具有試玩時間。新的賺錢方式也能設個小規模試做期，再依實際結果決定是否繼續。"},{"id":17,"tags":"mr","text":"把價格訂得太低，有時反而會讓自己沒有力氣把事情做好。你付出的時間和專業，也該算在那個價錢裡嘛。"},{"id":18,"tags":"mf","text":"人類好像總想找到不必費力的收入。本喵倒希望你先弄懂每種方法實際需要付出的成本、時間和風險。"},{"id":19,"tags":"mr","text":"有些機會需要你放棄現在穩定的工作。先看看過渡期間的生活怎麼安排，再決定要不要跳喔。"},{"id":20,"tags":"cd","text":"未來能多賺多少，本喵不知道。但能讓收入來源與自己期待的生活更相配，就是值得拿來想一想的事。"}],"assets":[{"id":1,"tags":"rm","text":"本喵會把玩具分放在幾個地方，才不會一整箱都被收走。資產也別只看哪個漲得快，想想集中在一起的風險吧。"},{"id":2,"tags":"mp","text":"投資前先問這筆錢幾年內會不會用到。明天要吃的罐頭，可不適合藏到很久以後才拿得出來的地方。"},{"id":3,"tags":"rf","text":"本喵蹲在窗邊看鳥，也不可能知道牠明天會停在哪枝樹上。市場走勢不能靠牌面預測，先弄清楚資金用途及能承受的損失吧。"},{"id":4,"tags":"df","text":"一隻貓用了漂亮的新窩，不代表每隻貓都要跟著買。別人的投資成果，也不一定符合你的目標和條件。"},{"id":5,"tags":"mr","text":"有些資產看起來值很多錢，卻需要很久才能換成現金。食盆空了的時候，漂亮的貓屋可不能直接拿來吃呀。"},{"id":6,"tags":"mf","text":"人類好愛比較報酬率，卻常忘了費用、稅和其他條件。本喵看罐頭時，也會翻過來看實際內容和份量耶。"},{"id":7,"tags":"fr","text":"投資前先看看自己理解這東西到什麼程度。若連它怎麼賺錢都說不清楚，本喵才不急著把肉球伸進去。"},{"id":8,"tags":"pk","text":"長期目標好像窗外遠遠的山。要走到那裡，可以先算算每段路大概需要多少資源，不必每天因一朵雲改路線。"},{"id":9,"tags":"sr","text":"如果漲跌讓你每晚睡不著，或許值得重新看看投入的規模。好計畫不該把午睡的安穩全換走嘛。"},{"id":10,"tags":"fr","text":"看到價格掉下來就急著買，本喵會先聞聞那是特價還是罐頭壞掉。便宜這件事，本身可不能說明值不值得。"},{"id":11,"tags":"rm","text":"用借來的錢投資，有點像借了別人的爪子爬樹，掉下來還得把借的東西還回去。風險可沒有只放大快樂喔。"},{"id":12,"tags":"mn","text":"儲蓄、投資、保障各自有不同用途。就像食盆、水碗、砂盆不能全換成玩具箱，別讓其中一項包辦全部需求。"},{"id":13,"tags":"fr","text":"本喵不喜歡有人催著在五分鐘內買下神祕罐頭。重要的投資決定，應該有時間讀懂條款、核對來源。"},{"id":14,"tags":"nv","text":"一段時間後，資產比例可能和最初想的不一樣。定期看看是不是仍適合自己的目標，比天天猜明天的價錢更有意思。"},{"id":15,"tags":"cd","text":"人類如果正在規劃退休，別只想那時有多少錢，也想想那時希望每天怎麼過。理想的貓生才是算錢的理由嘛。"},{"id":16,"tags":"mr","text":"有些資產還會帶來維護費用。買了房子不只買一個窩，還得準備修繕、持有費和可能的空置成本喔。"},{"id":17,"tags":"vr","text":"投資遇到虧損時，別只為了把失去的錢抓回來就加碼。先問原本的理由還成不成立，比追著尾巴打轉重要。"},{"id":18,"tags":"pd","text":"本喵希望你有自己的投資規則，例如哪些情況該重新評估。這樣看到市場熱鬧時，就不必臨時跟著每隻貓起舞。"},{"id":19,"tags":"hf","text":"如果金額很大、條件又複雜，可以找合格的專業人士一起核對。貓貓的神祕牌可不會代替人類的契約和數字呀。"},{"id":20,"tags":"ms","text":"希望資產慢慢長大的同時，你還能安心吃飯和睡覺。對本喵來說，這也是長期規劃裡很值得留著的東西。"}],"security":[{"id":1,"tags":"sm","text":"本喵最安心的不是今天多吃三罐，而是知道明天有食物、突然下雨也有地方躲。人類的財務安全也像這樣吧？"},{"id":2,"tags":"mp","text":"先算出每月非付不可的生活費，才知道緊急預備金要養到多大。本喵可不會只看食盆外表有多漂亮。"},{"id":3,"tags":"rp","text":"本喵喝水時不小心撥倒了水碗，人類早就準備好一條乾毛巾。預備金也是這樣，不是為了預言意外會發生，只是發生時比較有餘裕處理。"},{"id":4,"tags":"rm","text":"如果收入突然少了一截，哪些開銷能暫時調整呢？本喵覺得先畫好逃生路線，比事情發生才急著找門安心。"},{"id":5,"tags":"mr","text":"有些錢是為了應付緊急狀況，不必每次有機會就拿出去冒險。留在食盆旁邊的乾乾，本來就有它的工作呀。"},{"id":6,"tags":"fr","text":"別只看保單上漂亮的保障金額，也看看什麼時候能用、有哪些不保。雨傘有沒有破洞，得撐開才知道嘛。"},{"id":7,"tags":"rp","text":"人類不太喜歡談生病或失業，不過事前想好怎麼生活，也是一種照顧未來自己的方式喔。"},{"id":8,"tags":"mr","text":"本喵發現很多帳單都不會等人有心情才來。如果手上有債務，先弄清楚還款日、利息和能承擔的數字吧。"},{"id":9,"tags":"rh","text":"本喵不喜歡乾乾快見底才發現新的一包還沒到。若收入暫時中斷，自己的必要生活費能支撐多久呢？先弄清可動用的預備資源吧。"},{"id":10,"tags":"fr","text":"有人要你提供帳號、驗證碼或先轉帳才能領錢？本喵的毛都要炸起來了！先停一下，從可信的管道核對吧。"},{"id":11,"tags":"mh","text":"本喵遇到雷聲會先找個安穩的角落。若臨時費用讓你擔心，先保住必要生活費，再找可行的支援，不必硬撐到無路可退。"},{"id":12,"tags":"pn","text":"把重要文件、聯絡方式和財務資訊整理在安全的地方。遇到突然需要處理的事，就不用翻遍每個紙箱啦。"},{"id":13,"tags":"fn","text":"財務安全感不見得要靠買更多保障商品。先弄清楚自己已經有什麼、還缺什麼，才不會重複買一堆雨傘。"},{"id":14,"tags":"mh","text":"要是正在為房租或生活費煩惱，先找可以實際減輕負擔的支援與選擇。哼，本喵不希望你一個人硬撐到沒飯吃。"},{"id":15,"tags":"ag","text":"一筆預備金若很難一次存到，不妨從小額開始。食盆一顆一顆添，總比只想著要滿出來容易動手。"},{"id":16,"tags":"rm","text":"借錢給別人或替人擔保之前，要想想對方還不出來時自己會怎樣。心意很好，也要保護自己的生活底線呀。"},{"id":17,"tags":"vr","text":"如果想換新的保障方案，先確認舊的和新的怎麼銜接。不要急著把舊毯子丟了，才發現新毯子還沒送到。"},{"id":18,"tags":"fe","text":"本喵知道不確定感很磨人。不過建立安全感可以從確認一項事實開始，不必今天就把所有未來的風險解決。"},{"id":19,"tags":"ge","text":"每存下一點緊急備用的錢，都像替自己多準備一個避雨的屋簷。記得看看自己已經做到的部分，不只看距離目標多遠。"},{"id":20,"tags":"ms","text":"希望你有一天看著自己的財務安排，能像本喵吃飽後一樣安心伸懶腰。保障的目的，原來是讓日子過得自在嘛。"}],"self":[{"id":1,"tags":"ci","text":"本喵從來沒想過自己應該成為哪一種貓，卻每天都會發現一點新的喜好。人類要不要也多認識一下自己，而不是急著改造自己？"},{"id":2,"tags":"is","text":"有時本喵一整天都不想玩，有時又興奮得跑遍客廳。兩種都是我呀，不必只喜歡精神好的那一個自己。"},{"id":3,"tags":"cd","text":"人類總想把自己活成一個標準答案。本喵倒想知道，你如果不用交作業，會想怎麼過今天呢？"},{"id":4,"tags":"cd","text":"本喵喜歡窗邊，卻不是因為每隻貓都喜歡窗邊。你在追尋的東西，是自己喜歡，還是覺得應該喜歡呢？"},{"id":5,"tags":"af","text":"有些事情要親自試試，才知道心裡怎麼想。就像那個看起來很舒服的窩，本喵躺進去才發現太熱了！"},{"id":6,"tags":"vd","text":"本喵把以前喜歡的玩具放在角落，沒有因此否認當時的快樂。人類也可以長出新的興趣，不必對過去的自己不好意思。"},{"id":7,"tags":"ic","text":"若你今天特別想一個人待著，也可以問問自己是想休息，還是有些話不敢說。躲在毯子裡的原因，可不只有一種喔。"},{"id":8,"tags":"ic","text":"本喵的影子有時看起來像另一隻大貓，可它還是跟著我。那些平常不太想面對的部分，也值得慢慢認識呀。"},{"id":9,"tags":"cv","text":"本喵試著鑽進很漂亮的新貓窩，躺了一會兒還是跑去睡地板。原來不喜歡自己以為喜歡的東西，也是一種挺有趣的發現呀！"},{"id":10,"tags":"jc","text":"你還記得上次做某件事做到忘記看時間嗎？本喵每次追逗貓棒都這樣，那份投入也許藏著你的喜好。"},{"id":11,"tags":"ic","text":"本喵發現，不用把每個感受都說得很有道理。先知道自己現在開不開心，就已經得到一條小線索了。"},{"id":12,"tags":"dj","text":"如果很多事情都做給別人看，今天試著做一件不必被誰知道的事吧。本喵舔毛才不需要觀眾呢。"},{"id":13,"tags":"je","text":"人類喜歡說自己應該再成熟一點，本喵可不想把所有好奇心都裝進盒子。長大也能繼續玩呀！"},{"id":14,"tags":"cs","text":"你想保留的習慣，不一定和想改掉的習慣一樣顯眼。那些讓你舒服的日常，也值得記在心裡嘛。"},{"id":15,"tags":"sp","text":"本喵在陌生環境會慢慢熟悉聲音，不會一進門就宣布自己有多勇敢。給自己認識新生活的時間吧。"},{"id":16,"tags":"vd","text":"有些願望是很久以前的你留下來的，現在還喜歡嗎？本喵也會重新看看玩具箱裡哪些東西已經長灰塵了。"},{"id":17,"tags":"im","text":"如果想更了解自己，可以留意什麼時候最容易忘了自己的需要。喵，人類也有一個需要照顧的小食盆。"},{"id":18,"tags":"vc","text":"昨天的你和今天的你想法不一樣，不見得誰錯了。窗外光線不同，看到的細節本來就會變呀。"},{"id":19,"tags":"es","text":"本喵最得意的事，不一定是跳得最高，而是知道累了去哪裡睡。懂得照顧自己，也算是一種本領嘛。"},{"id":20,"tags":"ic","text":"今晚先不替自己下定義好不好？本喵想陪你當一會兒還在認識自己的生物，而不是一張填滿答案的表格。"}],"emotion":[{"id":1,"tags":"ie","text":"本喵炸毛的時候，不會先問自己是不是一隻壞貓。想知道發生了什麼，比急著責怪自己重要呀。"},{"id":2,"tags":"is","text":"有時是餓了，有時是被聲音嚇到，有時只是累了。人類心情亂糟糟的時候，也可以先看看身體在說什麼。"},{"id":3,"tags":"ic","text":"唔……如果心裡有好多話說不出來，先替其中一種感覺取個名字吧。毛線球不用一次全部拆開。"},{"id":4,"tags":"sr","text":"本喵受驚後會找個安全角落，等耳朵慢慢放鬆。情緒來得快，消退卻不一定要一樣快喔。"},{"id":5,"tags":"ic","text":"你生氣的時候，心裡也許有個很在乎的東西被碰到了。先看看那是什麼，不必急著把怒氣趕走。"},{"id":6,"tags":"ei","text":"難過的日子不需要特別表演堅強。本喵眼睛瞇起來時，你也不會要求我立刻睜得圓滾滾吧？"},{"id":7,"tags":"si","text":"有時心情不好不是因為今天那件小事，而是之前的疲倦一起跑了出來。像毛球一樣，原來是慢慢累積的呢。"},{"id":8,"tags":"si","text":"如果腦袋總在重播一段話，可以先把注意力帶回腳下、呼吸和眼前的房間。來，本喵就在這裡。"},{"id":9,"tags":"fr","text":"本喵聽見怪聲會留神，卻不會因此確定有怪物。焦慮讓人想到的事情，不一定已經發生囉。"},{"id":10,"tags":"iv","text":"明明很開心，下一刻卻有些失落，也不奇怪。人類的心情好像窗邊的光，會移動才是正常的樣子。"},{"id":11,"tags":"ic","text":"羨慕別人的時候，不妨想想自己真正想要的是什麼。隔壁貓的玩具，也許只是提醒了本喵原來很想玩。"},{"id":12,"tags":"ib","text":"你感到委屈，未必需要馬上原諒誰。先看看哪裡疼，等有力氣了再想下一步也可以。"},{"id":13,"tags":"hs","text":"要是你忍著不哭，只因怕別人覺得麻煩，本喵想留半張毯子給你。這裡不用急著收拾表情。"},{"id":14,"tags":"ht","text":"有些孤單不是身邊沒有人，而是沒有人聽懂自己的話。想找個信任的人說一點真心話嗎？"},{"id":15,"tags":"sa","text":"本喵被聲音嚇到時，會先走到安靜的地方，把尾巴慢慢鬆開。若你也覺得緊繃，安全的散步或短暫安靜並不必趕走感受，只是給身體一點喘息。"},{"id":16,"tags":"rs","text":"情緒很大聲的時候，做重要決定也許可以等等。先讓尾巴停止猛烈拍地板，過一會兒再想也不遲。"},{"id":17,"tags":"ic","text":"本喵今天想借你一個小問題：此刻的感受，是想被理解、想找個辦法，還是想先安靜一下呢？"},{"id":18,"tags":"js","text":"偶爾心情平平也很好，不必每天都很有活力。沒有追逐、沒有大事的午後，也可以算好日子呀。"},{"id":19,"tags":"hs","text":"若不舒服的感覺一直留著，甚至影響睡眠和生活，可以找信任的人或專業人士陪你整理。本喵也想你得到更多照顧。"},{"id":20,"tags":"si","text":"呼嚕……今天不必把自己哄得立刻開心。允許心情慢慢變化，就像陪著窗外的雨下完一樣。"}],"values":[{"id":1,"tags":"es","text":"本喵沒有抓到鳥、也沒有拿到獎狀，還是照樣值得吃飯睡覺。你也不用拿成果換一張被疼愛的門票吧？"},{"id":2,"tags":"ed","text":"有些貓長毛、有些短毛，誰也不用先變成另一隻才算可愛。你身上那些不太一樣的地方，也有自己的樣子嘛。"},{"id":3,"tags":"ei","text":"人類說你很棒時可以開心，但本喵希望就算今天沒人誇你，你也不會把自己的價值扣到零。"},{"id":4,"tags":"cd","text":"如果每次選擇都先想別人會不會失望，心裡那隻小貓什麼時候才輪得到發言呢？"},{"id":5,"tags":"ei","text":"本喵昨天跳櫃子沒站穩，落地後立刻假裝舔毛若無其事。哼，犯了一個錯，也不會讓本喵整隻變差呀！"},{"id":6,"tags":"cd","text":"有些原則在沒人看見時，更能說明你是誰。本喵會在乎你怎麼對待不會給你罐頭的人。"},{"id":7,"tags":"cd","text":"如果別人的期待和你的價值觀打架，不妨想想哪一邊的選擇，會讓你過幾天仍然尊重自己。"},{"id":8,"tags":"fb","text":"不是所有稱讚都需要接住，也不是所有批評都需要吞下去。先聞一聞，有些東西根本不是你的食物。"},{"id":9,"tags":"ec","text":"本喵並不擅長每一種遊戲，但我很喜歡自己會玩的那幾種。承認不擅長的事，也不會讓擅長的消失呀。"},{"id":10,"tags":"ed","text":"有人喜歡本喵圓滾滾的臉，也有人喜歡尖尖的臉。外面的標準每天都能換，何必把自己交給它保管？"},{"id":11,"tags":"ei","text":"你是不是常把對別人的體諒，忘了分一點給自己？如果朋友做錯同樣的事，你會用同樣難聽的話罵他嗎？"},{"id":12,"tags":"eb","text":"本喵的尾巴只要自己舒服，不需要符合美麗尾巴排行榜。身體可不是拿來替別人的審美交作業的。"},{"id":13,"tags":"ec","text":"你最珍惜自己的哪種特質呢？不一定是很厲害的能力，也可以是願意聽別人把話說完的耐心。"},{"id":14,"tags":"vd","text":"如果你以前為討好別人做了很多事，也不必對那時的自己生氣。現在可以慢慢練習用自己的標準選擇了。"},{"id":15,"tags":"ei","text":"本喵不喜歡輸贏決定整天的心情。就算另一隻貓跳得比我高，我照樣有喜歡自己的理由呀。"},{"id":16,"tags":"dr","text":"有些重要的選擇不一定能讓所有人理解。只要你看清後果、願意負責，就不必一直等全世界點頭。"},{"id":17,"tags":"eh","text":"人類有時會把能幫多少人，當成自己有多重要。可本喵什麼忙都沒幫的時候，你不也喜歡我嗎？"},{"id":18,"tags":"eg","text":"你可以想讓自己變得更好，也同時接受現在的自己。就像本喵努力學跳高，卻沒有討厭還不會跳的那雙爪。"},{"id":19,"tags":"cg","text":"如果某件事做完讓你覺得踏實，即使沒有得到掌聲，也值得記住那種感覺。它可能比掌聲更接近你的價值觀呢。"},{"id":20,"tags":"es","text":"哼，本喵今天決定不辦自我評分大賽了。你不必是最厲害的人，才有資格過自己喜歡的日子。"}],"direction":[{"id":1,"tags":"ao","text":"人類常常想知道一條路會通到哪裡才敢走。本喵覺得有些路，先去看看第一個轉角就夠了嘛。"},{"id":2,"tags":"of","text":"如果有三扇門想進去，不必立刻選一扇永遠不回頭。先看看每扇門後的日常，才知道自己願意待多久。"},{"id":3,"tags":"cv","text":"你現在想要的是新的生活，還是想離開現在的生活？兩個願望很像，卻可能把你帶去不同的窗台喔。"},{"id":4,"tags":"po","text":"本喵有時只在地圖上記幾個舒服的落腳點。人生規劃也不必每一格都填滿，可以留一些未知的路。"},{"id":5,"tags":"ja","text":"如果某個願望一直回來找你，或許可以認真給它一點時間。不必立刻為它搬家，先看看它想帶你去哪裡。"},{"id":6,"tags":"ed","text":"人類很喜歡問自己幾歲該做到什麼。本喵可沒有規定幾歲要登上最高的書櫃呀！"},{"id":7,"tags":"cp","text":"一條路看起來風景很好，也要看看平常走起來舒不舒服。別只想抵達那天的樣子，也想想沿途的日子。"},{"id":8,"tags":"ve","text":"本喵換了好幾次睡覺的位置，才找到最合適的地方。曾經走錯的路，也能告訴你自己更需要什麼。"},{"id":9,"tags":"dc","text":"如果沒有任何人的期待，你還會選現在這個方向嗎？本喵想聽的是你自己的聲音，不是隔壁貓的喵叫。"},{"id":10,"tags":"ap","text":"有些夢想需要準備，有些本來就可以小小地開始。別把所有願望都養成非等將來才做得到的大怪獸。"},{"id":11,"tags":"cr","text":"兩條路各有想要的東西時，想想哪一種代價比較願意承擔。本喵想爬高，也得接受下來時要多花些力氣。"},{"id":12,"tags":"dj","text":"本喵聞了貓薄荷就開心打滾，從來沒想過要把它變成職業。你喜歡的事有時只是讓生活變有趣，不需要拿它去換名片嘛！"},{"id":13,"tags":"af","text":"未來若還看不清，找一個小小的實際體驗吧。跟著了解的人走過一段，比在房間裡想像整座森林清楚。"},{"id":14,"tags":"vs","text":"也許你想要的不是新目的地，而是不同的走路速度。人生有時是調整節奏，不一定要把所有事情重來。"},{"id":15,"tags":"ci","text":"覺得時間不夠時，不妨問自己真正怕錯過的是什麼。追光點追得太急，可會忘記窗外有整片天空呢。"},{"id":16,"tags":"pd","text":"本喵有一個最喜歡的窗台，卻不是每天都得坐在上面。人生的方向也能給你指引，不必成為每天的命令。"},{"id":17,"tags":"vc","text":"如果曾經的理想已經變得陌生，可以重新問問現在的自己想要什麼。換毛之後，選一張新毯子也很合理嘛。"},{"id":18,"tags":"rp","text":"有些人生選擇不容易回頭，先弄清楚資源和支持在哪裡。勇敢不等於要閉著眼睛從高處跳下去呀。"},{"id":19,"tags":"gp","text":"先記下今天想得到的那一小點改變吧。等日子過一陣子，再看看這個方向是否仍讓你有精神。"},{"id":20,"tags":"cd","text":"喵，沒有一張牌能替你決定未來。不過本喵很願意陪你看看，哪一種生活讓你的眼睛亮了一下。"}],"balance":[{"id":1,"tags":"sb","text":"本喵每天吃飯、理毛、玩耍、睡覺，沒有哪一項得先證明自己有用才可以做。人類的休息也該排進日程呀。"},{"id":2,"tags":"sn","text":"你把每個空白時間都填滿了嗎？本喵的窩如果塞滿玩具，可就找不到睡覺的地方啦。"},{"id":3,"tags":"sj","text":"明明在吃飯眼睛卻盯著工作訊息，好像食盆放在桌上卻沒真正碰到它。要不要先享受完今天這一餐？"},{"id":4,"tags":"hm","text":"家裡有人要照顧，工作又等著你處理，真的很忙呢。有沒有一件事可以請另一雙手幫忙，讓你喘口氣？"},{"id":5,"tags":"sb","text":"本喵不會一天到晚追著逗貓棒。玩耍太久也會累，原來喜歡的事也需要留個停止的時間呀。"},{"id":6,"tags":"ss","text":"人類說等忙完就休息，可是忙完那天到底哪時候來呢？不如先替自己保留一段不必做事的時間吧。"},{"id":7,"tags":"sn","text":"睡前那個亮亮的盒子讓你又捨不得閉眼嗎？本喵想把它收走一小會兒，讓今天有個真正安靜的結尾。"},{"id":8,"tags":"nb","text":"有些責任不能放掉，不代表所有事情都要做到一百分。看看哪一件只要做好基本的就夠了，別把爪子磨得太薄。"},{"id":9,"tags":"js","text":"一週如果都沒有期待的小事，本喵會悶得慌。排一點散步、興趣或跟喜歡的人見面的時間，好不好？"},{"id":10,"tags":"sk","text":"別因為昨天沒運動，今天就逼自己動到沒力氣。生活節奏像巡地盤，能經常走才比一次走到底有用。"},{"id":11,"tags":"bs","text":"本喵需要自己的安靜角落，人類也需要一段不被打擾的時間。這不是偷懶，是你真正擁有的生活。"},{"id":12,"tags":"sv","text":"假日都在補平日沒做完的雜事，難怪星期一又想躲進被窩。能不能少安排一件，留半天真的放假呀？"},{"id":13,"tags":"sm","text":"你照顧別人的時間好多，自己的食盆卻總是最後才添。下次看看能不能在幫忙前先吃飯、喝水，別讓自己空著肚子忙。"},{"id":14,"tags":"vp","text":"本喵覺得平衡不是每天都一模一樣。有時工作多一些，有時家人多一些，只要長期還能照顧到自己的需要嘛。"},{"id":15,"tags":"tn","text":"手機的鈴聲一響，人類就伸手去抓。試試替不急的訊息安排固定查看時間吧，讓耳朵偶爾也能放假。"},{"id":16,"tags":"nv","text":"如果一件新活動排進生活，或許該看看哪件舊事可以減少。紙箱不是無限大的，行程也一樣耶。"},{"id":17,"tags":"sv","text":"每天留一點從工作回到生活的過渡時間吧。換件衣服、走一小圈，像本喵巡完地盤再回毯子一樣。"},{"id":18,"tags":"js","text":"本喵曬完太陽偶爾會舒服得打個大哈欠，也有時想玩一小段逗貓繩。恢復力氣不只有睡覺，哪些小事真正讓你的精神回來呢？"},{"id":19,"tags":"vn","text":"行程突然被打亂時，不必把整天判定失敗。把非做不可的留下，其他挪一下，就還能找回一點舒服的節奏。"},{"id":20,"tags":"ss","text":"呼嚕……本喵想陪你過一種日子，不需要等到累壞才肯休息，也不必每次開心之後都急著補償進度。"}]};

 for(const k of Object.keys(n.derived))if(!Number.isSafeInteger(raw.derived[k])||raw.derived[k]<0||raw.derived[k]>MAX_INT)throw Error('星光推導值無效');

function openDB(){

  let req;
  try{req=indexedDB.open(DB_NAME,DB_VERSION)}catch(e){reject(e);return}
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};
  req.onerror=()=>reject(req.error||Error('星光資料庫無法開啟'));
  req.onblocked=()=>reject(Error('另一個遊戲分頁正在占用星光資料庫'));

.star-main-score strong{font-family:Georgia,serif;font-size:46px;font-weight:500;color:#f0d99e;line-height:1.2}
.star-main-score span{font-size:14px}
.star-main-meter{width:min(350px,85%);height:7px;background:#111a2e;border:1px solid #786d6f78;border-radius:40px;overflow:hidden;margin:0 auto}
.star-main-meter span{display:block;height:100%;background:linear-gradient(90deg,#a894c4,#e5ce93);border-radius:40px;transition:width .35s ease}
.star-small{color:#adb7cd;font-size:11px;line-height:1.8;margin:16px 0 0}
.star-notice{padding:9px 13px;color:#edce99;background:#4d383542;border-left:2px solid #cda76e;font-size:12px;border-radius:6px}
.star-filters{display:flex;gap:7px;overflow-x:auto;padding:20px 1px 14px;scrollbar-width:thin}
.star-filter{border:1px solid #68728d;border-radius:100px;padding:9px 14px;min-height:37px;white-space:nowrap;font-size:12px;color:#cbd4e4;background:#202c42;cursor:pointer;flex-shrink:0}
.star-filter.is-active{background:#e3cba2;border-color:#e3cba2;color:#202a3e;font-weight:700}
.star-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.star-achievement{display:flex;flex-direction:column;min-width:0;min-height:214px;padding:18px 17px 16px;border:1px solid #586880;background:linear-gradient(150deg,#29354c,#1d283d);border-radius:18px;position:relative}
.star-achievement.is-unlocked{border-color:#b9a174;background:radial-gradient(ellipse at top right,#544e6880,transparent 57%),linear-gradient(155deg,#33415a,#202c42)}
.star-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}
.star-medallion{display:grid;place-items:center;width:46px;height:46px;border:1px solid #748099;border-radius:50%;background:#202d43;color:#8995b2;font-size:23px;flex:none}
.star-medallion.glow{color:#ebcd8e;border-color:#c6a772;background:radial-gradient(circle,#53445a 0%,#2e354c 80%);box-shadow:0 0 20px #c6a77233,inset 0 0 7px #d9b47036}
.star-state{font-size:10px;color:#9dacbf;text-align:right}
.star-achievement.is-unlocked .star-state{color:#e6cb95}
.star-name{font-family:Georgia,'Noto Serif TC',serif;font-size:17px;letter-spacing:.03em;color:#efe7dc;margin:0 0 8px;line-height:1.5}
.star-description{font-size:12px;line-height:1.8;color:#bac4d1;margin:0 0 16px;flex:1}
.star-awarded{font-size:11px;color:#d9bf90;margin:0;padding-top:10px;border-top:1px solid #f1e0b52b}
.star-condition{font-size:11px;color:#8c98b1;letter-spacing:1px;margin:0}
.star-card-progress{margin-top:auto}
.star-card-progress-label{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:#aab7cb;margin-bottom:6px}
.star-card-meter{height:5px;background:#0f192a;border-radius:30px;overflow:hidden}
.star-card-meter i{display:block;height:100%;background:#bca5bc;border-radius:30px}
.star-footnote{color:#abb5ca;line-height:1.9;font-size:11px;text-align:center;margin:22px 0}
.star-menu-progress{margin-left:auto;font-size:10px;color:#e8c78d;border:1px solid #897b70;border-radius:20px;padding:1px 6px;white-space:nowrap}
@media(max-width:750px){.star-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.star-achievement{padding:15px 13px;min-height:214px}}
@media(max-width:370px){.star-achievement{padding:13px 10px}.star-name{font-size:15px}.star-description{font-size:11px}.star-medallion{width:39px;height:39px;font-size:20px}}
@media(prefers-reduced-motion:reduce){.star-main-meter span{transition:none}}
