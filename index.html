.form-label {color:#5A4535}
textarea {background:#FFFEFA;color:var(--ink);border:1px solid #D6C7B2;box-shadow:inset 0 1px 2px #80623A0C}
textarea::placeholder {color:#9B8C7A}
textarea:focus {border-color:#AD875C}
.chip {background:#F6F0E5;color:#645447;border:1px solid #D8C7B1}
.chip.active {background:#DCC5A4;border-color:#A57D54;color:#4E3928}
.mode {background:#FFFDF6;color:var(--ink);border:1px solid #DACBB8}
.mode.active {background:linear-gradient(145deg,#F1E2CC,#EAD6B8);border-color:#A9835C;box-shadow:inset 0 0 0 1px #E8D0AE}
.mode-symbol {color:#9B7957}
.mode-sub {color:#84786A}
.primary {background:linear-gradient(110deg,#A87B54,#916341);color:#FFFBF3;box-shadow:0 8px 17px #84644930,inset 0 1px #FFFDFA40}
.secondary {background:#FFF9EE;border:1px solid #BBA181;color:#775338}
.line-link {color:#886647}
.progress-bar {background:#E5D8C4}
.progress-bar>div {background:linear-gradient(90deg,#AB845D,#D4AF83)}
.pick-card {background:linear-gradient(145deg,#E7D8BF,#D3B999);border:1px solid #B49977;box-shadow:0 4px 8px #84664536}
.pick-card:before {border-color:#FEF7E5BA}
.pick-card.selected {background:linear-gradient(145deg,#D4B28A,#AF8865);border-color:#876244;box-shadow:0 0 0 2px #B7855670,0 0 12px #B48B5A55}
.pick-card.selected:after {color:#FFFDF6}
.paw-print .toe,.paw-print .pad {background:#795941}
.pick-card .paw-print {filter:drop-shadow(0 0 3px #FFF8E5A8)}
.picked-slot {border-color:#C4B19A;color:#A28B75}
.picked-slot.filled {background:linear-gradient(145deg,#DCC6A7,#CDB08B);border-color:#9C7954;color:#5B4230;box-shadow:0 0 12px #B5916655}
.deck-count {color:#8B6649}
.reading-card {background:linear-gradient(155deg,#FFFCF5,#F6EDE0);border:1px solid #DCC9B1;box-shadow:0 10px 25px #78614920}
.reading-card .index {color:#8C694D}
.art,.art.has-external,.art>.external-card-image {background:var(--card-paper)}
.art-loading {color:#8D7863}
.face-item {background:#FFFCF4;color:var(--ink);border:1px solid #DCCAB2;box-shadow:0 7px 16px #79624624}
.face-item .art {border-color:#C4AD8D}
.face-role,.sheet-card-title .group {color:#837366}
.pill-row .tag,.tag {background:#EDE1CF;color:#674D39}
.card-advice,.read-block p,.role-block p {color:#665649}
.cat-quote {background:#F4E8D6;border-left-color:#AA835D;color:#79573D}
.read-block {background:#FFFDF7;border:1px solid #DDCEBC}
.read-block p strong[style] {color:#865E3E !important}
.ornament {background:linear-gradient(90deg,transparent,#BDA88B,transparent)}
.topic-flag {background:#F6EDDE;color:#866548;border:1px solid #CBB89D}
.pair-block {border-left-color:#AD9276;color:#685447}
.pair-name {color:#865A3B}
.summary-lead {color:#584537}
.summary-quote {color:#895D3B}
.empty {border-color:#C9B8A1;color:#776B5E}
.status-banner {background:#F4E8D5;color:#6B503B;border-color:#D2B99A}
.role-block {border-bottom-color:#E3D6C4}
.role-count {color:#82603F;border-color:#BCA388}
.role-head strong {color:#6D4B36}
.role-head span:last-child {color:#7A7064}
.hint-card {background:#F9F2E7;border-color:#E1D2BD}
.hint-card strong {color:#865F42}
.modal-overlay {background:#352C2787}
.modal {background:#FFFCF5;color:var(--ink);border-color:#C9B295;box-shadow:0 -12px 38px #4A372B39}
.modal-grab {background:#D0BFA7}
.modal-close {background:#F1E4D3;color:#6E4E39}
.modal p {color:#6B5A4C}
.toast {background:#71513A;color:#FFF9F0;border-color:#B69B7A;box-shadow:0 10px 25px #4A372B40}
button:focus-visible,textarea:focus-visible {outline-color:#A47751}

</style>

<style id="interactive-story-v3">

.story-head{background:linear-gradient(145deg,#F6EDDE,#EFE2CE);border:1px solid #D4BFA1;padding:17px;border-radius:16px;margin-bottom:14px}

.story-section-title{font-size:13px;font-weight:750;color:#855D3E;margin:17px 0 8px}

<style id="five-story-v4">

ore","ideal"],"focus":"熱情追尋","step":"讓想像與現實對齊"},{"id":7,"name":"踩奶按摩","scene":"貓咪微閉雙眼，在柔軟的幾何墊上交替按壓前爪。","core":"自我安撫、穩定儀式、溫柔節奏","positive":"找回能讓自己平靜的小習慣，例如規律休息、熟悉的活動或安穩的生活節奏。","caution":"熟悉感值得珍惜，但若因此一直迴避必要改變，也可以先從很小的嘗試開始。","synthesis":"先溫柔安頓自己，再一步步向外探索。照顧感受與持續成長並不衝突。","group":0,"keys":["自我安撫","穩定儀式","溫柔節奏"],"pace":-1,"tags":["rest","care"],"focus":"規律安撫","step":"照顧自己的節奏"},{"id":8,"name":"夜間跑酷","scene":"貓咪騰空跳躍，身體伸展、尾巴高揚，以動態線條表現突然爆發的精力。","core":"能量爆發、突破常規、無拘無束","positive":"若你有想嘗試的新方法，可把積累的創意轉為具體的小型實驗，打開既有框架。","caution":"爆發力若缺乏方向與休息，可能打亂節奏；留意實際負荷與周圍人的配合需求。","synthesis":"把衝勁放在合適的方向上，創意便能成為推力，而不是讓自己疲於奔命。","group":0,"keys":["能量爆發","突破常規","無拘無束"],"pace":2,"tags":["action","disrupt"],"focus":"釋放創意與精力","step":"為衝勁設定方向"},{"id":9,"name":"優雅理毛","scene":"貓咪端坐，抬起一條後腿，低頭專注整理毛髮。","core":"自我整頓、重拾秩序、由內而外","positive":"先把可掌握的生活細節、環境和身心狀態整理清楚，讓自己更從容地處理新任務。","caution":"整理若變成無止境的完美追求，也可能拖慢真正重要的事；區分必要準備與表面忙碌。","synthesis":"有條理的生活是支持行動的基礎。整理到足夠好，就可以放心前進。","group":0,"keys":["自我整頓","重拾秩序","由內而外"],"pace":-1,"tags":["order","care"],"focus":"整理自身狀態","step":"理順眼前的生活"},{"id":10,"name":"呼嚕引擎","scene":"貓咪放鬆縮成一團，雙眼微閉，神情安詳而滿足。","core":"內在滿足、平和共振、當下喜悅","positive":"留意此刻有哪些真實可感的幸福與安穩來源，讓平靜成為日常的支持。","caution":"感到滿足很好，但仍可留意尚未處理的小問題，避免以「一切都好」取代實際檢視。","synthesis":"喜悅不需要證明，也不必掩蓋困難。珍惜眼前的好，同時保留清醒的眼光。","group":1,"keys":["內在滿足","平和共振","當下喜悅"],"pace":0,"tags":["rest","support"],"focus":"感受內在滿足","step":"辨認真實的安定來源"},{"id":11,"name":"炸毛弓背","scene":"貓咪弓起背部、毛髮豎立、尾巴膨起，呈現明確防禦姿態。","core":"高度戒備、情緒應激、自我保護","positive":"如果某種互動讓你感到不適，可以先拉開距離，了解讓自己緊繃的因素。","caution":"感受到威脅不等於威脅已被證實；在守住界線的同時，試著區分事實、猜測和過往經驗。","synthesis":"防禦是提醒你值得被保護的需求。先照顧自己，再以實際資訊判斷是否需要繼續戒備。","group":1,"keys":["高度戒備","情緒應激","自我保護"],"pace":-2,"tags":["caution","boundary"],"focus":"提高防備","step":"確認真正的威脅來源"},{"id":12,"name":"飛機耳","scene":"貓咪身體微低伏，雙耳朝兩側壓平，顯得緊張或不自在。","core":"委屈壓抑、無聲抗議、承受壓力","positive":"如果你正勉強承受某些期待，試著辨認自己能負荷的程度，並以合適方式表達不舒服。","caution":"長期忽視自己的需要可能累積疲憊；能溝通的事，盡量不要等到難以承受才說出口。","synthesis":"你的感受值得被聽見。清楚表達界線，有助於建立更可持續的相處方式。","group":1,"keys":["委屈壓抑","無聲抗議","承受壓力"],"pace":-1,"tags":["pressure","boundary"],"focus":"承受不適與壓力","step":"表達自己的負荷"},{"id":13,"name":"窗邊凝望","scene":"貓咪坐在幾何窗框前，望向窗外一隻由簡單幾何形狀拼成的飛鳥。","core":"渴望自由、心生嚮往、規劃藍圖","positive":"如果你正在嚮往不同生活，可以先把想像中的方向寫得更具體，再尋找可行的第一步。","caution":"長久只看著遠方、卻沒有準備行動，也可能累積失落；留意現實條件和真正需要。","synthesis":"遠方的風景可以成為目標。把嚮往變成可安排的步驟，窗外就不只是想像。","group":1,"keys":["渴望自由","心生嚮往","規劃藍圖"],"pace":0,"tags":["change","desire"],"focus":"嚮往新方向","step":"勾勒可行的藍圖"},{"id":14,"name":"慢眨眼","scene":"貓咪安靜端坐、頭微傾，雙眼柔和地緩慢閉合。","core":"釋出善意、放下敵意、溫柔信任","positive":"若情境適合，可以用真誠的傾聽與溫和的表達開啟對話，降低不必要的對立。","caution":"善意不等於無條件信任；若曾出現反覆違反界線的情況，可保留距離並觀察實際行為。","synthesis":"溫柔可以和清楚的界線同行。信任不靠猜測，而是從一次次尊重中慢慢建立。","group":1,"keys":["釋出善意","放下敵意","溫柔信任"],"pace":0,"tags":["connect","support"],"focus":"柔和示好","step":"建立真誠交流"},{"id":15,"name":"哈氣警告","scene":"貓咪張嘴露出尖牙、身體緊繃，作出警告姿態。","core":"明確拒絕、守住底線、表達立場","positive":"當重要原則受到挑戰時，可以清楚說明自己的需求和可接受範圍。","caution":"強烈情緒可能讓訊息失焦；在安全條件允許下，以堅定、具體的說法代替擴大衝突。","synthesis":"拒絕並不需要傷害對方。清楚表達界線，讓彼此知道如何互相尊重。","group":1,"keys":["明確拒絕","守住底線","表達立場"],"pace":1,"tags":["boundary","action"],"focus":"清楚拒絕","step":"說明自己的界線"},{"id":16,"name":"翻肚誘惑","scene":"貓咪翻身露出部分肚皮，四肢微彎，呈現親近又帶保留的姿態。","core":"魅力展現、試探靠近、亦真亦假","positive":"適度展現輕鬆與親切，可以增加互動機會；不必在初次接觸時急著定義關係。","caution":"看起來迷人的邀請仍需了解條件和意圖；保留界線，不以表面親近替代可靠的互動證據。","synthesis":"你可以開放心門，也可以慢慢確認。親密與自我保護可以同時存在。","group":1,"keys":["魅力展現","試探靠近","亦真亦假"],"pace":1,"tags":["connect","caution"],"focus":"靠近與試探","step":"確認互動的條件"},{"id":17,"name":"呆滯放空","scene":"貓咪筆直坐著、眼神短暫失焦，舌尖露出一小截。","core":"資訊過載、大腦當機、暫時抽離","positive":"若感覺思緒繁雜，不妨暫停接收資訊，給自己一段不用立即回答的時間。","caution":"在疲憊時更容易忽略細節；重要的工作與決策可以延後核對，或請可信賴的人共同檢查。","synthesis":"空白並非浪費。讓注意力重新整理，再回來處理真正重要的訊息。","group":1,"keys":["資訊過載","大腦當機","暫時抽離"],"pace":-2,"tags":["rest","confusion"],"focus":"資訊過載","step":"暫時減少雜訊"},{"id":18,"name":"夜視瞳孔","scene":"貓咪蹲坐在深灰色場景中，雙眼映出微光，放大的瞳孔帶出警覺與專注。瞳孔不畫成純白圓點。","core":"辨識訊息、看穿表象、直覺敏銳","positive":"在局勢不明時，先放慢判斷，留意被忽視的訊息並逐項查證。","caution":"不確定感也容易引發過度聯想；不要把猜測或直覺當成對他人的事實判定。","synthesis":"敏銳的觀察若加上求證，就能成為清晰的判斷；別讓黑暗放大了想像中的怪物。","group":1,"keys":["辨識訊息","看穿表象","直覺敏銳"],"pace":-1,"tags":["observe","clarity"],"focus":"留意細節","step":"查證實際線索"},{"id":19,"name":"互相理毛","scene":"兩隻幾何貓咪親暱靠近，彼此輪流低頭舔拭對方的頭頂與頸部，清楚表現互相照顧。","core":"雙向滋養、平等互信、溫柔支持","positive":"這張牌象徵互相照應的理想互動，提醒你珍惜善意，也檢視實際相處是否讓彼此都被理解。","caution":"若照顧長期只由一方承擔，可能形成負擔；適時說清楚期待與可負荷的程度。","synthesis":"好的連結需要願意來回的支持。觀察實際行動、真誠回應，讓關係保持平衡。","group":2,"keys":["雙向滋養","平等互信","溫柔支持"],"pace":0,"tags":["support","connect"],"focus":"互相照應","step":"尋找平等的支持"},{"id":20,"name":"尾巴勾勾","scene":"一隻貓向前邁步，另一隻安靜端坐，兩隻自然長度的尾巴輕輕交勾。","core":"無聲默契、獨立相伴、心靈連結","positive":"可以練習在陪伴中保有各自的興趣與步調，不必以時時刻刻相處作為親密的唯一標準。","caution":"默契不能完全代替溝通；若感到距離改變，不妨用具體提問確認彼此需要。","synthesis":"自由與連結可以共存。保留空間，也留意把關心說出來的時機。","group":2,"keys":["無聲默契","獨立相伴","心靈連結"],"pace":0,"tags":["connect","boundary"],"focus":"獨立而連結","step":"尊重彼此空間"},{"id":21,"name":"領地標記","scene":"貓咪用臉頰和下巴磨蹭垂直幾何桌腳，呈現熟悉環境中的領地標記行為。","core":"建立歸屬、確認位置、畫出界線","positive":"在新環境中清楚表達自己的角色與需求，逐步建立可安心投入的空間。","caution":"歸屬感不等於所有權；記得尊重其他人的界線、選擇與自主。","synthesis":"站穩自己的位置，也讓他人保有位置，才更容易建立互相尊重的關係。","group":2,"keys":["建立歸屬","確認位置","畫出界線"],"pace":0,"tags":["boundary","security"],"focus":"建立歸屬","step":"確認互動界線"},{"id":22,"name":"背對背坐","scene":"兩隻貓咪背靠背而坐，頭朝不同方向，身體接近但各自安靜。","core":"各自冷靜、空間需求、互不干擾","positive":"若互動暫時緊繃，可以給彼此一段整理情緒的時間，之後再討論需要談的問題。","caution":"空間有助冷靜，但若長期不願對話，也可能累積誤解；可約定再溝通的時機。","synthesis":"暫時背對背不必等於關係疏離。尊重距離，也保留重新轉身的可能。","group":2,"keys":["各自冷靜","空間需求","互不干擾"],"pace":-1,"tags":["rest","boundary"],"focus":"需要留白","step":"安排冷靜與溝通"},{"id":23,"name":"搶奪紙箱","scene":"兩隻貓咪擠進同一個狹窄幾何紙箱，彼此推擠、爭取有限位置。","core":"資源競爭、利益衝突、立場碰撞","positive":"當資源有限時，先清楚提出自己的需要，並了解可能的分配方式。","caution":"若只執著於眼前的小空間，可能忽略替代方案；不要未經確認就把競爭理解成惡意。","synthesis":"爭取應有權益，也留意能否擴大選擇；有時真正的解法在箱子外面。","group":2,"keys":["資源競爭","利益衝突","立場碰撞"],"pace":1,"tags":["conflict","resources"],"focus":"資源與立場碰撞","step":"尋找合宜的分配"},{"id":24,"name":"蹭腿撒嬌","scene":"貓咪尾巴高揚，沿著人類幾何小腿彎身輕蹭，表現主動靠近。","core":"主動示好、尋求協助、柔軟身段","positive":"若需要協助，可以直接且真誠地表達需求，不必把求助視為失去能力。","caution":"尋求支持時也要保留自主，避免為了得到回應而過度迎合。","synthesis":"柔軟是一種勇氣。把需要說清楚，也相信自己能參與解決問題。","group":2,"keys":["主動示好","尋求協助","柔軟身段"],"pace":1,"tags":["connect","support"],"focus":"主動求助","step":"提出真實需求"},{"id":25,"name":"門縫偷窺","scene":"半開的幾何門後方，貓咪小心探出半顆頭，觀察門外環境。","core":"探索未知、謹慎試探、保持距離","positive":"面對新環境或不熟悉的人，先收集資訊、確認安全，再決定如何接近。","caution":"一直停留在觀察階段，可能讓自己錯過想參與的事；但是否跨出仍以實際情況為準。","synthesis":"謹慎是保護自己的一種方式。準備足夠後，再選擇適合自己的步伐。","group":2,"keys":["探索未知","謹慎試探","保持距離"],"pace":-1,"tags":["observe","caution"],"focus":"謹慎探看","step":"先了解安全條件"},{"id":26,"name":"母雞蹲陣","scene":"三隻幾何貓咪並排呈收爪的「母雞蹲」姿態，神情安靜，各自仍有獨立輪廓。","core":"團隊共識、穩定陪伴、集體力量","positive":"留意哪些合作與團隊規則能提供支持，讓個人的力量在協作中發揮。","caution":"群體一致不等於想法一定正確；對重要決策仍要保有獨立判斷。","synthesis":"團隊能帶來安定感；在互相支持的同時，也請保留每個人的聲音。","group":2,"keys":["團隊共識","穩定陪伴","集體力量"],"pace":0,"tags":["support","group"],"focus":"融入團隊","step":"兼顧合作與主見"},{"id":27,"name":"傲嬌轉頭","scene":"貓咪靠在人身邊坐著，頭卻轉向外側，呈現親近與保留並存的姿態。","core":"口是心非、渴望關注、別扭試探","positive":"這張牌可以提醒你注意是否有難以表達的在意。若想確認心意，不妨用坦率的對話代替猜測。","caution":"反話與冷淡有時會造成誤解；不要僅憑外在姿態斷定他人的真實意圖。","synthesis":"把想被理解的感受說出來，可能比等待對方猜中更能拉近距離。","group":2,"keys":["口是心非","渴望關注","別扭試探"],"pace":-1,"tags":["connect","confusion"],"focus":"表達不夠坦率","step":"練習清楚說明需求"},{"id":28,"name":"金色罐頭","scene":"貓咪抬頭看向已開啟的幾何罐頭，旁邊以簡單線形或色塊表現香氣。","core":"成果累積、實質資源、留意回報","positive":"可以盤點已經付出的努力與目前能運用的資源，留意值得評估的機會。","caution":"即使機會很吸引人，也要確認附帶的條件、成本與責任；不可把牌面當成收益保證。","synthesis":"保持務實與開放，先把條件看清楚，才能穩穩承接真正適合自己的收穫。","group":3,"keys":["成果累積","實質資源","留意回報"],"pace":1,"tags":["resources","opportunity"],"focus":"累積實質成果","step":"核對機會條件"},{"id":29,"name":"空空食盆","scene":"貓咪低頭望著面前空無一物的扁平幾何食盆，姿態安靜。","core":"資源匱乏、期待落空、需要補給","positive":"如果感覺自己正在耗盡心力或資源，可以先盤點缺少什麼，再找尋適當補充方式。","caution":"反覆投入而沒有足夠回應時，值得檢查是否需要調整期待、界線或資源配置。","synthesis":"發現不足，不代表失敗。先照顧最基本的需要，再決定該留下、協調或另尋方向。","group":3,"keys":["資源匱乏","期待落空","需要補給"],"pace":-1,"tags":["scarcity","resources"],"focus":"感到資源不足","step":"盤點真正的缺口"},{"id":30,"name":"打翻水杯","scene":"貓咪在高台上伸出前爪，幾何水杯正傾倒，水花以簡潔碎片呈現。","core":"突發插曲、情緒起伏、打破僵局","positive":"若計畫遭遇意外變動，可以先處理眼前影響，再思考是否有改良安排的機會。","caution":"急躁與疏忽可能增加善後成本；對真正的損失應以事實與需要處理的程度評估。","synthesis":"突發事件未必帶來好處，但冷靜處理、調整方法，可以減少混亂並重新取得主導。","group":3,"keys":["突發插曲","情緒起伏","打破僵局"],"pace":2,"tags":["disrupt","risk"],"focus":"遇上突發變動","step":"冷靜應對插曲"},{"id":31,"name":"一束陽光","scene":"貓咪蜷縮在地面，一束斜射的白色幾何光線籠罩身體，周圍留白。","core":"有利條件、順勢而為、溫暖支持","positive":"看看周遭是否有可運用的有利條件或實際支持；善用這些資源，讓計畫穩健向前。","caution":"環境條件可能改變，享受順境的同時，也要持續建立自己的能力與備案。","synthesis":"珍惜當下的光亮，同時練習自己辨認方向；好條件與主動準備相互加成。","group":3,"keys":["有利條件","順勢而為","溫暖支持"],"pace":0,"tags":["support","opportunity"],"focus":"擁有有利條件","step":"善用當下的支持"},{"id":32,"name":"毛線球陣","scene":"貓咪趴在纏繞的幾何毛線中，以圓形色塊與交錯線段呈現打結。","core":"思緒混亂、問題纏繞、整理頭緒","positive":"如果事情相互牽連而難以釐清，不妨先找出其中最關鍵的一條線索，再逐步處理。","caution":"在沒有順序的情況下急著一次解決全部問題，可能反而增加負擔；必要時可尋求協助。","synthesis":"問題並不一定簡單，但可以拆小。從能確認的部分開始，讓複雜逐漸變得可處理。","group":3,"keys":["思緒混亂","問題纏繞","整理頭緒"],"pace":-2,"tags":["confusion","pressure"],"focus":"陷入糾結混亂","step":"找出最重要的線頭"},{"id":33,"name":"未關的門","scene":"微開的幾何門扇透出一道光，貓咪坐在門檻前凝望，門並未完全敞開。","core":"機會浮現、微露縫隙、主動探索","positive":"若生活中出現值得評估的新選項，可以先蒐集資訊、嘗試接觸，不必一次做完所有決定。","caution":"不宜因害怕未知而無限期觀望，也不宜把一點線索誤認為已經確定的機會。","synthesis":"門縫象徵可能性。先確認門後的條件，再決定是否推開那一步。","group":3,"keys":["機會浮現","微露縫隙","主動探索"],"pace":1,"tags":["opportunity","explore"],"focus":"新方向露出縫隙","step":"小規模探索可能性"},{"id":34,"name":"神秘小禮物","scene":"貓咪端坐低頭，身前放著一件小巧的幾何物件，保留「是什麼禮物」的想像空間。","core":"意外驚喜、獨特心意、換位思考","positive":"留意生活中那些不一定符合期待、卻可能帶來溫暖的小事，並練習用不同角度理解表達方式。","caution":"不應直接推定禮物代表對方的心意；可以感謝善意，也可以坦率說明自己的需要。","synthesis":"換位思考讓互動更柔軟。理解彼此表達方式的差異，能減少不必要的誤會。","group":3,"keys":["意外驚喜","獨特心意","換位思考"],"pace":0,"tags":["support","connect"],"focus":"看見獨特心意","step":"確認彼此期待"},{"id":35,"name":"貓薄荷派對","scene":"貓咪在地上愉快翻滾，周圍散落簡化的幾何葉片與顆粒。","core":"盡情放鬆、釋放壓力、短暫歡愉","positive":"若生活過度緊繃，可以安排適度的休閒、玩樂和沒有成果壓力的時間。","caution":"休閒若成為長期迴避必要事項的方式，可能需要重新調整生活平衡。","synthesis":"快樂值得被保留。讓玩樂真正幫你補充精神，而不是取代需要面對的課題。","group":3,"keys":["盡情放鬆","釋放壓力","短暫歡愉"],"pace":1,"tags":["rest","joy"],"focus":"短暫放鬆","step":"兼顧歡笑與責任"},{"id":36,"name":"貓砂掩埋","scene":"貓咪微微前傾，以一隻前腳向後撥動幾何貓砂，揚起少量砂礫碎片。","core":"主動告別、清理過去、劃下句點","positive":"如果某件事已完成或不再適合，可以嘗試好好整理、交代必要責任，再為它劃下句點。","caution":"結束不等於掩蓋；尚需處理的事實、責任或情緒，值得以適當方式面對。","synthesis":"真正放下是妥善收尾後向前走，而不是假裝問題從來不存在。","group":3,"keys":["主動告別","清理過去","劃下句點"],"pace":-1,"tags":["ending","change"],"focus":"結束一段舊事","step":"妥善收束與放下"},{"id":37,"name":"滿月凝視","scene":"深炭灰色大圓月位於後景，前景是一隻純白、端坐仰望的貓咪剪影。","core":"情緒明朗、週期圓滿、內在清晰","positive":"可以藉「月亮逐漸圓滿」的意象，回顧一段歷程中已經變得清楚的感受與需求。","caution":"當情緒特別強烈時，避免把瞬間感受當成全部事實；重要決定可先休息、核對資訊。","synthesis":"圓滿象徵看見階段性的輪廓。承認情緒，也用清醒的步調回應自己的需要。","group":4,"keys":["情緒明朗","週期圓滿","內在清晰"],"pace":0,"tags":["emotion","change"],"focus":"情緒與週期轉變","step":"覺察當下感受"},{"id":38,"name":"影子分身","scene":"一隻淺灰貓咪低頭看地面，地上延伸出形體鮮明的深黑幾何長影。","core":"內在陰影、自我覺察、接納全貌","positive":"試著看見平常不願承認的感受、恐懼與需要，以較少批判的方式理解自己。","caution":"強烈的排斥不一定全來自外界，也可能混有過往經驗；在責怪他人前可先檢視自身反應，但不必把他人的傷害歸咎於自己。","synthesis":"接納陰影不是認同所有行為，而是認識自己的更多面向，減少被未察覺的情緒牽著走。","group":4,"keys":["內在陰影","自我覺察","接納全貌"],"pace":-1,"tags":["reflect","emotion"],"focus":"面對內在陰影","step":"正視自己的需求"},{"id":39,"name":"鏡中幻影","scene":"垂直的幾何鏡框內外，黑白反轉的兩隻貓咪隔鏡伸爪，形成對照。","core":"關係投射、認知偏差、看清真實","positive":"重新檢查自己對某個人或事件的理解，分清「已看到的行為」與「自己賦予的意義」。","caution":"期待、恐懼和過往經驗可能造成認知濾鏡；不要據此否定對方，也不要把猜測當成已確認的事實。","synthesis":"擦亮心中的鏡子不是讀懂他人的秘密，而是更清楚地辨別證據與解讀，讓溝通更公平。","group":4,"keys":["關係投射","認知偏差","看清真實"],"pace":-1,"tags":["reflect","clarity"],"focus":"辨別投射與事實","step":"核對現實資訊"},{"id":40,"name":"屋頂漫步","scene":"貓咪沿幾何三角形屋脊謹慎行走，身體保持平衡，路徑顯得狹窄。","core":"步步為營、風險平衡、高處挑戰","positive":"在有挑戰的任務裡，可先釐清可接受的風險、必要裝備與下一步，再穩健推進。","caution":"冒險精神值得珍惜，但不可忽略實際安全條件；必要時選擇較穩妥的替代路徑。","synthesis":"勇氣不等於不怕跌倒。看清腳下的位置，會讓你更有餘裕欣賞高處的風景。","group":4,"keys":["步步為營","風險平衡","高處挑戰"],"pace":1,"tags":["risk","action"],"focus":"穩健面對風險","step":"評估步伐與代價"},{"id":41,"name":"夢境浮游","scene":"閉眼側睡的貓咪上方，漂浮數個大小漸變的白色幾何泡泡，象徵夢與想像。","core":"潛意識聯想、靈感湧現、願望藍圖","positive":"夢境和突發想法可以成為探索個人願望、情緒與創意的素材，不妨記錄並回頭整理。","caution":"夢不必然預告外界事件，也不能證明他人意圖；好的想像仍需要具體行動及事實檢驗。","synthesis":"把夢當成靈感的信件，不必當成未來的通知。選擇值得實踐的部分，逐步帶進生活。","group":4,"keys":["潛意識聯想","靈感湧現","願望藍圖"],"pace":-1,"tags":["reflect","ideal"],"focus":"夢境與靈感","step":"記錄並檢驗想法"},{"id":42,"name":"十字路口","scene":"地面由深淺幾何圖形構成兩條分岔道路，貓咪停在交會處觀望。","core":"方向抉擇、轉折節點、傾聽內心","positive":"若面臨選擇，可整理每條路的優點、代價和個人價值，再決定較符合目前需要的方向。","caution":"只依直覺或只聽外界意見都可能忽略條件；對重大決定要納入時間、資源與風險。","synthesis":"沒有哪條路因抽到牌而被注定。理解自己的取捨後，才能真正為選擇負責。","group":4,"keys":["方向抉擇","轉折節點","傾聽內心"],"pace":0,"tags":["decision","change"],"focus":"比較不同方向","step":"列出可行選項"},{"id":43,"name":"鈴鐺聲響","scene":"由灰階多邊形拼成的項圈與圓形鈴鐺特寫，強調清晰的聲音意象。","core":"警醒提醒、外界訊號、敏銳覺察","positive":"可以主動檢查近期值得留意的通知、對話與未處理事項，辨別哪些訊息真正重要。","caution":"鈴鐺象徵注意，而非預告必然收到某則消息；也不要讓外界評價取代自己的判斷。","synthesis":"聽見提醒之後仍需辨認來源。分清訊號與雜音，再決定是否回應。","group":4,"keys":["警醒提醒","外界訊號","敏銳覺察"],"pace":0,"tags":["observe","signal"],"focus":"察覺外界提醒","step":"核實訊息的重要性"},{"id":44,"name":"鼻尖蝴蝶","scene":"貓咪安靜坐著，鼻尖停著一隻由四個小三角形拼成的白色蝴蝶。","core":"溫柔轉化、靜心觀察、保留空間","positive":"當自己不再一味催促成果時，可能更容易注意到日常裡細緻的美好與靈感。","caution":"過度控制可能壓縮關係與創意的空間；但「放下追逐」也不等於任何好事會自動出現。","synthesis":"適度放慢、保留彈性。美好能否靠近仍取決於真實條件，而你可以先讓自己更願意看見它。","group":4,"keys":["溫柔轉化","靜心觀察","保留空間"],"pace":0,"tags":["rest","opportunity"],"focus":"放下過度控制","step":"給美好留些空間"},{"id":45,"name":"凌空翻身","scene":"貓咪在半空中扭轉身體、舒展四肢，正嘗試調整姿態以準備落地。","core":"靈活應變、調整姿態、強大韌性","positive":"遇到變動時，可盤點手上資源、調整做法並尋找協助，嘗試重新取得平衡。","caution":"適應能力不代表每次都能化險為夷；避免把意外風險合理化成證明自己的機會。","synthesis":"韌性是願意因應現實，不是保證永遠不受傷。及時修正，往往比逞強更可靠。","group":4,"keys":["靈活應變","調整姿態","強大韌性"],"pace":2,"tags":["adapt","risk"],"focus":"靈活調整姿態","step":"尋找重新站穩的方法"},{"id":46,"name":"晨間伸展","scene":"貓咪前腳伸向前方、胸口壓低、臀部翹起，呈現自然的起身伸懶腰姿態。","core":"剛起步、暖身階段、喚醒能量","positive":"對剛開始的計畫或關係，可以先做好必要準備，用小步驟建立穩定節奏。","caution":"尚未具備條件時急著承擔太多，可能讓自己疲憊；但準備也不應變成無止境拖延。","synthesis":"好的開始不必很快。先把身心與條件調整到適合的位置，再逐漸增加速度。","group":5,"keys":["剛起步","暖身階段","喚醒能量"],"pace":0,"tags":["prepare","action"],"focus":"起步暖身","step":"先做好基本準備"},{"id":47,"name":"定格靜止","scene":"貓咪走到一半突然停住，一隻前腳懸空，姿勢定格在觀察的瞬間。","core":"瞬間警覺、暫緩決定、觀察異常","positive":"當某個細節讓你產生疑慮時，可以暫停下一步，重新確認資料、環境與自身感受。","caution":"有疑慮不表示危險已存在；檢查後若無實際問題，也可讓自己重新行動。","synthesis":"停下是為了看清，不是永遠停住。讓觀察與求證決定下一步，而不是讓恐懼決定。","group":5,"keys":["瞬間警覺","暫緩決定","觀察異常"],"pace":-2,"tags":["caution","observe"],"focus":"暫停確認疑點","step":"釐清條件再前進"},{"id":48,"name":"鍵盤霸佔","scene":"貓咪趴在一片幾何鍵盤方格上，遮住原本正在使用的工作區。","core":"外在干擾、重新排序、生活平衡","positive":"當既定安排被打斷時，先區分緊急、重要與可延後的事情，再重新安排注意力。","caution":"外在中斷不必然代表身體或生活出了問題；但若長期疲憊，仍值得檢視負荷與休息。","synthesis":"計畫有時需要讓位給其他需要。調整優先順序，可以讓生活更有彈性。","group":5,"keys":["外在干擾","重新排序","生活平衡"],"pace":-2,"tags":["disrupt","order"],"focus":"外在打斷安排","step":"重新排列優先次序"},{"id":49,"name":"豎尾小跑","scene":"貓咪尾巴高高豎起、末端微勾，神情輕快地向前小跑。","core":"積極迎接、愉悅進展、順流推進","positive":"如果目前事情推進得較順，不妨保持開放與積極，善用眼前可確認的機會。","caution":"進展輕快時仍需核對基本細節，不要因為興奮而忽略已知限制。","synthesis":"帶著喜悅向前，不必把每一步都變成壓力；穩穩地跑，才能享受路上的風景。","group":5,"keys":["積極迎接","愉悅進展","順流推進"],"pace":1,"tags":["action","opportunity"],"focus":"輕快向前","step":"保持積極並核對細節"},{"id":50,"name":"迎風嗅聞","scene":"貓咪端坐抬頭嗅聞，身旁是斜向幾何風線與一片被吹動的落葉。","core":"察覺變化、趨勢轉換、順應時節","positive":"可以留意周遭條件是否正在改變，及早更新資訊與調整方法，讓準備更貼近現況。","caution":"別把主觀預感當成已發生的趨勢；對重要變化應查證，並避免只靠過去的成功經驗。","synthesis":"學會聽風，也要看天氣。把敏感度和事實核對放在一起，才能走得更穩。","group":5,"keys":["察覺變化","趨勢轉換","順應時節"],"pace":0,"tags":["change","observe"],"focus":"察覺環境變化","step":"隨條件調整方向"},{"id":51,"name":"水窪倒影","scene":"貓咪蹲坐，低頭看地面雨後水窪，水面有幾圈幾何漣漪。","core":"情緒沉澱、雨過天晴、向內傾聽","positive":"若經歷波動，可以先容許情緒慢慢平復，再回頭整理自己真正的感受與需要。","caution":"情緒強烈時的想法可能較片面，但不應因此否定感受本身；重大判斷宜補足資訊。","synthesis":"等水面平靜，你也許能看得更清楚。照顧情緒與了解事實可以同步進行。","group":5,"keys":["情緒沉澱","雨過天晴","向內傾聽"],"pace":-2,"tags":["emotion","rest"],"focus":"讓情緒沉澱","step":"先讓心情慢慢平穩"},{"id":52,"name":"膝上王座","scene":"一個簡化的人類坐姿雙腿輪廓，貓咪安穩地蜷縮在膝蓋上休息。","core":"安心依靠、信任支持、穩定連結","positive":"這張牌提醒你辨認生活中哪些人事物能提供可靠支持，並透過持續互動好好經營。","caution":"單張牌不能保證關係長久穩定；信任仍要由實際行為、互惠與尊重逐步建立。","synthesis":"安心不必等於依賴。互相扶持、同時保有自主，連結才更有韌性。","group":5,"keys":["安心依靠","信任支持","穩定連結"],"pace":0,"tags":["support","security"],"focus":"感受安心連結","step":"經營可靠互惠"},{"id":53,"name":"換毛季節","scene":"貓咪甩動身體，周圍飄散細小的白色與淺灰幾何毛絮。","core":"自然蛻變、適應新生、逐步成長","positive":"如果正經歷習慣或角色轉換，給自己一些調整時間，允許過程有不熟悉與不舒適。","caution":"改變不一定總是正向，也不必為改變而改變；評估哪些舊事物需要放下、哪些仍值得保留。","synthesis":"成長未必轟轟烈烈。慢慢調整到適合自己的樣子，就是實在的前進。","group":5,"keys":["自然蛻變","適應新生","逐步成長"],"pace":-1,"tags":["change","adapt"],"focus":"逐步蛻變","step":"給自己適應的時間"},{"id":54,"name":"沙漏凝視","scene":"貓咪端坐，專注望著由兩個對頂三角形組成的簡化幾何沙漏。","core":"時間醞釀、尊重過程、耐心守候","positive":"某些計畫需要累積與等待；可先處理能力範圍內的準備，並設定合理的檢視時間點。","caution":"耐心不等於消極拖延；若環境已經改變，也可能需要更新計畫，而非無條件等待。","synthesis":"時間不能保證想要的結果，但能提供觀察、修正和累積的機會。讓等待成為有方向的準備。","group":5,"keys":["時間醞釀","尊重過程","耐心守候"],"pace":-2,"tags":["time","prepare"],"focus":"等待時機成熟","step":"在等待中持續準備"}];
const topicCross = {"general":[{"title":"隨心提問 × 行動與姿態（01–09）","meaning":"這組牌邀請你注意行動方式與身心節奏。抽到 01 飛撲獵物，可檢視是否有條件支持果斷採取行動；抽到 04 大字仰睡，則可思考目前是否需要先恢復體力與安全感。實際重點仍取決於抽到哪張牌及你的問題。","caution":"避免僅靠焦慮驅使自己忙碌，也別在未看清方向時急著衝刺。若是 08 夜間跑酷，可檢查衝勁是否有適當出口與清楚目標。"},{"title":"隨心提問 × 情緒與神態（10–18）","meaning":"這組牌將焦點放在自身感受、壓力與看待事情的方式。若抽到 12 飛機耳，值得檢查是否勉強配合；若是 10 呼嚕引擎，則可回顧目前有哪些真實可感的安穩來源。","caution":"不要否認情緒，也不要將情緒直接視為對外界的事實證明。抽到 17 呆滯放空時，可先休息、核對資訊，再處理重要事項。"},{"title":"隨心提問 × 關係與互動（19–27）","meaning":"可從互動距離、雙向回應與界線觀察目前的生活課題。例如 19 互相理毛提醒檢視互惠，22 背對背坐提醒思考是否需要私人空間。","caution":"避免過度迎合（24 蹭腿撒嬌）、以反話代替溝通（27 傲嬌轉頭），或把有限資源的競爭理解為所有人都在與你作對（23 搶奪紙箱）。"},{"title":"隨心提問 × 徵兆與日常物件（28–36）","meaning":"這組牌邀請你檢視生活中的實際條件、資源與安排。28 金色罐頭可作為盤點成果的提示，30 打翻水杯可作為預留意外應變空間的提醒，33 未關的門則象徵值得評估的新選項。","caution":"好處需要核對條件，混亂需要釐清原因（32 毛線球陣），資源不足時也值得及時補給（29 空空食盆）。牌面不表示這些事件已客觀發生。"},{"title":"隨心提問 × 直覺與命運轉折（37–45）","meaning":"可思考自己是否正在改變判斷方式或面對選項。39 鏡中幻影提醒分辨事實和投射；40 屋頂漫步、45 凌空翻身提醒評估風險與調整方式。","caution":"直覺可以提示你重新觀察，但不能代替佐證。若抽到 42 十字路口，請列出實際選項、限制和後果，再由自己決定。"},{"title":"隨心提問 × 時間、節奏與安定（46–54）","meaning":"焦點可放在準備程度、推進速度與支持系統。49 豎尾小跑象徵較輕快的節奏；52 膝上王座提醒檢視可靠連結；54 沙漏凝視可提醒接受部分事情需要醞釀。","caution":"區分準備中的等待與沒有進度的拖延。47 定格靜止可以提示短暫暫停、檢查疑慮，並不等於現實中必有危險。"}],"love":[{"title":"感情 × 行動與姿態（01–09）","meaning":"可以思考是否適合主動傳達心意、調整互動方式，或先照顧自己的狀態。例如 01 飛撲獵物提醒在評估雙方互動及界線後採取行動；09 優雅理毛提醒把重心放回自己。","caution":"勿以追求效率的方式催促關係進展。04 大字仰睡可提醒信任需由互動累積，不是因為抽到牌就可以放下所有警戒。"},{"title":"感情 × 情緒與神態（10–18）","meaning":"以這組牌探索「自己在關係裡的感受」及「哪些情緒需要被溝通」。10 呼嚕引擎、14 慢眨眼可象徵溫柔與安心；11 炸毛弓背、12 飛機耳則提醒辨認壓力或戒備。","caution":"不能以牌卡推論伴侶的真實想法。抽到 16 翻肚誘惑可檢視互動中的魅力與界線；如有疑慮，宜直接對話與觀察實際行為。"},{"title":"感情 × 關係與互動（19–27）","meaning":"觀察是否存在可見的互惠、各自空間與溝通習慣。19 互相理毛象徵雙向照顧的理想，20 尾巴勾勾象徵獨立相伴，22 背對背坐提醒給彼此整理情緒的空間。","caution":"21 領地標記提醒尊重自主，27 傲嬌轉頭提醒少用猜測和試探。無論抽到什麼牌，都不可直接宣布某段關係健康、冷淡或不忠。"},{"title":"感情 × 徵兆與日常物件（28–36）","meaning":"可以從現實生活安排、時間資源及互動機會檢視關係。33 未關的門可象徵探索新連結，30 打翻水杯提醒處理日常插曲。","caution":"29 空空食盆、32 毛線球陣可用來提問「我的需求是否被說清楚」「是否有反覆困擾的模式」。是否繼續或結束關係（36 貓砂掩埋），應根據真實互動與安全考量決定。"},{"title":"感情 × 直覺與命運轉折（37–45）","meaning":"這組牌重點在自我認識與選擇。39 鏡中幻影提醒檢視理想化或過往經驗造成的投射，42 十字路口提醒辨識關係中的不同道路。","caution":"情緒起伏時（37 滿月凝視）可緩一緩重大決定，並透過對話確認對方立場；牌面不能證明對方「有緣」「另有隱情」或必然會做某個選擇。"},{"title":"感情 × 時間、節奏與安定（46–54）","meaning":"可討論關係速度與支持基礎。46 晨間伸展提醒新互動不必急於定義，52 膝上王座提醒觀察支持與互信，51 水窪倒影提醒感受需要沉澱。","caution":"54 沙漏凝視不代表等待必有結果；47 定格靜止只提示檢視尚未釐清的疑慮，不表示對方一定出現異常。可設定實際溝通和評估時間點。"}],"work":[{"title":"職涯 × 行動與姿態（01–09）","meaning":"可從執行策略與專業準備尋找突破。01 飛撲獵物提醒明確定義任務和時機，05 專注磨爪代表技能累積，02 高處俯瞰提示整體評估。","caution":"別因看似忙碌就忽略產出。06 追逐光點提醒確認目標可行性；09 優雅理毛提醒別用表面整理取代核心工作；08 夜間跑酷提醒協調團隊節奏。"},{"title":"職涯 × 情緒與神態（10–18）","meaning":"可檢視壓力、資訊量與職涯期待。17 呆滯放空象徵暫時過載，13 窗邊凝望象徵對其他職涯方向的嚮往。","caution":"12 飛機耳提醒留意超量負荷；18 夜視瞳孔與 16 翻肚誘惑提醒檢查合約和合作條件，但不能據此斷言同事、主管或客戶有惡意。"},{"title":"職涯 × 關係與互動（19–27）","meaning":"以團隊協作、需求溝通與資源分配作為觀察角度。26 母雞蹲陣可反思團隊節奏，19 互相理毛可反思互惠，24 蹭腿撒嬌提醒適時尋求專業協助。","caution":"23 搶奪紙箱提醒資源可能有限，21 領地標記提醒釐清職責。留意不為迎合多數意見而放棄必要的專業判斷。"},{"title":"職涯 × 徵兆與日常物件（28–36）","meaning":"可檢查成果指標、資源及工作機會。28 金色罐頭用於盤點投入與回報，33 未關的門用於審視新的專案或職涯選項。","caution":"29 空空食盆可提醒盤點資源與成長空間，32 毛線球陣可提醒梳理流程，30 打翻水杯可提醒建立突發應變程序；36 貓砂掩埋提醒錯誤應妥善處理，不宜掩蓋。"},{"title":"職涯 × 直覺與命運轉折（37–45）","meaning":"適合用來整理職涯岔路、能力與風險。42 十字路口提示比較留任或轉職的實際條件，40 屋頂漫步提示進行高難度任務前的風險評估。","caution":"43 鈴鐺聲響提醒分辨外界評價與自身目標，不代表職場已有某種消息。遇到不確定的任務，請核對資料與權責分工。"},{"title":"職涯 × 時間、節奏與安定（46–54）","meaning":"可評估啟動期、進度及工作生活平衡。46 晨間伸展對應前置準備，49 豎尾小跑象徵輕快推進，50 迎風嗅聞提醒留意產業與組織變化。","caution":"48 鍵盤霸佔提示留意干擾、疲憊和優先順序；若實際工作負荷過重，宜調整排程與尋求支持，而非期待抽牌替你排除問題。"}],"money":[{"title":"財富 × 行動與姿態（01–09）","meaning":"可從技能、收入來源和收支習慣尋找改善方向。05 專注磨爪象徵能力累積，01 飛撲獵物提示行動前先明確定義可驗證目標，02 高處俯瞰提示檢視整體財務結構。","caution":"06 追逐光點提醒確認收益假設與實際風險；08 夜間跑酷可提醒避免情緒性消費。不能把抽到行動牌視為買進或賣出的訊號。"},{"title":"財富 × 情緒與神態（10–18）","meaning":"可檢查金錢決策是否受到焦慮、滿足感或資訊疲勞影響。10 呼嚕引擎提醒辨認真正需要，17 呆滯放空提醒休息並整理資訊。","caution":"16 翻肚誘惑提醒核對看似誘人的方案條款；18 夜視瞳孔提醒細讀資訊而非憑直覺斷定真偽。重大財務決定仍需參考客觀資料，必要時請教合格專業人士。"},{"title":"財富 × 關係與互動（19–27）","meaning":"可從合作、分潤與求助管道檢視財務安排。19 互相理毛象徵雙方權益兼顧，24 蹭腿撒嬌提醒適時向可信賴的專業人士請教。","caution":"21 領地標記與 23 搶奪紙箱提醒事先確認書面權責、分潤及退出條件，不能藉牌卡判定任何人的誠信。"},{"title":"財富 × 徵兆與日常物件（28–36）","meaning":"可盤點收入、開銷、存款與預備金。28 function relation(a,b){

 else if(matches('confusion','clarity')||matches('ideal','clarity')||matches('caution','clarity')){type='adjustment';topic='想像與現實的核對';score=9}
 else if(matches('pressure','rest')||matches('disrupt','order')){type='adjustment';topic='負荷與休整';score=9}
 else if(matches('connect','boundary')||matches('support','boundary')){type='balance';topic='靠近與界線';score=9}
 else if(matches('risk','opportunity')||matches('risk','action')){type='balance';topic='機會與風險';score=9}
 else if(matches('conflict','support')||matches('conflict','connect')){type='balance';topic='競爭與協調';score=9}
 else if(matches('decision','time')||matches('decision','caution')){type='balance';topic='選擇與時機';score=9}
 else if((a.pace>=1&&b.pace<=-2)||(b.pace>=1&&a.pace<=-2)){type='contrast';topic='行動與暫停';score=10}
 else if(matches('change','security')){type='balance';topic='改變與安定';score=8}
 else if(a.tags.some(t=>b.tags.includes(t))){type='support';topic='相互強化的訊息';score=6}
 else if(b.pace>a.pace+1){type='transition';topic='節奏漸進';score=5}
 else if(b.pace<a.pace-1){type='adjustment';topic='放緩與調整';score=5}
 return {a,b,type,topic,score,key:pairKey(a,b)};
}

 const alts=analysis.lenses.filter(x=>x.key!==first.key).slice(0,2);
 if(alts.length<2)return null;
 return {kind:'five-secondary',text:`除了「${first.title}」，你還想讓哪個面向一起進入思考？`,options:[
  ...alts.map((l,i)=>({id:String(i),label:`也想留意「${l.title}」。`,tag:l.key,focus:l.title,detail:l.brief})),
  {id:'2',label:'目前先聚焦剛才的面向就好。',tag:'focus-only',focus:'維持單一主軸',detail:'不延伸另一個議題'}
 ]};
}
function fiveChooseEdge(analysis,lens){
 return analysis.edges.slice().sort((a,b)=>{
  const sx=e=>(e.a.tags.concat(e.b.tags)).reduce((n,t)=>n+(lens.tags[t]||0),0)+e.weight*.40;
  return sx(b)-sx(a);
 })[0];
}
function fiveStory(){
 const p=state.result,analysis=analyzeFive(p,state.topic),[center,up,down,left,right]=p;
 const lens=selectedFiveLens(analysis),variant=state.variant;
 const a1=getAnswers()[0],a2=getAnswers()[1],a3=getAnswers()[2];
 const other=a3&&a3.tag!=='focus-only'?analysis.lenses.find(x=>x.key===a3.tag):null;
 const relationFocus=fiveChooseEdge(analysis,lens);
 const kw=keywordFromQuestion(state.question,state.topic);
 const titles=[`從「${center.focus}」看見「${lens.title}」`,`五張牌之間，值得釐清的「${lens.title}」`,`讓「${lens.brief}」成為新的思考起點`];
 const lead=''; // The five-card narrative begins directly with the central card.
 const core=`中央的「${center.name}」把焦點放在「${center.focus}」：${center.synthesis}這是本次故事的出發點，而不是替你判定目前一定處於什麼狀況。`;
 const main=[
  `這組牌中「${relationFocus.a.name}」與「${relationFocus.b.name}」形成「${relationFocus.topic}」的對照。若從「${lens.title}」的角度觀察，可以思考「${relationFocus.a.focus}」與「${relationFocus.b.focus}」如何在現實裡互相影響。`,
  `值得一起閱讀的是「${relationFocus.a.name}」和「${relationFocus.b.name}」。一張帶來「${relationFocus.a.focus}」的視角，另一張讓你留意「${relationFocus.b.focus}」。這讓「${lens.title}」不再只有單一答案。`,
  `五張牌之中，「${relationFocus.a.focus}」與「${relationFocus.b.focus}」形成值得探索的一條故事線。把「${lens.title}」放在這兩股力量之間，也許能幫你找到更貼近現況的切入點。`
 ][variant%3];
 const aidRel=relation(center,up),crossRel=relation(up,down),timeRel=relation(left,right);
 const aidBridge={contrast:'它與中央牌呈現不同的行動節奏，可以想想哪些助力能讓你不必勉強自己。',transition:'它與中央牌形成前後銜接的象徵：先釐清核心需求，再尋找可用的支持。',support:'兩張牌的提醒彼此強化，可以留意哪些已有條件值得維持。',balance:'助力也需要界線，思考怎麼運用資源而不讓自己失去選擇空間。',adjustment:'它提供修正核心課題的另一種角度，或許能幫你調整現有方法。',complement:'這張牌帶來另一個觀察角度，不需要強行把兩種象徵解讀成同一件事。'}[aidRel.type];
 const contrastBridge=crossRel.type==='contrast'?'上下兩張呈現不同節奏，值得思考支持與風險是否需要分開處理。':crossRel.type==='support'?'上下兩張帶出相近的主題，也提醒你同一件事可能同時有優勢與盲點。':'上方與下方是兩種檢視角度，可以分別核對現實中可用的助力與尚待處理的部分。';
 const movementBridge=timeRel.type==='transition'?`如果把兩張牌當成可能的故事線，可以試著從「${left.focus}」想到「${right.focus}」，但不代表必然發生。`:timeRel.type==='contrast'?`左右兩端的象徵有所拉扯，值得思考從「${left.focus}」轉向「${right.focus}」是否需要調整節奏。`:timeRel.type==='support'?`左右兩張在象徵上有所呼應，或許有值得延續的做法，而不必把轉變理解為全面推翻過去。`:`這兩張提供不同的觀察角度，不需要預設過去與未來存在直接因果。`;
 const support=`上方「${up.name}」位於助力探索位，象徵「${up.focus}」。${up.positive}${aidBridge}這不代表現實中一定已經存在這份支持。`;
 const blindspot=`下方「${down.name}」位於盲點檢視位，提供「${down.focus}」的提醒。${down.caution}${contrastBridge}牌位不是凶吉判定。`;
 const background=`左側「${left.name}」邀請你回顧可能的背景（${left.focus}），右側「${right.name}」提供可探索的方向（${right.focus}）。${movementBridge}${right.step}；是否可行仍需比對實際條件。`;
 let contextual='';
 if(a1) contextual+=`你希望先聚焦「${lens.title}」（${lens.brief}）。`;
 if(a2) contextual+=`你也選擇了「${a2.focus}」：${a2.detail}`;
 if(other)contextual+=`另外可兼顧「${other.title}」（${other.brief}）。`;
 // Skip selections remain unstated; the core reading still works without any answers.
 let next=`就「${lens.title}」而言，可以先嘗試：${lens.step}。`;
 if(a2)next+=` 你剛才選擇的「${a2.focus}」可作為評估先後次序的參考。`;
 if(other)next+=` 同時把「${other.title}」保留在檢查清單中，避免遺漏另一種需要。`;
 return {title:titles[variant%3],lead,core,main,support,blindspot,background,contextual,next,analysis,lens};
}

function cardArt(c){return `<div class="art" data-card-id="${c.id}" aria-label="${escapeHtml(c.name)} 的卡圖"><span class="art-loading">loading</span><img class="external-card-image" alt="${escapeHtml(c.name)} 的正式卡圖" loading="lazy" decoding="async"></div>`}
// Image probe: accept local PNG/JPG/JPEG with uppercase extensions; no fallback drawings.
const imageExtensions=['png','jpg','jpeg','PNG','JPG','JPEG'];
const cardImageCache=new Map();
function lookupCardImage(id,done){let it=cardImageCache.get(id);if(it){if(it.status==='loading')it.callbacks.push(done);else done(it.src);return}it={status:'loading',src:null,callbacks:[done]};cardImageCache.set(id,it);let idx=0;const finish=src=>{it.src=src;it.status=src?'found':'missing';it.callbacks.splice(0).forEach(cb=>cb(src))};const next=()=>{if(idx>=imageExtensions.length){finish(null);return}const src=`card${num(id)}.${imageExtensions[idx++]}`;const probe=new Image();probe.onload=()=>finish(src);probe.onerror=next;probe.src=src};next()}
function makeCoverLookup(name){const it={status:'idle',src:null,callbacks:[]};return done=>{if(it.status==='found'||it.status==='missing'){done(it.src);return}it.callbacks.push(done);if(it.status==='loading')return;it.status='loading';let idx=0;const finish=src=>{it.src=src;it.status=src?'found':'missing';it.callbacks.splice(0).forEach(cb=>cb(src))};const next=()=>{if(idx>=imageExtensions.length){finish(null);return}const src=`${name}.${imageExtensions[idx++]}`;const probe=new Image();probe.onload=()=>finish(src);probe.onerror=next;probe.src=src};next()}}
const mainCoverNames=Array.from({length:10},(_,i)=>`cardmain${num(i+1)}`);
const mainCoverLookups=new Map(mainCoverNames.map(name=>[name,makeCoverLookup(name)]));
const lookupCardSign=makeCoverLookup('cardsign');
let homeCoverOrder=[];function resetHomeCover(){homeCoverOrder=shuffle(mainCoverNames)}
function lookupRandomMainCover(done){let pos=0;const next=()=>{if(pos>=homeCoverOrder.length){done(null);return}mainCoverLookups.get(homeCoverOrder[pos++])(src=>src?done(src):next())};next()}
function hydrateMainCover(){const hero=document.getElementById('hero-main-cover');const sign=document.getElementById('hero-card-sign');if(hero){lookupRandomMainCover(src=>{if(!src||!hero.isConnected||hero!==document.getElementById('hero-main-cover'))return;const img=hero.querySelector('.hero-main-image');if(!img)return;img.src=src;hero.classList.add('has-main-image')})}if(sign){lookupCardSign(src=>{if(!src||!sign.isConnected||sign!==document.getElementById('hero-card-sign'))return;sign.onload=()=>sign.isConnected&&sign.classList.add('is-visible');sign.onerror=()=>sign.isConnected&&sign.classList.remove('is-visible');sign.src=src;if(sign.complete&&sign.naturalWidth)sign.classList.add('is-visible')})}}
function hydrateCardImages(root=document){root.querySelectorAll('.art[data-card-id]').forEach(el=>{if(el.dataset.imageBound==='1')return;el.dataset.imageBound='1';const img=el.querySelector('img.external-card-image');lookupCardImage(+el.dataset.cardId,url=>{if(!url||!img.isConnected)return;const show=()=>img.isConnected&&el.classList.add('has-external');img.addEventListener('load',show,{once:true});img.addEventListener('error',()=>el.classList.remove('has-external'),{once:true});img.src=url;if(img.complete&&img.naturalWidth)show()})})}

 return top+story+`<div class="space-sm"></div><section class="read-block"><div class="read-title">✦　逐張回看牌義</div>${picks.map((c,i)=>detailSection(c,i,roles[i])).join('')}</section><div class="space"></div><div class="result-actions"><button class="secondary" data-action="copy">複製解讀文字</button><button class="primary" data-action="restart">再次抽牌　✦</button></div><p class="note">本解讀為象徵性的自我探索提示，不代表對他人心意或外部事件的事實判定。重要決定請搭配實際資訊、溝通及必要的專業建議。</p>`;
}

function render(){document.getElementById('app').innerHTML=header()+`<main>${state.stage==='setup'?setupView():state.stage==='pick'?pickView():state.stage==='guide'?guideView():state.stage==='atlas'?atlasView():resultView()}</main>`;hydrateCardImages();if(state.stage==='setup')hydrateMainCover()}
function topScroll(){window.scrollTo({top:0,behavior:'instant'})}
function showToast(message){document.querySelectorAll('.toast').forEach(el=>el.remove());const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}

function taipeiAtlasCode(instant=new Date()){
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit'}).formatToParts(instant);
 const month=parts.find(p=>p.type==='month').value.padStart(2,'0');
 const day=parts.find(p=>p.type==='day').value.padStart(2,'0');
 return '7310'+month+day;
}
function backFromAtlas(){state.stage='setup';state.question='';resetHomeCover();render();topScroll()}
function start(){const inp=document.getElementById('question');state.question=inp?inp.value.trim():state.question.trim();
 if(state.question===taipeiAtlasCode()){
  // 日期口令只在開始洗牌時辨識；不洗牌、不保留口令，也不改動正常抽牌內容。
  state.question='';state.selected=[];state.result=[];state.reading=null;state.answers=[null,null,null];state.guideQuestions=[];state.guideIndex=0;state.stage='atlas';
  render();topScroll();return;
 }
 state.deck=shuffle(cards.map(c=>c.id));state.selected=[];state.result=[];state.reading=null;state.answers=[null,null,null];state.guideQuestions=[];state.guideIndex=0;state.stage='pick';render();topScroll()}
function syncSelection(){const n=state.selected.length;document.getElementById('selected-count').textContent=n;document.getElementById('progress-fill').style.width=`${n/state.mode*100}%`;document.getElementById('selection-tray').innerHTML=selectionTray();document.getElementById('reveal-btn').disabled=n!==state.mode;document.querySelectorAll('.pick-card').forEach(el=>{const selected=state.selected.includes(+el.dataset.id);el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',String(selected))});if(n===state.mode)showToast('喵～卡牌選好了，可以翻牌囉！')}
function pick(id){if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else if(state.selected.length<state.mode)state.selected.push(id);else {showToast('已選滿卡牌，點擊已選牌可取消');return}syncSelection()}
function reveal(){if(state.selected.length!==state.mode)return;state.result=state.selected.map(getCard);state.variant=randomInt(3);state.answers=[null,null,null];state.guideQuestions=[];state.guideIndex=0;state.reading=null;
 if(state.mode===3){state.guideQuestions=makeGuides(state.result,state.topic).questions;state.stage='guide'}
 else if(state.mode===5){state.guideQuestions=makeGuidesFive(state.result,state.topic).questions;state.stage='guide'}
 else state.stage='result';
 render();topScroll()}
function guideAnswer(id){const q=state.guideQuestions[state.guideIndex];if(!q||!q.options.some(o=>o.id===id))return;
 if(state.mode===5&&state.guideIndex===0&&state.answers[0]!==id){state.answers[1]=null;state.answers[2]=null;state.guideQuestions=state.guideQuestions.slice(0,2);}
 state.answers[state.guideIndex]=id;render()}
function guideAdvance(skip=false){const i=state.guideIndex;
 if(!skip&&state.answers[i]===null)return;
 if(skip)state.answers[i]=null;
 if(i===0){
  if(state.mode===5){const a=analyzeFive(state.result,state.topic);state.guideQuestions[1]=fiveQuestionTwo(selectedFiveLens(a));state.answers[1]=null;state.answers[2]=null;state.guideQuestions=state.guideQuestions.slice(0,2)}
  state.guideIndex=1;render();topScroll();return;
 }
 if(i===1||i===2){state.reading=state.mode===5?fiveStory():makeStory();state.stage='result';render();topScroll()}
}
function guideExtra(){
 if(state.mode!==5||state.guideIndex!==1||state.answers[1]===null)return;
 const q=fiveQuestionThree(analyzeFive(state.result,state.topic));if(!q)return;
 state.guideQuestions[2]=q;state.answers[2]=null;state.guideIndex=2;render();topScroll();
}
function guideBack(){if(state.guideIndex>0){state.guideIndex--;render();topScroll()}else{state.result=[];state.stage='pick';render();topScroll()}}

function openModal(contents){document.querySelector('.modal-overlay')?.remove();const overlay=document.createElement('div');overlay.className='modal-overlay';overlay.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-label="卡牌完整牌義"><div class="modal-grab"></div><button class="modal-close" data-action="close-modal" aria-label="關閉">×</button>${contents}</section>`;document.body.appendChild(overlay);document.body.style.overflow='hidden';hydrateCardImages(overlay)}
function closeModal(){document.querySelector('.modal-overlay')?.remove();document.body.style.overflow=''}
function detail(id){const c=getCard(id);if(!c)return;const g=groups[c.group];openModal(`<div class="sheet-card-title"><div class="number">${num(c.id)}</div><div><div class="group">${escapeHtml(g.name)}</div><h3>${escapeHtml(c.name)}</h3></div></div><div class="modal-art">${cardArt(c)}</div><div class="pill-row">${c.keys.map(k=>`<span class="tag">${escapeHtml(k)}</span>`).join('')}</div><div class="hint-card"><strong>畫面意象</strong><p>${escapeHtml(c.scene)}</p></div><div class="hint-card"><strong>核心象徵</strong><p>${escapeHtml(c.core)}</p></div><div class="hint-card"><strong>順勢指引</strong><p>${escapeHtml(c.positive)}</p></div><div class="hint-card"><strong>潛在警示</strong><p>${escapeHtml(c.caution)}</p></div><div class="hint-card"><strong>綜合啟示</strong><p>${escapeHtml(c.synthesis)}</p></div><div class="space-sm"></div><button class="secondary" data-action="close-modal">${state.stage==='atlas'?'返回圖鑑':'回到解讀'}</button>`)}

function readingText(){const p=state.result,mode=state.mode,role=modes[mode][1],lines=[`挪威貓貓直覺神諭卡｜${modes[mode][0]}`,`主題：${topicName(state.topic)}`,`提問：${state.question||'今天，我需要留意什麼？'}`];
 p.forEach((c,i)=>lines.push(`${role[i]}｜${num(c.id)} ${c.name}\n核心象徵：${c.core}\n順勢指引：${c.positive}\n潛在警示：${c.caution}\n綜合啟示：${c.synthesis}`));
 if(mode===3){const r=state.reading||makeStory();lines.push(`故事標題：${r.title}`,r.lead,r.relation,r.bridge,r.contextual,r.direction,r.synthesis)}
 else if(mode===1){const r=oneCardReading(p[0]);lines.push(r.lead,r.body)}
 else{const r=state.reading||fiveStory();lines.push(`故事標題：${r.title}`,r.lead,'核心：'+r.core,r.main,r.contextual,'助力：'+r.support,'盲點：'+r.blindspot,'背景與方向：'+r.background,'可行步驟：'+r.next)}
 lines.push('本解讀僅供自我反思，不推定他人想法，不取代客觀證據或專業建議。');return lines.filter(Boolean).join('\n\n')}

async function copyReading(){const txt=readingText();let ok=false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(txt);ok=true}}catch(e){}if(!ok){const area=document.createElement('textarea');area.value=txt;area.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(area);area.select();try{ok=document.execCommand('copy')}catch(e){}area.remove()}showToast(ok?'占卜解讀已複製':'無法自動複製，請長按文字複製')}
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='topic'){state.topic=b.dataset.topic;render()}else if(a==='mode'){state.mode=+b.dataset.mode;render()}else if(a==='start')start();else if(a==='atlas-back')backFromAtlas();else if(a==='pick')pick(+b.dataset.id);else if(a==='reveal')reveal();else if(a==='clear-pick'){state.selected=[];syncSelection()}else if(a==='reshuffle'){state.deck=shuffle(state.deck);state.selected=[];render();showToast('已重新洗牌 ✦')}else if(a==='guide-answer')guideAnswer(b.dataset.value);else if(a==='guide-next')guideAdvance();else if(a==='guide-extra')guideExtra();else if(a==='guide-skip')guideAdvance(true);else if(a==='guide-back')guideBack();else if(a==='detail')detail(+b.dataset.id);else if(a==='copy')copyReading();else if(a==='restart'){state.stage='setup';state.selected=[];state.result=[];state.reading=null;state.answers=[null,null,null];resetHomeCover();render();topScroll()}});
document.getElementById('app').addEventListener('input',e=>{if(e.target.id==='question')state.question=e.target.value});
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay')||e.target.closest('[data-action="close-modal"]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
resetHomeCover();render();
// Intentionally exposed only for local QA; no network or analytics.
window.__catOracleQA={cards,topics,state,taipeiAtlasCode,atlasView,start,backFromAtlas,relation,analyzeThree,makeGuides,makeStory,analyzeFive,makeGuidesFive,fiveQuestionTwo,fiveQuestionThree,fiveStory,guideAdvance,guideExtra,guideAnswer,readingText,keywordFromQuestion};

</script>
