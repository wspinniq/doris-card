<script id="cat-theme-bootstrap-v5166">
/* V5.16.8: five UI palettes and a gentle, locked theme crossfade.
   Existing saved theme key and backup API are preserved; card art remains untouched. */
(()=>{
 'use strict';
 const KEY='NorwegianCat_UITheme_v1';
 const OPTIONS=['moon','cream','black','forest','sea'];
 const colors={moon:'#0B1020',cream:'#F3F1E4',black:'#000000',forest:'#102019',sea:'#132D3D'};
 const valid=value=>OPTIONS.includes(value);
 let chosen='moon',busy=false;
 try{const old=localStorage.getItem(KEY);if(valid(old))chosen=old}catch(_){/* storage may be unavailable */}
 function apply(value,persist=true){
   if(!valid(value))return false;
   chosen=value;
   document.documentElement.dataset.catTheme=value;
   document.querySelector('meta[name="theme-color"]')?.setAttribute('content',colors[value]);
   if(persist){try{localStorage.setItem(KEY,value)}catch(_){}}
   return true;
 }
 function transitionTo(value,onUpdate){
   if(!valid(value)||busy||value===chosen)return false;
   const reduce=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
   const update=()=>{apply(value);if(typeof onUpdate==='function')onUpdate()};
   if(reduce){update();return true;}
   busy=true;
   const app=document.getElementById('app');
   if(app)app.inert=true;
   document.documentElement.classList.add('cat-theme-switching');
   const finish=()=>{
     busy=false;
     document.documentElement.classList.remove('cat-theme-switching');
     const now=document.getElementById('app');if(now)now.inert=false;
     const selected=document.querySelector('.catprefs-choice[data-theme="'+value+'"]');
     try{selected?.focus({preventScroll:true})}catch(_){/* focus not supported */}
   };
   if(typeof document.startViewTransition==='function'){
     try{
       const vt=document.startViewTransition(update);
       Promise.resolve(vt.finished).then(finish,finish);
       return true;
     }catch(_){/* fall back to a dim crossfade */}
   }
   // Older browsers: softly dim the old backdrop while UI colors are switched.
   const mask=document.createElement('div');
   mask.className='cat-theme-fallback-mask';
   mask.style.background=colors[chosen];
   mask.setAttribute('aria-hidden','true');
   document.body.appendChild(mask);
   try{update()}catch(_){mask.remove();finish();return false}
   requestAnimationFrame(()=>requestAnimationFrame(()=>mask.classList.add('is-fading')));
   setTimeout(()=>{mask.remove();finish()},740);
   return true;
 }
 window.__catTheme={get:()=>chosen,set:apply,valid,transitionTo,isBusy:()=>busy,options:[...OPTIONS]};
 apply(chosen,false);
})();
</script>
<script id="cat-audio-bootstrap-v51612">
/* Norwegian Cat Oracle V5.16.12 | LOW-LATENCY EXTERNAL AUDIO
 * No embedded audio. Place sounds in assets/sounds beside index.html.
 * Supports MP3, WAV, OGG, M4A (AAC), FLAC, with resilient codec fallback.
 * Warm decoded AudioBuffers BEFORE clicks. Never play an ordinary sound late.
 * Optional per-file preference: PREFERRED_FORMAT = {'wind_01':'wav', ...}
 * OGG group hints reflect the published library; other files default to MP3.
 */
(()=>{
'use strict';
const KEY='NorwegianCat_Audio_v1';
const COUNTS={ui_click:2,ui_confirm:2,ui_back:2,wind:5,shuffle:3,card_flip:3,reveal:2,deep_card:2,mail_open:3,jar_save:3,jar_open:2,star:2};
const GROUPS=Object.keys(COUNTS);
const TOTAL=Object.values(COUNTS).reduce((sum,n)=>sum+n,0);
const FORMATS=Object.freeze(['mp3','wav','ogg','m4a','flac']);
// This is a search hint, NOT a limitation: if a preferred file is absent,
// every other supported format is still tried during preloading.
const GROUP_FORMAT_HINTS=Object.freeze({ui_click:'ogg',ui_back:'ogg',wind:'ogg',shuffle:'ogg',star:'ogg',ui_confirm:'mp3',reveal:'mp3'});
const PREFERRED_FORMAT=Object.freeze({
  'ui_click_01':'ogg','ui_click_02':'ogg'
  // 'ui_click_01':'wav', // Example: prioritize a new WAV while an OGG also exists
});
const AudioContextClass=window.AudioContext||window.webkitAudioContext;
const valid=x=>!!x&&typeof x==='object'&&!Array.isArray(x)&&typeof x.enabled==='boolean'&&Number.isInteger(x.volume)&&x.volume>=0&&x.volume<=100;
let settings={enabled:false,volume:35};
try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(valid(saved))settings={enabled:saved.enabled,volume:saved.volume}}catch(_){}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(settings))}catch(_){}};
const get=()=>({...settings});
let ctx=null,master=null,prewarmPromise=null,warming=false,lastSound='',lastGroup='',lastAt=0;
const decoded=new Map(),readySources=new Map(),sourceFailures=new Map(),loadPending=new Map(),mediaReady=new Map(),mediaPending=new Map();
const bags=new Map(),lastVariant=new Map(),activeNodes=new Set();
let processed=0,scanComplete=false;
function stem(group,n){return `${group}_${String(n).padStart(2,'0')}`}
function orderFor(key){
 const group=key.replace(/_\d\d$/,'');
 const hint=(PREFERRED_FORMAT[key]||GROUP_FORMAT_HINTS[group]||'mp3').toLowerCase();
 return [hint,...FORMATS.filter(x=>x!==hint)];
}
function sources(key){return orderFor(key).map(ext=>`assets/sounds/${key}.${ext}`)}
function bestSource(key){const r=readySources.get(key);return r||null}
function volumeBase(group){return group==='ui_click'?.68:(group.startsWith('ui_')?.46:.82)}
function notify(){
 const label=document.getElementById('cat-sound-preload-status');
 if(!label)return;
 if(!settings.enabled){label.textContent='音效已關閉，不會在背景下載音效。';return}
 const loaded=location.protocol==='file:'?mediaReady.size:decoded.size;
 label.textContent=warming?`正在準備音效：${loaded} 段就緒（已檢查 ${processed}/${TOTAL}）`:`已準備 ${loaded}/${TOTAL} 段音效${loaded<TOTAL?'；缺少的音檔會保持靜音。':'，點擊即可播放。'}`;
}
function context(){
 if(!AudioContextClass)return null;
 try{
  if(!ctx){ctx=new AudioContextClass();master=ctx.createGain();master.gain.value=settings.volume/100*.7;master.connect(ctx.destination)}
  return ctx;
 }catch(_){return null}
}
function unlock(){
 if(!settings.enabled)return;
 const c=context();
 if(c&&c.state==='suspended')c.resume().catch(()=>{});
}
function applyGain(){if(master&&ctx)try{master.gain.setTargetAtTime(settings.volume/100*.7,ctx.currentTime,.01)}catch(_){} }
function randInt(n){if(n<2)return 0;return Math.floor(Math.random()*n)}
function shuffle(xs){const a=[...xs];for(let i=a.length-1;i>0;i--){const j=randInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function availableNumbers(group){
 let list=[];
 for(let n=1;n<=COUNTS[group];n++){
  const key=stem(group,n);
  if(location.protocol==='file:'?mediaReady.has(key):decoded.has(key))list.push(n);
 }
 return list;
}
function pickReady(group,opts){
 if(!opts.length)return null;
 let b=bags.get(group)||[];
 const signature=opts.join(',');
 if(b.signature!==signature||!b.list?.length){
  let arr=shuffle(opts),prev=lastVariant.get(group);
  if(arr.length>1&&arr[arr.length-1]===prev){let i=arr.findIndex(x=>x!==prev);[arr[i],arr[arr.length-1]]=[arr[arr.length-1],arr[i]]}
  b={signature,list:arr};
 }
 const n=b.list.pop();bags.set(group,b);lastVariant.set(group,n);return n;
}
// A normal click is played only from ALREADY prepared audio; no delayed catch-up.
function playBuffer(buffer,group){
 const c=context();if(!c||!master||c.state!=='running')return false;
 try{
  const source=c.createBufferSource(),gain=c.createGain();source.buffer=buffer;
  gain.gain.value=volumeBase(group)*(.96+randInt(9)/100);
  if(group==='card_flip'||group==='shuffle'||group==='ui_click')source.playbackRate.value=.98+randInt(5)/100;
  source.connect(gain).connect(master);activeNodes.add(source);
  source.onended=()=>{activeNodes.delete(source);try{source.disconnect();gain.disconnect()}catch(_){}};
  source.start(0);return true;
 }catch(_){return false}
}
function playMedia(key,group){
 const audio=mediaReady.get(key);if(!audio)return false;
 try{
  if(!audio.paused)audio.pause();audio.currentTime=0;
  audio.volume=Math.max(0,Math.min(1,settings.volume/100*.45*volumeBase(group)));
  const p=audio.play();if(p?.catch)p.catch(()=>{});return true;
 }catch(_){return false}
}
function playKey(key,group){
 lastSound=key;
 if(location.protocol==='file:')return playMedia(key,group);
 const sound=decoded.get(key);return sound?playBuffer(sound,group):false;
}
function limitAndPlay(group,key){
 if(!settings.enabled||settings.volume<=0||document.hidden)return false;
 const now=performance.now(),gap=group.startsWith('ui_')?90:(group==='card_flip'?105:165);
 if(group===lastGroup&&now-lastAt<gap)return false;
 const ok=playKey(key,group);
 if(ok){lastGroup=group;lastAt=now}
 return ok;
}
function play(group){
 if(!settings.enabled||!settings.volume||document.hidden||!COUNTS[group])return false;
 const available=availableNumbers(group);
 if(!available.length){
  // First-run or slow network: start background loading, but don't play late.
  if(!warming)prewarm();
  return false;
 }
 const n=pickReady(group,available);
 return limitAndPlay(group,stem(group,n));
}
function testFile(key){
 const m=/^([a-z_]+)_(\d{2})$/.exec(String(key));
 if(!m||!COUNTS[m[1]]||Number(m[2])<1||Number(m[2])>COUNTS[m[1]]||!settings.enabled||!settings.volume)return false;
 unlock();
 // Explicit test/preview is allowed to play as soon as its file finishes loading.
 if(location.protocol==='file:'?mediaReady.has(key):decoded.has(key))return playKey(key,m[1]);
 loadKey(key).then(ok=>{if(ok&&settings.enabled&&!document.hidden&&settings.volume>0)playKey(key,m[1])});
 return true;
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function tryDecode(url){
 const c=context();if(!c)return null;
 for(let attempt=0;attempt<2;attempt++){
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),7000);
  try{
   const response=await fetch(url,{cache:'default',signal:controller.signal});
   if(!response.ok){
    clearTimeout(timer);
    if((response.status===502||response.status===503||response.status===504)&&attempt===0){await wait(250);continue}
    return null;
   }
   const raw=await response.arrayBuffer();clearTimeout(timer);
   return await c.decodeAudioData(raw);
  }catch(_){
   clearTimeout(timer);
   if(attempt===0){await wait(180);continue}
  }
 }
 return null;
}
// HTMLAudio fallback enables direct file:// use when fetch() is forbidden locally.
async function tryMedia(url){
 return new Promise(resolve=>{
  let audio;
  try{audio=new Audio();audio.preload='auto'}catch(_){resolve(null);return}
  let settled=false;
  const done=ok=>{if(settled)return;settled=true;clearTimeout(timer);audio.removeEventListener('canplay',onReady);audio.removeEventListener('error',onError);resolve(ok?audio:null)};
  const onReady=()=>done(true),onError=()=>done(false);
  const timer=setTimeout(()=>done(false),5000);
  audio.addEventListener('canplay',onReady);audio.addEventListener('error',onError);
  audio.src=url;try{audio.load()}catch(_){done(false)}
 });
}
async function loadKey(key){
 if((location.protocol==='file:'?mediaReady:decoded).has(key))return true;
 if(loadPending.has(key))return loadPending.get(key);
 const task=(async()=>{
  for(const url of sources(key)){
   const playable=location.protocol==='file:'?await tryMedia(url):await tryDecode(url);
   if(playable){
    if(location.protocol==='file:')mediaReady.set(key,playable);
    else decoded.set(key,playable);
    readySources.set(key,url);notify();return true;
   }
  }
  return false;
 })().finally(()=>{loadPending.delete(key);notify()});
 loadPending.set(key,task);return task;
}
function allKeys(){
 const priority=['ui_click','ui_confirm','ui_back','card_flip','shuffle','wind','reveal','deep_card','mail_open','jar_save','jar_open','star'];
 return priority.flatMap(group=>Array.from({length:COUNTS[group]},(_,i)=>stem(group,i+1)));
}
function prewarm(){
 if(!settings.enabled)return Promise.resolve(false);
 if(prewarmPromise)return prewarmPromise;
 if(scanComplete)return Promise.resolve(true);
 warming=true;processed=0;notify();
 const keys=allKeys();let index=0;
 async function worker(){
  while(settings.enabled&&index<keys.length){
   const key=keys[index++];await loadKey(key);processed++;notify();
  }
 }
 // Three concurrent loaders avoid 31 simultaneous decoding/fetch bursts on phones.
 prewarmPromise=Promise.all([worker(),worker(),worker()]).then(()=>true).finally(()=>{
  warming=false;prewarmPromise=null;scanComplete=processed===TOTAL;notify();
 });
 return prewarmPromise;
}
function stop(){
 for(const node of activeNodes)try{node.stop()}catch(_){}activeNodes.clear();
 for(const a of mediaReady.values())try{a.pause();a.currentTime=0}catch(_){}
 if(ctx?.state==='running')ctx.suspend().catch(()=>{});
}
function setEnabled(value){
 settings.enabled=!!value;store();
 if(settings.enabled){unlock();applyGain();prewarm()}else{stop()}
 notify();return get();
}
function setVolume(value){
 let n=Number(value);if(!Number.isFinite(n))return get();
 settings.volume=Math.max(0,Math.min(100,Math.round(n)));store();applyGain();notify();return get();
}
function apply(prefs){if(!valid(prefs))return false;setVolume(prefs.volume);setEnabled(prefs.enabled);return true}
document.addEventListener('pointerdown',unlock,{capture:true,passive:true});
document.addEventListener('keydown',unlock,true);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(settings.enabled)prewarm()});
window.addEventListener('pageshow',()=>{if(settings.enabled)prewarm()});
if(settings.enabled){ // saved-on preference: start downloading while the page is opening
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',prewarm,{once:true});
 else prewarm();
}
window.__catAudio={get,setEnabled,setVolume,apply,valid,play,testFile,prewarm,stop,
 refreshStatus:notify,info:()=>({groups:GROUPS.length,files:TOTAL,formats:[...FORMATS],lastSound,
  buffers:decoded.size,ready:location.protocol==='file:'?mediaReady.size:decoded.size,
  processed,warming,enabled:settings.enabled,volume:settings.volume,
  readySources:Object.fromEntries(readySources)})};
// UI sound mapping is preserved from the previous release.
const categories={
 'wind':'wind','start':'shuffle','reshuffle':'shuffle','pick':'card_flip','unpick':'card_flip',
 'reveal':null,'deep-yes':'deep_card','deep-confirm':'deep_card','deep-select':'card_flip','deep-unselect':'ui_back',
 'function-toggle':'ui_click','function-feature':'ui_confirm','mailbox-open':'ui_confirm',
 'mood-open':'jar_open','mood-new':'ui_confirm','mood-edit':'jar_open','mood-delete':'ui_back',
 'restart':'ui_back','aux-home':'ui_back','mood-back':'ui_back','atlas-back':'ui_back','close-modal':'ui_back',
 'theme-select':null,'sound-toggle':null,'sound-preview':null,'sound-test-click-01':null,'sound-test-click-02':null,'copy':'ui_click',
 'guide-answer':'ui_click','topic':'ui_click','focus':'ui_click','mode':'ui_click',
 'guide-next':'ui_confirm','guide-extra':'ui_confirm','guide-skip':'ui_confirm','guide-back':'ui_back',
 'deep-no':'ui_back','detail':'ui_confirm','journal-unlock':'ui_confirm',
 'journal-select':'ui_click','journal-prev':'ui_back','journal-next':'ui_click',
 'clear-pick':'ui_back','mood-export':'ui_click','mood-import':'ui_click'
};
const mailCategories={read:'mail_open',back:'ui_back',send:'ui_confirm',close:'ui_back',export:'ui_click',import:'ui_click'};
const contactCategories={close:'ui_back',copy:'ui_click'};
document.addEventListener('click',event=>{
 if(!settings.enabled||!settings.volume||document.hidden)return;
 if(event.defaultPrevented)return;
 const el=event.target.closest('button,[role="button"],a[href^="mailto:"],summary');if(!el||el.disabled||el.getAttribute('aria-disabled')==='true')return;
 let sound=null;
 if(el.dataset.action){
  if(Object.prototype.hasOwnProperty.call(categories,el.dataset.action))sound=categories[el.dataset.action];
  else if(el.dataset.action==='atlas-secret-tap')return;
  else sound='ui_click';
  if(el.dataset.action==='function-feature'&&el.dataset.feature==='stars')sound='star';
 }else if(el.dataset.cm)sound=mailCategories[el.dataset.cm]||'ui_click';
 else if(el.dataset.contact)sound=contactCategories[el.dataset.contact]||'ui_click';
 else if(el.matches('[data-star-filter]'))sound='ui_click';
 else if(el.id==='mood-send')return; // play jar_save only after successful IndexedDB transaction
 else if(el.matches('summary'))sound='ui_click';
 else if(el.closest('.catcontact-overlay,.catmail-overlay,.modal-overlay'))sound='ui_click';
 if(sound)play(sound);
},true);

})();
</script>

/* 儀式式轉場：視覺停留隨機 3～5 秒；期間預讀本機卡圖，不呼叫外部服務。 */
.dream-transition{position:fixed;inset:0;z-index:120;display:grid;place-items:center;
 background:radial-gradient(circle at 50% 43%,rgba(77,65,109,.96),rgba(18,22,42,.985) 48%,#0c1023 100%);
 opacity:0;transition:opacity .24s ease;pointer-events:all;touch-action:none;}
.dream-transition.is-visible{opacity:1}
.dream-transition.is-leaving{opacity:0;pointer-events:none}
.dream-center{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;transform:translateY(7px)}
.dream-orbit{width:126px;height:126px;display:grid;place-items:center;position:relative;filter:drop-shadow(0 0 20px #bba3e655)}
.dream-orbit:before,.dream-orbit:after{content:'';position:absolute;border-radius:50%;inset:6px;border:1px solid #a99ab891;animation:dream-pulse 1.6s ease-in-out infinite}
.dream-orbit:after{inset:18px;border-color:#d9c19d77;animation-delay:-.8s}
.dream-paw{position:relative;display:grid;place-items:center;width:70px;height:70px;animation:dream-float 1.55s ease-in-out infinite}
.dream-paw .paw-print{transform:scale(1.45) rotate(-9deg);filter:drop-shadow(0 0 14px #dccba46b)}
.dream-star{position:absolute;color:#ead7bf;animation:dream-twinkle 1.4s ease-in-out infinite}
.dream-star.a{top:5px;right:12px;font-size:14px}.dream-star.b{bottom:15px;left:0;font-size:11px;animation-delay:-.55s}

.dream-dots i{width:5px;height:5px;border-radius:50%;background:#dbc19e;opacity:.4;animation:dream-twinkle 1.1s ease-in-out infinite}
.dream-dots i:nth-child(2){animation-delay:.2s}.dream-dots i:nth-child(3){animation-delay:.4s}
@keyframes dream-pulse{0%,100%{transform:scale(.96);opacity:.45}50%{transform:scale(1.06);opacity:1}}
@keyframes dream-float{0%,100%{transform:translateY(4px) rotate(-4deg)}50%{transform:translateY(-4px) rotate(3deg)}}

/* Preferences page */
.catprefs{max-width:620px;margin:2px auto 35px}
.catprefs-intro{font-size:13px;line-height:1.9;color:var(--sub);text-align:center;margin:5px auto 22px;max-width:390px}
.catprefs-title{font-size:13px;letter-spacing:.06em;color:var(--gold);margin:0 0 12px}
.catprefs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.catprefs-choice{border:1px solid var(--hair);border-radius:15px;padding:9px 7px 12px;background:var(--panel);color:var(--text);min-width:0;min-height:122px;text-align:center;display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:flex-start}
.catprefs-choice[aria-pressed="true"]{border:2px solid var(--gold);padding:8px 6px 11px;box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 20%,transparent)}
.catprefs-swatch{display:grid;place-items:center;width:100%;height:55px;border-radius:9px;border:1px solid #8C846C;position:relative;overflow:hidden}
.catprefs-swatch>span{width:45%;height:27px;border-radius:5px;display:grid;place-items:center;font-size:16px}
.catprefs-swatch.moon{background:#0B1020}.catprefs-swatch.moon>span{background:#272943;color:#E9D0A8}
.catprefs-swatch.cream{background:#F3F1E4}.catprefs-swatch.cream>span{background:#FFFDF7;color:#805B40}
.catprefs-swatch.black{background:#000}.catprefs-swatch.black>span{background:#202020;color:#E0CCAC}
.catprefs-choice b{font-size:12px;font-weight:650}.catprefs-check{font-size:10px;color:var(--gold);margin-top:auto}
.catprefs-note{border-top:1px solid var(--hair);padding-top:13px;font-size:12px;line-height:1.9;color:var(--sub)}
@media(max-width:360px){.catprefs-grid{gap:6px}.catprefs-choice{padding:8px 4px}.catprefs-choice b{font-size:11px}}
/* Developer contact pop-up lives on top of inbox, not a posting/API form. */
.catcontact-overlay{position:fixed;inset:0;z-index:1000001;display:grid;place-items:center;padding:20px;background:rgba(4,7,18,.75);backdrop-filter:blur(6px)}
.catcontact-dialog{width:min(100%,385px);border:1px solid var(--hair);border-radius:22px;background:var(--panel);color:var(--text);padding:22px 22px 20px;box-shadow:0 22px 75px #0009;position:relative}
.catcontact-dialog h2{font-family:Georgia,'Noto Serif TC',serif;font-size:20px;margin:0 30px 13px 0;letter-spacing:.04em}
.catcontact-dialog p{font-size:13px;line-height:1.85;color:var(--sub);margin:0 0 14px}
.catcontact-x{position:absolute;right:12px;top:12px;border:1px solid var(--hair);background:transparent;color:var(--text);width:33px;height:33px;border-radius:50%;font-size:20px;line-height:1}
.catcontact-mail{display:flex;flex-direction:column;align-items:center;gap:7px;border:1px solid var(--hair);background:var(--panel2);border-radius:13px;padding:14px 8px;margin:13px 0}
.catcontact-mail small{color:var(--sub);font-size:11px}.catcontact-mail strong{font-size:15px;letter-spacing:.025em;user-select:all;overflow-wrap:anywhere}
.catcontact-copy{display:block;width:100%;border:0;border-radius:12px;background:var(--gold);color:var(--bg);padding:12px 8px;font-size:14px;font-weight:750;min-height:45px}
html[data-cat-theme="cream"] .catcontact-copy{color:#FFF}
.catcontact-link{display:block;text-align:center;color:var(--gold);font-size:12px;line-height:1.7;padding:12px 0 3px}
.catcontact-status{font-size:11px;line-height:1.6;text-align:center;color:var(--gold);min-height:1.6em;margin:5px 0}
.catcontact-notice{border-top:1px solid var(--hair);margin-top:13px;padding-top:14px;font-size:11.5px;line-height:1.85;color:var(--sub)}
@media(prefers-reduced-motion:reduce){.catprefs-choice,.catcontact-dialog{animation:none}}

'use strict';
const cards = [{"id":1,"name":"飛撲獵物","scene":"貓咪在半空中朝地面微小的幾何獵物飛撲，四肢伸展，動作明確而集中。","core":"果斷出擊、精準鎖定、把握時機","positive":"若目標與條件已經清楚，不妨集中精力採取具體行動，將反覆猶豫轉化為可執行的一步。","caution":"在未確認全貌前過度急躁，可能讓努力偏離重點；先檢查資訊、成本和周遭風險。","synthesis":"精準的出擊始於仔細觀察。看準方向後勇敢行動，同時保有修正路線的彈性。","group":0,"keys":["果斷出擊","精準鎖定","把握時機"],"pace":2,"tags":["action","goal"],"focus":"鎖定目標","step":"把想法化為行動"},{"id":2,"name":"高處俯瞰","scene":"貓咪安靜蹲坐在高處幾何平台邊緣，微微低頭，觀察下方場景。","core":"全局視野、冷靜抽離、客觀觀察","positive":"暫時從眼前的情緒與細節抽離，重新整理資訊與各方條件，或許更容易看見整體脈絡。","caution":"抽離有助觀察，但若長期停留在旁觀位置，也可能錯過實際參與與必要對話。","synthesis":"看得遠，是為了走得穩。既保有清楚的視野，也記得在適當時機投入行動。","group":0,"keys":["全局視野","冷靜抽離","客觀觀察"],"pace":-1,"tags":["observe","clarity"],"focus":"拉高視角","step":"盤點全局條件"},{"id":3,"name":"好奇探索","scene":"貓咪低伏身體緩緩探頭，鼻尖靠近地上一株小巧的幾何花草。","core":"保持好奇、細節線索、主動試探","positive":"帶著開放的態度留意日常的小線索，循序接觸新事物，可能開啟不同的理解。","caution":"面對陌生資訊或邀請，先確認來源與安全條件，避免在不熟悉時一次投入過多。","synthesis":"好奇心可以為生活帶來新鮮感；搭配適度查證與試探，探索會更加自在。","group":0,"keys":["保持好奇","細節線索","主動試探"],"pace":0,"tags":["explore","curiosity"],"focus":"探索小線索","step":"嘗試低風險的一小步"},{"id":4,"name":"大字仰睡","scene":"貓咪四腳朝天仰臥地上，四肢與尾巴放鬆，呈現安適的睡姿。","core":"卸下防備、充分休息、安心接納","positive":"若目前條件允許，試著放慢腳步，安排真正的休息，也練習接納可信賴的支持。","caution":"放鬆不等於放棄所有界線；在關鍵資訊尚未確認前，仍需保有基本的自我保護。","synthesis":"休息和警覺不必互相排斥。在可安心的範圍裡恢復力量，再面對下一步。","group":0,"keys":["卸下防備","充分休息","安心接納"],"pace":-2,"tags":["rest","safety"],"focus":"卸下戒備","step":"安排充分的休息"},{"id":5,"name":"專注磨爪","scene":"貓咪伸直前腳，專注抓撓垂直的幾何貓抓柱，身姿挺拔。","core":"實力打磨、宣示立場、釋放壓力","positive":"把精力放回可累積的技能與準備，透過有節奏的練習建立自己的底氣。","caution":"留意是否把焦慮轉成無效的逞強或破壞行為；情緒需要出口，行動則需要方向。","synthesis":"穩定練習比一時用力更持久。照顧情緒、磨練能力，才能在機會出現時從容應對。","group":0,"keys":["實力打磨","宣示立場","釋放壓力"],"pace":1,"tags":["prepare","boundary"],"focus":"打磨實力","step":"將精力放在準備上"},{"id":6,"name":"追逐光點","scene":"貓咪高高躍起，前爪伸向空中閃爍的幾何光點。","core":"純粹熱情、追尋理想、享受過程","positive":"保留對新事物的熱情與玩心，允許探索不全然以功利回報為目的。","caution":"也要定期確認目標是否有實現路徑，避免把大量心力耗在無法掌握的幻象上。","synthesis":"熱情讓人開始奔跑，現實的檢視幫助你找到跑道；玩心與務實可以並行。","group":0,"keys":["純粹熱情","追尋理想","享受過程"],"pace":2,"tags":["explore","ideal"],"focus":"熱情追尋","step":"讓想像與現實對齊"},{"id":7,"name":"踩奶按摩","scene":"貓咪微閉雙眼，在柔軟的幾何墊上交替按壓前爪。","core":"自我安撫、穩定儀式、溫柔節奏","positive":"找回能讓自己平靜的小習慣，例如規律休息、熟悉的活動或安穩的生活節奏。","caution":"熟悉感值得珍惜，但若因此一直迴避必要改變，也可以先從很小的嘗試開始。","synthesis":"先溫柔安頓自己，再一步步向外探索。照顧感受與持續成長並不衝突。","group":0,"keys":["自我安撫","穩定儀式","溫柔節奏"],"pace":-1,"tags":["rest","care"],"focus":"規律安撫","step":"照顧自己的節奏"},{"id":8,"name":"夜間跑酷","scene":"貓咪騰空跳躍，身體伸展、尾巴高揚，以動態線條表現突然爆發的精力。","core":"能量爆發、突破常規、無拘無束","positive":"若你有想嘗試的新方法，可把積累的創意轉為具體的小型實驗，打開既有框架。","caution":"爆發力若缺乏方向與休息，可能打亂節奏；留意實際負荷與周圍人的配合需求。","synthesis":"把衝勁放在合適的方向上，創意便能成為推力，而不是讓自己疲於奔命。","group":0,"keys":["能量爆發","突破常規","無拘無束"],"pace":2,"tags":["action","disrupt"],"focus":"釋放創意與精力","step":"為衝勁設定方向"},{"id":9,"name":"優雅理毛","scene":"貓咪端坐，抬起一條後腿，低頭專注整理毛髮。","core":"自我整頓、重拾秩序、由內而外","positive":"先把可掌握的生活細節、環境和身心狀態整理清楚，讓自己更從容地處理新任務。","caution":"整理若變成無止境的完美追求，也可能拖慢真正重要的事；區分必要準備與表面忙碌。","synthesis":"有條理的生活是支持行動的基礎。整理到足夠好，就可以放心前進。","group":0,"keys":["自我整頓","重拾秩序","由內而外"],"pace":-1,"tags":["order","care"],"focus":"整理自身狀態","step":"理順眼前的生活"},{"id":10,"name":"呼嚕引擎","scene":"貓咪放鬆縮成一團，雙眼微閉，神情安詳而滿足。","core":"內在滿足、平和共振、當下喜悅","positive":"留意此刻有哪些真實可感的幸福與安穩來源，讓平靜成為日常的支持。","caution":"感到滿足很好，但仍可留意尚未處理的小問題，避免以「一切都好」取代實際檢視。","synthesis":"喜悅不需要證明，也不必掩蓋困難。珍惜眼前的好，同時保留清醒的眼光。","group":1,"keys":["內在滿足","平和共振","當下喜悅"],"pace":0,"tags":["rest","support"],"focus":"感受內在滿足","step":"辨認真實的安定來源"},{"id":11,"name":"炸毛弓背","scene":"貓咪弓起背部、毛髮豎立、尾巴膨起，呈現明確防禦姿態。","core":"高度戒備、情緒應激、自我保護","positive":"如果某種互動讓你感到不適，可以先拉開距離，了解讓自己緊繃的因素。","caution":"感受到威脅不等於威脅已被證實；在守住界線的同時，試著區分事實、猜測和過往經驗。","synthesis":"防禦是提醒你值得被保護的需求。先照顧自己，再以實際資訊判斷是否需要繼續戒備。","group":1,"keys":["高度戒備","情緒應激","自我保護"],"pace":-2,"tags":["caution","boundary"],"focus":"提高防備","step":"確認真正的威脅來源"},{"id":12,"name":"飛機耳","scene":"貓咪身體微低伏，雙耳朝兩側壓平，顯得緊張或不自在。","core":"委屈壓抑、無聲抗議、承受壓力","positive":"如果你正勉強承受某些期待，試著辨認自己能負荷的程度，並以合適方式表達不舒服。","caution":"長期忽視自己的需要可能累積疲憊；能溝通的事，盡量不要等到難以承受才說出口。","synthesis":"你的感受值得被聽見。清楚表達界線，有助於建立更可持續的相處方式。","group":1,"keys":["委屈壓抑","無聲抗議","承受壓力"],"pace":-1,"tags":["pressure","boundary"],"focus":"承受不適與壓力","step":"表達自己的負荷"},{"id":13,"name":"窗邊凝望","scene":"貓咪坐在幾何窗框前，望向窗外一隻由簡單幾何形狀拼成的飛鳥。","core":"渴望自由、心生嚮往、規劃藍圖","positive":"如果你正在嚮往不同生活，可以先把想像中的方向寫得更具體，再尋找可行的第一步。","caution":"長久只看著遠方、卻沒有準備行動，也可能累積失落；留意現實條件和真正需要。","synthesis":"遠方的風景可以成為目標。把嚮往變成可安排的步驟，窗外就不只是想像。","group":1,"keys":["渴望自由","心生嚮往","規劃藍圖"],"pace":0,"tags":["change","desire"],"focus":"嚮往新方向","step":"勾勒可行的藍圖"},{"id":14,"name":"慢眨眼","scene":"貓咪安靜端坐、頭微傾，雙眼柔和地緩慢閉合。","core":"釋出善意、放下敵意、溫柔信任","positive":"若情境適合，可以用真誠的傾聽與溫和的表達開啟對話，降低不必要的對立。","caution":"善意不等於無條件信任；若曾出現反覆違反界線的情況，可保留距離並觀察實際行為。","synthesis":"溫柔可以和清楚的界線同行。信任不靠猜測，而是從一次次尊重中慢慢建立。","group":1,"keys":["釋出善意","放下敵意","溫柔信任"],"pace":0,"tags":["connect","support"],"focus":"柔和示好","step":"建立真誠交流"},{"id":15,"name":"哈氣警告","scene":"貓咪張嘴露出尖牙、身體緊繃，作出警告姿態。","core":"明確拒絕、守住底線、表達立場","positive":"當重要原則受到挑戰時，可以清楚說明自己的需求和可接受範圍。","caution":"強烈情緒可能讓訊息失焦；在安全條件允許下，以堅定、具體的說法代替擴大衝突。","synthesis":"拒絕並不需要傷害對方。清楚表達界線，讓彼此知道如何互相尊重。","group":1,"keys":["明確拒絕","守住底線","表達立場"],"pace":1,"tags":["boundary","action"],"focus":"清楚拒絕","step":"說明自己的界線"},{"id":16,"name":"翻肚誘惑","scene":"貓咪翻身露出部分肚皮，四肢微彎，呈現親近又帶保留的姿態。","core":"魅力展現、試探靠近、亦真亦假","positive":"適度展現輕鬆與親切，可以增加互動機會；不必在初次接觸時急著定義關係。","caution":"看起來迷人的邀請仍需了解條件和意圖；保留界線，不以表面親近替代可靠的互動證據。","synthesis":"你可以開放心門，也可以慢慢確認。親密與自我保護可以同時存在。","group":1,"keys":["魅力展現","試探靠近","亦真亦假"],"pace":1,"tags":["connect","caution"],"focus":"靠近與試探","step":"確認互動的條件"},{"id":17,"name":"呆滯放空","scene":"貓咪筆直坐著、眼神短暫失焦，舌尖露出一小截。","core":"資訊過載、大腦當機、暫時抽離","positive":"若感覺思緒繁雜，不妨暫停接收資訊，給自己一段不用立即回答的時間。","caution":"在疲憊時更容易忽略細節；重要的工作與決策可以延後核對，或請可信賴的人共同檢查。","synthesis":"空白並非浪費。讓注意力重新整理，再回來處理真正重要的訊息。","group":1,"keys":["資訊過載","大腦當機","暫時抽離"],"pace":-2,"tags":["rest","confusion"],"focus":"資訊過載","step":"暫時減少雜訊"},{"id":18,"name":"夜視瞳孔","scene":"貓咪蹲坐在深灰色場景中，雙眼映出微光，放大的瞳孔帶出警覺與專注。瞳孔不畫成純白圓點。","core":"辨識訊息、看穿表象、直覺敏銳","positive":"在局勢不明時，先放慢判斷，留意被忽視的訊息並逐項查證。","caution":"不確定感也容易引發過度聯想；不要把猜測或直覺當成對他人的事實判定。","synthesis":"敏銳的觀察若加上求證，就能成為清晰的判斷；別讓黑暗放大了想像中的怪物。","group":1,"keys":["辨識訊息","看穿表象","直覺敏銳"],"pace":-1,"tags":["observe","clarity"],"focus":"留意細節","step":"查證實際線索"},{"id":19,"name":"互相理毛","scene":"兩隻幾何貓咪親暱靠近，彼此輪流低頭舔拭對方的頭頂與頸部，清楚表現互相照顧。","core":"雙向滋養、平等互信、溫柔支持","positive":"這張牌象徵互相照應的理想互動，提醒你珍惜善意，也檢視實際相處是否讓彼此都被理解。","caution":"若照顧長期只由一方承擔，可能形成負擔；適時說清楚期待與可負荷的程度。","synthesis":"好的連結需要願意來回的支持。觀察實際行動、真誠回應，讓關係保持平衡。","group":2,"keys":["雙向滋養","平等互信","溫柔支持"],"pace":0,"tags":["support","connect"],"focus":"互相照應","step":"尋找平等的支持"},{"id":20,"name":"尾巴勾勾","scene":"一隻貓向前邁步，另一隻安靜端坐，兩隻自然長度的尾巴輕輕交勾。","core":"無聲默契、獨立相伴、心靈連結","positive":"可以練習在陪伴中保有各自的興趣與步調，不必以時時刻刻相處作為親密的唯一標準。","caution":"默契不能完全代替溝通；若感到距離改變，不妨用具體提問確認彼此需要。","synthesis":"自由與連結可以共存。保留空間，也留意把關心說出來的時機。","group":2,"keys":["無聲默契","獨立相伴","心靈連結"],"pace":0,"tags":["connect","boundary"],"focus":"獨立而連結","step":"尊重彼此空間"},{"id":21,"name":"領地標記","scene":"貓咪用臉頰和下巴磨蹭垂直幾何桌腳，呈現熟悉環境中的領地標記行為。","core":"建立歸屬、確認位置、畫出界線","positive":"在新環境中清楚表達自己的角色與需求，逐步建立可安心投入的空間。","caution":"歸屬感不等於所有權；記得尊重其他人的界線、選擇與自主。","synthesis":"站穩自己的位置，也讓他人保有位置，才更容易建立互相尊重的關係。","group":2,"keys":["建立歸屬","確認位置","畫出界線"],"pace":0,"tags":["boundary","security"],"focus":"建立歸屬","step":"確認互動界線"},{"id":22,"name":"背對背坐","scene":"兩隻貓咪背靠背而坐，頭朝不同方向，身體接近但各自安靜。","core":"各自冷靜、空間需求、互不干擾","positive":"若互動暫時緊繃，可以給彼此一段整理情緒的時間，之後再討論需要談的問題。","caution":"空間有助冷靜，但若長期不願對話，也可能累積誤解；可約定再溝通的時機。","synthesis":"暫時背對背不必等於關係疏離。尊重距離，也保留重新轉身的可能。","group":2,"keys":["各自冷靜","空間需求","互不干擾"],"pace":-1,"tags":["rest","boundary"],"focus":"需要留白","step":"安排冷靜與溝通"},{"id":23,"name":"搶奪紙箱","scene":"兩隻貓咪擠進同一個狹窄幾何紙箱，彼此推擠、爭取有限位置。","core":"資源競爭、利益衝突、立場碰撞","positive":"當資源有限時，先清楚提出自己的需要，並了解可能的分配方式。","caution":"若只執著於眼前的小空間，可能忽略替代方案；不要未經確認就把競爭理解成惡意。","synthesis":"爭取應有權益，也留意能否擴大選擇；有時真正的解法在箱子外面。","group":2,"keys":["資源競爭","利益衝突","立場碰撞"],"pace":1,"tags":["conflict","resources"],"focus":"資源與立場碰撞","step":"尋找合宜的分配"},{"id":24,"name":"蹭腿撒嬌","scene":"貓咪尾巴高揚，沿著人類幾何小腿彎身輕蹭，表現主動靠近。","core":"主動示好、尋求協助、柔軟身段","positive":"若需要協助，可以直接且真誠地表達需求，不必把求助視為失去能力。","caution":"尋求支持時也要保留自主，避免為了得到回應而過度迎合。","synthesis":"柔軟是一種勇氣。把需要說清楚，也相信自己能參與解決問題。","group":2,"keys":["主動示好","尋求協助","柔軟身段"],"pace":1,"tags":["connect","support"],"focus":"主動求助","step":"提出真實需求"},{"id":25,"name":"門縫偷窺","scene":"半開的幾何門後方，貓咪小心探出半顆頭，觀察門外環境。","core":"探索未知、謹慎試探、保持距離","positive":"面對新環境或不熟悉的人，先收集資訊、確認安全，再決定如何接近。","caution":"一直停留在觀察階段，可能讓自己錯過想參與的事；但是否跨出仍以實際情況為準。","synthesis":"謹慎是保護自己的一種方式。準備足夠後，再選擇適合自己的步伐。","group":2,"keys":["探索未知","謹慎試探","保持距離"],"pace":-1,"tags":["observe","caution"],"focus":"謹慎探看","step":"先了解安全條件"},{"id":26,"name":"母雞蹲陣","scene":"三隻幾何貓咪並排呈收爪的「母雞蹲」姿態，神情安靜，各自仍有獨立輪廓。","core":"團隊共識、穩定陪伴、集體力量","positive":"留意哪些合作與團隊規則能提供支持，讓個人的力量在協作中發揮。","caution":"群體一致不等於想法一定正確；對重要決策仍要保有獨立判斷。","synthesis":"團隊能帶來安定感；在互相支持的同時，也請保留每個人的聲音。","group":2,"keys":["團隊共識","穩定陪伴","集體力量"],"pace":0,"tags":["support","group"],"focus":"融入團隊","step":"兼顧合作與主見"},{"id":27,"name":"傲嬌轉頭","scene":"貓咪靠在人身邊坐著，頭卻轉向外側，呈現親近與保留並存的姿態。","core":"口是心非、渴望關注、別扭試探","positive":"這張牌可以提醒你注意是否有難以表達的在意。若想確認心意，不妨用坦率的對話代替猜測。","caution":"反話與冷淡有時會造成誤解；不要僅憑外在姿態斷定他人的真實意圖。","synthesis":"把想被理解的感受說出來，可能比等待對方猜中更能拉近距離。","group":2,"keys":["口是心非","渴望關注","別扭試探"],"pace":-1,"tags":["connect","confusion"],"focus":"表達不夠坦率","step":"練習清楚說明需求"},{"id":28,"name":"金色罐頭","scene":"貓咪抬頭看向已開啟的幾何罐頭，旁邊以簡單線形或色塊表現香氣。","core":"成果累積、實質資源、留意回報","positive":"可以盤點已經付出的努力與目前能運用的資源，留意值得評估的機會。","caution":"即使機會很吸引人，也要確認附帶的條件、成本與責任；不可把牌面當成收益保證。","synthesis":"保持務實與開放，先把條件看清楚，才能穩穩承接真正適合自己的收穫。","group":3,"keys":["成果累積","實質資源","留意回報"],"pace":1,"tags":["resources","opportunity"],"focus":"累積實質成果","step":"核對機會條件"},{"id":29,"name":"空空食盆","scene":"貓咪低頭望著面前空無一物的扁平幾何食盆，姿態安靜。","core":"資源匱乏、期待落空、需要補給","positive":"如果感覺自己正在耗盡心力或資源，可以先盤點缺少什麼，再找尋適當補充方式。","caution":"反覆投入而沒有足夠回應時，值得檢查是否需要調整期待、界線或資源配置。","synthesis":"發現不足，不代表失敗。先照顧最基本的需要，再決定該留下、協調或另尋方向。","group":3,"keys":["資源匱乏","期待落空","需要補給"],"pace":-1,"tags":["scarcity","resources"],"focus":"感到資源不足","step":"盤點真正的缺口"},{"id":30,"name":"打翻水杯","scene":"貓咪在高台上伸出前爪，幾何水杯正傾倒，水花以簡潔碎片呈現。","core":"突發插曲、情緒起伏、打破僵局","positive":"若計畫遭遇意外變動，可以先處理眼前影響，再思考是否有改良安排的機會。","caution":"急躁與疏忽可能增加善後成本；對真正的損失應以事實與需要處理的程度評估。","synthesis":"突發事件未必帶來好處，但冷靜處理、調整方法，可以減少混亂並重新取得主導。","group":3,"keys":["突發插曲","情緒起伏","打破僵局"],"pace":2,"tags":["disrupt","risk"],"focus":"遇上突發變動","step":"冷靜應對插曲"},{"id":31,"name":"一束陽光","scene":"貓咪蜷縮在地面，一束斜射的白色幾何光線籠罩身體，周圍留白。","core":"有利條件、順勢而為、溫暖支持","positive":"看看周遭是否有可運用的有利條件或實際支持；善用這些資源，讓計畫穩健向前。","caution":"環境條件可能改變，享受順境的同時，也要持續建立自己的能力與備案。","synthesis":"珍惜當下的光亮，同時練習自己辨認方向；好條件與主動準備相互加成。","group":3,"keys":["有利條件","順勢而為","溫暖支持"],"pace":0,"tags":["support","opportunity"],"focus":"擁有有利條件","step":"善用當下的支持"},{"id":32,"name":"毛線球陣","scene":"貓咪趴在纏繞的幾何毛線中，以圓形色塊與交錯線段呈現打結。","core":"思緒混亂、問題纏繞、整理頭緒","positive":"如果事情相互牽連而難以釐清，不妨先找出其中最關鍵的一條線索，再逐步處理。","caution":"在沒有順序的情況下急著一次解決全部問題，可能反而增加負擔；必要時可尋求協助。","synthesis":"問題並不一定簡單，但可以拆小。從能確認的部分開始，讓複雜逐漸變得可處理。","group":3,"keys":["思緒混亂","問題纏繞","整理頭緒"],"pace":-2,"tags":["confusion","pressure"],"focus":"陷入糾結混亂","step":"找出最重要的線頭"},{"id":33,"name":"未關的門","scene":"微開的幾何門扇透出一道光，貓咪坐在門檻前凝望，門並未完全敞開。","core":"機會浮現、微露縫隙、主動探索","positive":"若生活中出現值得評估的新選項，可以先蒐集資訊、嘗試接觸，不必一次做完所有決定。","caution":"不宜因害怕未知而無限期觀望，也不宜把一點線索誤認為已經確定的機會。","synthesis":"門縫象徵可能性。先確認門後的條件，再決定是否推開那一步。","group":3,"keys":["機會浮現","微露縫隙","主動探索"],"pace":1,"tags":["opportunity","explore"],"focus":"新方向露出縫隙","step":"小規模探索可能性"},{"id":34,"name":"神秘小禮物","scene":"貓咪端坐低頭，身前放著一件小巧的幾何物件，保留「是什麼禮物」的想像空間。","core":"意外驚喜、獨特心意、換位思考","positive":"留意生活中那些不一定符合期待、卻可能帶來溫暖的小事，並練習用不同角度理解表達方式。","caution":"不應直接推定禮物代表對方的心意；可以感謝善意，也可以坦率說明自己的需要。","synthesis":"換位思考讓互動更柔軟。理解彼此表達方式的差異，能減少不必要的誤會。","group":3,"keys":["意外驚喜","獨特心意","換位思考"],"pace":0,"tags":["support","connect"],"focus":"看見獨特心意","step":"確認彼此期待"},{"id":35,"name":"貓薄荷派對","scene":"貓咪在地上愉快翻滾，周圍散落簡化的幾何葉片與顆粒。","core":"盡情放鬆、釋放壓力、短暫歡愉","positive":"若生活過度緊繃，可以安排適度的休閒、玩樂和沒有成果壓力的時間。","caution":"休閒若成為長期迴避必要事項的方式，可能需要重新調整生活平衡。","synthesis":"快樂值得被保留。讓玩樂真正幫你補充精神，而不是取代需要面對的課題。","group":3,"keys":["盡情放鬆","釋放壓力","短暫歡愉"],"pace":1,"tags":["rest","joy"],"focus":"短暫放鬆","step":"兼顧歡笑與責任"},{"id":36,"name":"貓砂掩埋","scene":"貓咪微微前傾，以一隻前腳向後撥動幾何貓砂，揚起少量砂礫碎片。","core":"主動告別、清理過去、劃下句點","positive":"如果某件事已完成或不再適合，可以嘗試好好整理、交代必要責任，再為它劃下句點。","caution":"結束不等於掩蓋；尚需處理的事實、責任或情緒，值得以適當方式面對。","synthesis":"真正放下是妥善收尾後向前走，而不是假裝問題從來不存在。","group":3,"keys":["主動告別","清理過去","劃下句點"],"pace":-1,"tags":["ending","change"],"focus":"結束一段舊事","step":"妥善收束與放下"},{"id":37,"name":"滿月凝視","scene":"深炭灰色大圓月位於後景，前景是一隻純白、端坐仰望的貓咪剪影。","core":"情緒明朗、週期圓滿、內在清晰","positive":"可以藉「月亮逐漸圓滿」的意象，回顧一段歷程中已經變得清楚的感受與需求。","caution":"當情緒特別強烈時，避免把瞬間感受當成全部事實；重要決定可先休息、核對資訊。","synthesis":"圓滿象徵看見階段性的輪廓。承認情緒，也用清醒的步調回應自己的需要。","group":4,"keys":["情緒明朗","週期圓滿","內在清晰"],"pace":0,"tags":["emotion","change"],"focus":"情緒與週期轉變","step":"覺察當下感受"},{"id":38,"name":"影子分身","scene":"一隻淺灰貓咪低頭看地面，地上延伸出形體鮮明的深黑幾何長影。","core":"內在陰影、自我覺察、接納全貌","positive":"試著看見平常不願承認的感受、恐懼與需要，以較少批判的方式理解自己。","caution":"強烈的排斥不一定全來自外界，也可能混有過往經驗；在責怪他人前可先檢視自身反應，但不必把他人的傷害歸咎於自己。","synthesis":"接納陰影不是認同所有行為，而是認識自己的更多面向，減少被未察覺的情緒牽著走。","group":4,"keys":["內在陰影","自我覺察","接納全貌"],"pace":-1,"tags":["reflect","emotion"],"focus":"面對內在陰影","step":"正視自己的需求"},{"id":39,"name":"鏡中幻影","scene":"垂直的幾何鏡框內外，黑白反轉的兩隻貓咪隔鏡伸爪，形成對照。","core":"關係投射、認知偏差、看清真實","positive":"重新檢查自己對某個人或事件的理解，分清「已看到的行為」與「自己賦予的意義」。","caution":"期待、恐懼和過往經驗可能造成認知濾鏡；不要據此否定對方，也不要把猜測當成已確認的事實。","synthesis":"擦亮心中的鏡子不是讀懂他人的秘密，而是更清楚地辨別證據與解讀，讓溝通更公平。","group":4,"keys":["關係投射","認知偏差","看清真實"],"pace":-1,"tags":["reflect","clarity"],"focus":"辨別投射與事實","step":"核對現實資訊"},{"id":40,"name":"屋頂漫步","scene":"貓咪沿幾何三角形屋脊謹慎行走，身體保持平衡，路徑顯得狹窄。","core":"步步為營、風險平衡、高處挑戰","positive":"在有挑戰的任務裡，可先釐清可接受的風險、必要裝備與下一步，再穩健推進。","caution":"冒險精神值得珍惜，但不可忽略實際安全條件；必要時選擇較穩妥的替代路徑。","synthesis":"勇氣不等於不怕跌倒。看清腳下的位置，會讓你更有餘裕欣賞高處的風景。","group":4,"keys":["步步為營","風險平衡","高處挑戰"],"pace":1,"tags":["risk","action"],"focus":"穩健面對風險","step":"評估步伐與代價"},{"id":41,"name":"夢境浮游","scene":"閉眼側睡的貓咪上方，漂浮數個大小漸變的白色幾何泡泡，象徵夢與想像。","core":"潛意識聯想、靈感湧現、願望藍圖","positive":"夢境和突發想法可以成為探索個人願望、情緒與創意的素材，不妨記錄並回頭整理。","caution":"夢不必然預告外界事件，也不能證明他人意圖；好的想像仍需要具體行動及事實檢驗。","synthesis":"把夢當成靈感的信件，不必當成未來的通知。選擇值得實踐的部分，逐步帶進生活。","group":4,"keys":["潛意識聯想","靈感湧現","願望藍圖"],"pace":-1,"tags":["reflect","ideal"],"focus":"夢境與靈感","step":"記錄並檢驗想法"},{"id":42,"name":"十字路口","scene":"地面由深淺幾何圖形構成兩條分岔道路，貓咪停在交會處觀望。","core":"方向抉擇、轉折節點、傾聽內心","positive":"若面臨選擇，可整理每條路的優點、代價和個人價值，再決定較符合目前需要的方向。","caution":"只依直覺或只聽外界意見都可能忽略條件；對重大決定要納入時間、資源與風險。","synthesis":"沒有哪條路因抽到牌而被注定。理解自己的取捨後，才能真正為選擇負責。","group":4,"keys":["方向抉擇","轉折節點","傾聽內心"],"pace":0,"tags":["decision","change"],"focus":"比較不同方向","step":"列出可行選項"},{"id":43,"name":"鈴鐺聲響","scene":"由灰階多邊形拼成的項圈與圓形鈴鐺特寫，強調清晰的聲音意象。","core":"警醒提醒、外界訊號、敏銳覺察","positive":"可以主動檢查近期值得留意的通知、對話與未處理事項，辨別哪些訊息真正重要。","caution":"鈴鐺象徵注意，而非預告必然收到某則消息；也不要讓外界評價取代自己的判斷。","synthesis":"聽見提醒之後仍需辨認來源。分清訊號與雜音，再決定是否回應。","group":4,"keys":["警醒提醒","外界訊號","敏銳覺察"],"pace":0,"tags":["observe","signal"],"focus":"察覺外界提醒","step":"核實訊息的重要性"},{"id":44,"name":"鼻尖蝴蝶","scene":"貓咪安靜坐著，鼻尖停著一隻由四個小三角形拼成的白色蝴蝶。","core":"溫柔轉化、靜心觀察、保留空間","positive":"當自己不再一味催促成果時，可能更容易注意到日常裡細緻的美好與靈感。","caution":"過度控制可能壓縮關係與創意的空間；但「放下追逐」也不等於任何好事會自動出現。","synthesis":"適度放慢、保留彈性。美好能否靠近仍取決於真實條件，而你可以先讓自己更願意看見它。","group":4,"keys":["溫柔轉化","靜心觀察","保留空間"],"pace":0,"tags":["rest","opportunity"],"focus":"放下過度控制","step":"給美好留些空間"},{"id":45,"name":"凌空翻身","scene":"貓咪在半空中扭轉身體、舒展四肢，正嘗試調整姿態以準備落地。","core":"靈活應變、調整姿態、強大韌性","positive":"遇到變動時，可盤點手上資源、調整做法並尋找協助，嘗試重新取得平衡。","caution":"適應能力不代表每次都能化險為夷；避免把意外風險合理化成證明自己的機會。","synthesis":"韌性是願意因應現實，不是保證永遠不受傷。及時修正，往往比逞強更可靠。","group":4,"keys":["靈活應變","調整姿態","強大韌性"],"pace":2,"tags":["adapt","risk"],"focus":"靈活調整姿態","step":"尋找重新站穩的方法"},{"id":46,"name":"晨間伸展","scene":"貓咪前腳伸向前方、胸口壓低、臀部翹起，呈現自然的起身伸懶腰姿態。","core":"剛起步、暖身階段、喚醒能量","positive":"對剛開始的計畫或關係，可以先做好必要準備，用小步驟建立穩定節奏。","caution":"尚未具備條件時急著承擔太多，可能讓自己疲憊；但準備也不應變成無止境拖延。","synthesis":"好的開始不必很快。先把身心與條件調整到適合的位置，再逐漸增加速度。","group":5,"keys":["剛起步","暖身階段","喚醒能量"],"pace":0,"tags":["prepare","action"],"focus":"起步暖身","step":"先做好基本準備"},{"id":47,"name":"定格靜止","scene":"貓咪走到一半突然停住，一隻前腳懸空，姿勢定格在觀察的瞬間。","core":"瞬間警覺、暫緩決定、觀察異常","positive":"當某個細節讓你產生疑慮時，可以暫停下一步，重新確認資料、環境與自身感受。","caution":"有疑慮不表示危險已存在；檢查後若無實際問題，也可讓自己重新行動。","synthesis":"停下是為了看清，不是永遠停住。讓觀察與求證決定下一步，而不是讓恐懼決定。","group":5,"keys":["瞬間警覺","暫緩決定","觀察異常"],"pace":-2,"tags":["caution","observe"],"focus":"暫停確認疑點","step":"釐清條件再前進"},{"id":48,"name":"鍵盤霸佔","scene":"貓咪趴在一片幾何鍵盤方格上，遮住原本正在使用的工作區。","core":"外在干擾、重新排序、生活平衡","positive":"當既定安排被打斷時，先區分緊急、重要與可延後的事情，再重新安排注意力。","caution":"外在中斷不必然代表身體或生活出了問題；但若長期疲憊，仍值得檢視負荷與休息。","synthesis":"計畫有時需要讓位給其他需要。調整優先順序，可以讓生活更有彈性。","group":5,"keys":["外在干擾","重新排序","生活平衡"],"pace":-2,"tags":["disrupt","order"],"focus":"外在打斷安排","step":"重新排列優先次序"},{"id":49,"name":"豎尾小跑","scene":"貓咪尾巴高高豎起、末端微勾，神情輕快地向前小跑。","core":"積極迎接、愉悅進展、順流推進","positive":"如果目前事情推進得較順，不妨保持開放與積極，善用眼前可確認的機會。","caution":"進展輕快時仍需核對基本細節，不要因為興奮而忽略已知限制。","synthesis":"帶著喜悅向前，不必把每一步都變成壓力；穩穩地跑，才能享受路上的風景。","group":5,"keys":["積極迎接","愉悅進展","順流推進"],"pace":1,"tags":["action","opportunity"],"focus":"輕快向前","step":"保持積極並核對細節"},{"id":50,"name":"迎風嗅聞","scene":"貓咪端坐抬頭嗅聞，身旁是斜向幾何風線與一片被吹動的落葉。","core":"察覺變化、趨勢轉換、順應時節","positive":"可以留意周遭條件是否正在改變，及早更新資訊與調整方法，讓準備更貼近現況。","caution":"別把主觀預感當成已發生的趨勢；對重要變化應查證，並避免只靠過去的成功經驗。","synthesis":"學會聽風，也要看天氣。把敏感度和事實核對放在一起，才能走得更穩。","group":5,"keys":["察覺變化","趨勢轉換","順應時節"],"pace":0,"tags":["change","observe"],"focus":"察覺環境變化","step":"隨條件調整方向"},{"id":51,"name":"水窪倒影","scene":"貓咪蹲坐，低頭看地面雨後水窪，水面有幾圈幾何漣漪。","core":"情緒沉澱、雨過天晴、向內傾聽","positive":"若經歷波動，可以先容許情緒慢慢平復，再回頭整理自己真正的感受與需要。","caution":"情緒強烈時的想法可能較片面，但不應因此否定感受本身；重大判斷宜補足資訊。","synthesis":"等水面平靜，你也許能看得更清楚。照顧情緒與了解事實可以同步進行。","group":5,"keys":["情緒沉澱","雨過天晴","向內傾聽"],"pace":-2,"tags":["emotion","rest"],"focus":"讓情緒沉澱","step":"先讓心情慢慢平穩"},{"id":52,"name":"膝上王座","scene":"一個簡化的人類坐姿雙腿輪廓，貓咪安穩地蜷縮在膝蓋上休息。","core":"安心依靠、信任支持、穩定連結","positive":"這張牌提醒你辨認生活中哪些人事物能提供可靠支持，並透過持續互動好好經營。","caution":"單張牌不能保證關係長久穩定；信任仍要由實際行為、互惠與尊重逐步建立。","synthesis":"安心不必等於依賴。互相扶持、同時保有自主，連結才更有韌性。","group":5,"keys":["安心依靠","信任支持","穩定連結"],"pace":0,"tags":["support","security"],"focus":"感受安心連結","step":"經營可靠互惠"},{"id":53,"name":"換毛季節","scene":"貓咪甩動身體，周圍飄散細小的白色與淺灰幾何毛絮。","core":"自然蛻變、適應新生、逐步成長","positive":"如果正經歷習慣或角色轉換，給自己一些調整時間，允許過程有不熟悉與不舒適。","caution":"改變不一定總是正向，也不必為改變而改變；評估哪些舊事物需要放下、哪些仍值得保留。","synthesis":"成長未必轟轟烈烈。慢慢調整到適合自己的樣子，就是實在的前進。","group":5,"keys":["自然蛻變","適應新生","逐步成長"],"pace":-1,"tags":["change","adapt"],"focus":"逐步蛻變","step":"給自己適應的時間"},{"id":54,"name":"沙漏凝視","scene":"貓咪端坐，專注望著由兩個對頂三角形組成的簡化幾何沙漏。","core":"時間醞釀、尊重過程、耐心守候","positive":"某些計畫需要累積與等待；可先處理能力範圍內的準備，並設定合理的檢視時間點。","caution":"耐心不等於消極拖延；若環境已經改變，也可能需要更新計畫，而非無條件等待。","synthesis":"時間不能保證想要的結果，但能提供觀察、修正和累積的機會。讓等待成為有方向的準備。","group":5,"keys":["時間醞釀","尊重過程","耐心守候"],"pace":-2,"tags":["time","prepare"],"focus":"等待時機成熟","step":"在等待中持續準備"}];

cards.push(...[{"id":55,"name":"紙船遠航","scene":"貓咪坐在漂向遠方的紙船上，望向星海。","core":"未知、遠方、探索","positive":"拓展視野，嘗試有準備的新路。","caution":"漫無目的離開，可能只是逃避眼前問題。","synthesis":"遠行前帶上必要準備，也保留回岸的方式。","group":6,"keys":["未知","遠方","探索"],"pace":1,"tags":["explore","change"],"focus":"未知","step":"拓展視野，嘗試有準備的新路。"},{"id":56,"name":"蛇影迷蹤","scene":"貓咪隔著草叢觀察蜿蜒的蛇影。","core":"誘惑、謀略、辨識","positive":"保有靈活與觀察力，檢查複雜局面的條件。","caution":"別因漂亮的外表忽略代價，也不要無證據揣測別人。","synthesis":"看清曲折的路徑，再決定是否跟隨。","group":6,"keys":["誘惑","謀略","辨識"],"pace":-1,"tags":["observe","caution"],"focus":"誘惑","step":"保有靈活與觀察力，檢查複雜局面的條件。"},{"id":57,"name":"巨熊守護","scene":"小貓坐在巨熊身旁，巨熊伸掌護住牠。","core":"力量、庇護、掌控","positive":"借力可靠後盾，也善用自己的力量。","caution":"過度保護可能成為控制，留意自主與界線。","synthesis":"真正的力量能守護，而不必支配。","group":6,"keys":["力量","庇護","掌控"],"pace":0,"tags":["support","boundary"],"focus":"力量","step":"借力可靠後盾，也善用自己的力量。"},{"id":58,"name":"塵封之書","scene":"貓咪俯身聞一本尚未翻開的古書。","core":"知識、秘密、未知","positive":"以好奇與查證探索未知。","caution":"未知不等於真相，不要用猜測補足資訊。","synthesis":"翻開一頁，讓新知修正既有理解。","group":6,"keys":["知識","秘密","未知"],"pace":-1,"tags":["observe","curiosity"],"focus":"知識","step":"以好奇與查證探索未知。"},{"id":59,"name":"封蠟來信","scene":"貓咪伸爪觸碰一封封蠟的信。","core":"傳遞、表達、心意","positive":"清楚表達想法，讓溝通可以被理解。","caution":"訊息易有誤差，先確認來源與字句。","synthesis":"讓心意抵達，也讓收信的人有選擇。","group":6,"keys":["傳遞","表達","心意"],"pace":1,"tags":["signal","connect"],"focus":"傳遞","step":"清楚表達想法，讓溝通可以被理解。"},{"id":60,"name":"禮帽紳士","scene":"貓咪戴著禮帽，在鏡前端坐。","core":"身分、立場、擔當","positive":"選擇如何承擔自己的角色，讓言行一致。","caution":"不必為維護形象而犧牲真實需要。","synthesis":"帽子只是角色，行動才呈現自己。","group":6,"keys":["身分","立場","擔當"],"pace":0,"tags":["goal","reflect"],"focus":"身分","step":"選擇如何承擔自己的角色，讓言行一致。"},{"id":61,"name":"羽帽淑女","scene":"貓咪戴羽飾帽，從敞開的窗望向遠方。","core":"自主、意願、自我選擇","positive":"尊重自己的意願，為選擇保留自主空間。","caution":"迎合期待可能讓需求失去位置。","synthesis":"優雅不是義務，自由也包含尊重他人。","group":6,"keys":["自主","意願","自我選擇"],"pace":0,"tags":["decision","boundary"],"focus":"自主","step":"尊重自己的意願，為選擇保留自主空間。"},{"id":62,"name":"百合靜謐","scene":"貓咪靜臥於月色下的百合花旁。","core":"成熟、安寧、歲月","positive":"以閱歷與    if(!sectionOK||!ui58Own(data[section],key)){missing++;issues.push({type:'缺漏',path,reason:'使用內建預設值。'});continue}

   if(!validated){ignored++;issues.push({type:'格式',path,reason:hint+' 此欄使用預設值。'});continue}
   const input=Array.isArray(value)?value:[value];
   if(validated.length!==input.length)issues.push({type:'候選',path,reason:'已排除 '+(input.length-validated.length)+' 則無效或重複候選。'+hint});
   active[section][key]=validated;accepted++;
  }
  if(sectionOK)for(const key of Object.keys(data[section]))if(!ui58Own(fields,key)){unknown++;issues.push({type:'未知',path:section+' / '+key,reason:'非支援欄位，未使用。'})}
 }
 for(const section of Object.keys(data))if(!ui58Own(ui58Defaults,section)){unknown++;issues.push({type:'未知',path:section,reason:'非支援分類，未使用。'})}

 const matches=(p,q)=>(hasTag(a,p)&&hasTag(b,q))||(hasTag(a,q)&&hasTag(b,p));

 else if(matches('ending','opportunity')||matches('ending','explore')||matches('change','ending')){type='transition';topic='告別與新方向';score=9}
 else if(matches('prepare','action')||matches('prepare','opportunity')){type='transition';topic='準備與推進';score=9}
 else if(matches('confusion','clarity')||matches('ideal','clarity')||matches('caution','clarity')){type='adjustment';topic='想像與現實的核對';score=9}
 else if(matches('pressure','rest')||matches('disrupt','order')){type='adjustment';topic='負荷與休整';score=9}
 else if(matches('connect','boundary')||matches('support','boundary')){type='balance';topic='靠近與界線';score=9}
 else if(matches('risk','opportunity')||matches('risk','action')){type='balance';topic='機會與風險';score=9}
 else if(matches('conflict','support')||matches('conflict','connect')){type='balance';topic='競爭與協調';score=9}
 else if(matches('decision','time')||matches('decision','caution')){type='balance';topic='選擇與時機';score=9}
 else if((a.pace>=1&&b.pace<=-2)||(b.pace>=1&&a.pace<=-2)){type='contrast';topic='行動與暫停';score=10}
 else if(matches('change','security')){type='balance';topic='改變與安定';score=8}
 else if(a.tags.some(t=>b.tags.includes(t))){type='support';topic='相互強化的訊息';score=6}
 else if(b.pace>a.pace+1){type='transition';topic='節奏漸進';score=5}
 else if(b.pace<a.pace-1){type='adjustment';topic='放緩與調整';score=5}
 return {a,b,type,topic,score,key:pairKey(a,b)};
}
function analyzeThree(picks,topic){
 const edges=[relation(picks[0],picks[1]),relation(picks[1],picks[2]),relation(picks[0],picks[2])];
 const bonuses=[1.18,1.20,.82];
 const topicWords={love:['connect','boundary','support','security'],work:['action','prepare','resources','decision'],money:['resources','scarcity','risk','opportunity'],self:['reflect','emotion','care','change'],general:[]}[topic]||[];
 edges.forEach((r,i)=>{r.weight=r.score*bonuses[i]+(r.a.tags.concat(r.b.tags).some(t=>topicWords.includes(t))?.7:0)});
 edges.sort((x,y)=>y.weight-x.weight);
 return {primary:edges[0],secondary:edges[1],all:edges};
}

function analyzeArc(picks,topic='general',focus=''){
 if(!Array.isArray(picks)||![3,5].includes(picks.length)||new Set(picks.map(c=>c.id)).size!==picks.length||picks.some(c=>!arcEnergy[c.id]))return null;

 const path=five?[picks[3],picks[0],picks[4]]:picks.slice();
 const [a,b,c]=path.map(k=>arcEnergy[k.id]);
 const pattern=arcClassify(a.primary,b.primary,c.primary);
 const changes=Number(a.primary!==b.primary)+Number(b.primary!==c.primary);
 const spread=key=>Math.max(a[key],b[key],c[key])-Math.min(a[key],b[key],c[key]);
 const sharedSecondary=Number(a.secondary===b.primary||b.secondary===a.primary)+Number(b.secondary===c.primary||c.secondary===b.primary);
 // Distinct symbols alone do not guarantee a meaningful turn. Secondary affinity and pace/steadiness provide corroboration.
 const score=changes*2+spread('steadiness')*.75+spread('tempo')*.5+sharedSecondary*.5+(pattern.type==='special'?1:0);
 const visible=changes>0&&score>=5.5 || changes===0&&spread('steadiness')<=2&&spread('tempo')<=2;
 // Only visible arcs need a contextual observation. The spread/score and card roles above remain unchanged.
 const scope=(focusOptions[topic]||[]).some(x=>x.id===focus)?focus:topic;
 const summary=visible?contextual46ArcText(scope,pattern.index):'';
 let vertical=null;
 if(five){
  const u=arcEnergy[picks[1].id],d=arcEnergy[picks[2].id];
  // The upper position is an available lens; lower is risk, not an inevitable negative event.
  const tension=u.primary===2||d.primary===2||d.steadiness<=-1;

}

  try{tx=db.transaction('journal',mutator?'readwrite':'readonly');store=tx.objectStore('journal');req=store.get('snapshot')}catch(e){moodDBPromise=null;end(false,e);return}
  tx.oncomplete=()=>end(true,result);
  tx.onabort=()=>end(false,err||tx.error||new Error(ui58Text("心情罐頭","本機儲存已中斷")));
  tx.onerror=()=>{if(!err)err=tx.error||new Error(ui58Text("心情罐頭","本機儲存失敗"))};
  timer=setTimeout(()=>{err=new Error(ui58Text("心情罐頭","本機儲存逾時，請再試一次"));try{tx.abort();end(false,err)}catch(e){/* 已進入提交階段：等待 complete/abort，避免將成功寫入誤報為失敗。 */}},MOOD_STORAGE_TIMEOUT);

// Shared flight: same animation timing and easing on both tables; optional exact target scale for face-up cards.
function scatterFlight(element,target,done,fit=false){
 if(!element||!target||dreamReducedMotion()||!element.animate){done();return}
 const from=element.getBoundingClientRect(),to=target.getBoundingClientRect();
 if(!from.width||!from.height||!to.width||!to.height){done();return}
 const ghost=element.cloneNode(true);ghost.classList.add('scatter-flight-ghost');
 ghost.removeAttribute('id');ghost.removeAttribute('data-action');ghost.removeAttribute('data-id');ghost.removeAttribute('data-index');ghost.removeAttribute('data-card-id');ghost.removeAttribute('disabled');ghost.setAttribute('aria-hidden','true');ghost.tabIndex=-1;
 ghost.style.cssText=`position:fixed;z-index:180;pointer-events:none;left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px;min-height:0;transform:none;opacity:1;margin:0`;
 document.body.appendChild(ghost);element.classList.add('is-taking');
 const dx=to.left+to.width/2-(from.left+from.width/2),dy=to.top+to.height/2-(from.top+from.height/2);
 const scale=fit?Math.min(to.width/from.width,to.height/from.height):.75;
 let finished=false;
 const finish=()=>{if(finished)return;finished=true;ghost.remove();done()};
 try{const ani=ghost.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(${scale}) rotate(6deg)`,opacity:.75}],{duration:340,easing:'cubic-bezier(.2,.72,.23,1)',fill:'forwards'});ani.finished.then(finish,finish);setTimeout(finish,520)}catch(e){finish()}
}

 p.forEach((c,i)=>{lines.push(`${ui58Role(role[i])}｜${num(c.id)} ${c.name}`)});
 const r=currentReading();
 lines.push(ui58Text("結果分析","重點：〔變數〕", [r.title]));
 for(const block of catReadingBlocks(r)){
  if(block.kind==='arc')lines.push(ui58Text("結果分析","局勢弧線・〔變數〕", [block.label]),block.text);

根毛都不亂。教材、筆記與作品整理好即可，真正學會比收藏更多重要。","哪個實作讓你做完忍不住想呼嚕？那也許值得再深入學習。","遇到陌生難題會緊張很正常，先區分是不熟還是真的超過目前能力。","學習時有不懂的地方可以說出來，不必用忍耐換老師的好評。","想成為怎樣的專業者，可以想像未來做得到的作品和任務。","老師、同學願意分享經驗很棒，信任也要看回饋是否實際可用。","練習量或學費超出負荷時可以調整，不必因別人都報名就跟上。","漂亮證書和課程廣告不等於實力，先查內容和實作機會。","看教材看到字都糊了就先休息，重要知識留到清醒時理解。","本喵聽見小球在沙發底滾動，也要探頭看看才知道在哪。學到新觀念時記得核對可信來源，別把猜測當知識。","和學伴互相示範能看到自己不易發現的錯誤，互相幫忙也能累積本事。","有人喜歡一起上課，有人適合獨立練習，選自己的學習節奏就好。","先弄清楚自己想鑽研的專業範圍，不必把所有熱門技能全搬回家。","遇到指導意見不一致，可以先整理自己的問題，再找時間請教。","同樣想進修的人不必搶高下，找適合自己的練習資源比較重要。","真的卡在某個步驟，就請懂的人示範一次吧，別假裝早就會了。","新課程先看大綱和試讀內容，不必立刻買下整套教材。","學習社群可以相互支持，但別人選的進修路線未必適合你。","明明沒聽懂卻點頭說懂，最後還得自己解開更大的教材結。","把已會的技能做成作品或紀錄，累積真正看得見的能力。","缺的可能不是更多教材，而是一段練習時間或一個清楚的解說。","實作失敗先找出哪個步驟有問題，別急著把所有練習推下桌。","若有適合的教材或導師，就善用它們練習目前最需要的能力。","學習卡點很多時，只理最影響理解的那個，其他等一下再說。","新領域有門縫就探探頭，從入門作品或免費教材開始認識。","收到別人的指導意見時，看看哪些能真正改進你的練習。","學習之外也需要玩耍，放鬆有時會讓本喵想到不同的解題方式。","不管用的學法名氣多大，不適合自己就可以收起來，留下有效部分。","回頭做一次以前不會的題目，看看哪些技能已經能獨立使用。","害怕自己學不會時，別只看錯誤，也留意已經練會的部分。","覺得學懂和實際做出來是兩回事，本喵會選個小作品試試。","進階訓練需要基本功，先確認安全、時間和費用是否能負擔。","突然冒出有趣的作品點子可以先畫草稿，動手試驗比追夢更實在。","有好幾個方向想學時，想想哪項對自己的目標最有用途。","叮鈴！新技能和課程的消息先查來源，再看看值不值得花時間。","本喵在追羽毛前會等它飄到適合的地方。作品的靈感也可以醞釀，不必每個點子立刻完成。","卡關可以換個練法，像本喵跳不上高台就先用矮凳練。","入門先熟悉基本工具與動作，別第一天便要求自己做出大師作品。","不確定教材的說法或練習方式時，先停下查清楚。","別讓收藏課程與通知吃掉實作時間，留下真正可以練習的時段。","若最近越來越熟練，可以小幅提高難度，仍要留時間整理基本功。","專業工具和要求會更新，先了解差異，再決定是否需要進修。","練習遇到挫折後等情緒淡些，再看看錯在方法還是熟練度。","可靠的老師或學伴很有價值，也要留些自己思考和獨立練的時間。","新技能需要經過一段適應期，像換毛一樣，今天不必完成所有成長。","有些本事要反覆練才會熟，等進步的同時繼續做有方向的小練習。"],"venture":["創業前鎖定最想服務的客群，先驗證一個需求，別對所有光點飛撲。","從櫃頂看整個商業構想：客群、成本、收入與現金流，能不能支撐日常營運？","本喵遇到新開的門會先探半個頭，觀察裡面有什麼。創業新市場不一定要先租店，從客人的實際需求探起吧。","本喵喜歡玩到累時找地方側躺，下一輪才有精神。事業也得能長久經營，老闆的體力和休息都要算進安排。","先磨好能提供給客人的服務，別把全部力氣用在漂亮的門面上。","本喵追著紅點滿屋跑，最後還是要抓到一個真玩具才過癮。創業熱情很棒，但產品是否有人願意付費仍要驗證。","本喵踩奶總有自己的節拍，經營事業也得找到每天做得下去的方法。","本喵跑酷時會選一條路線，不會同時跳上三張桌子。有新點子就挑一個負擔得起的小試驗，別同時開太多戰線。","把企劃、帳務和工作流程先理清楚，創業不是堆滿待辦就算有進度。","想想你希望事業帶來的生活模樣，除了營收，還有什麼會讓你呼嚕？","有市場或資金上的疑慮就先核對，區分真正的風險和自己的預想。","經營責任若全落在你身上，提早找出不能長期負擔的工作。","想開出心中的店或服務，可以畫個藍圖，再把開業條件一項項查明。","建立客戶與合作夥伴的信任，要靠說到做到而不是只靠好印象。","不合理的合作條件可以拒絕，不能為了一張訂單把底線全送出去。","看起來很誘人的商機，先確認合約、成本和實際需求，別只聞包裝香。","企劃看太久容易失去判斷，先休息再核對那些重要數字。","本喵聽見開包裝的聲音會轉動耳朵，但不是每個袋子都裝著吃的。市場消息要核對實際需求、來源與數字。","合夥像兩隻貓互相理毛，雙方能提供的能力與責任都值得先說好。","事業能有夥伴相助，也要留好經營自主權，別讓分工全靠默契。","經營的定位、權限和品牌歸屬要弄清楚，不要糊塗地共用同一個窩。","遇到合夥爭議可以先停下來，等能冷靜談帳務和責任時再商量。","市場上大家搶同一個紙箱時，不妨想想有沒有尚未被滿足的需求。","不熟悉稅務、法規或經營管理，就找可信的專業人士問清楚。","先從小規模的市場訪談或測試服務開始，不必為陌生商機先付大筆費用。","團隊都很看好的構想，也得查證客戶需求及可行性，不只看大家點頭。","有合作疑慮就把真正想問的條件說清楚，別期待夥伴自己猜出來。","本喵認的是已到手的金罐頭：營收扣掉成本才看得見成果，並非每張訂單都賺錢。","若手上的啟動資金、人力或市場資訊不足，先確認最大的缺口。","經營中若有突發費用或流程出錯，先把損失弄清楚再調整計畫。","若現有客戶回饋、可信資源或價格條件有利，好好利用但別視為保證。","創業構想或待辦像毛線球，先解最影響可行性的那一個結。","新的通路或客群值得低成本試探，門開了不代表非搬進去不可。","遇到意外的合作邀約可以先了解對方想要什麼，再評估責任與條件。","經營也要有歡笑和休息，別靠忙碌後的短暫放縱逃開帳務問題。","不適合的商品或模式可以收掉，同時妥善處理訂單、契約和欠款。","若已有營運紀錄，回頭看數字和客戶回饋；若還在規劃，先想哪些需求與成本值得驗證。","害怕失敗或想證明自己可能影響決策，試著分清經營需要和個人期待。","你喜歡的商品不一定等於客人需要的商品，像豪華貓屋未必贏過外箱。","投入大筆資金前估算最差情況、資金續航和退出方式，踩穩落點再跳。","夢到超棒的新企劃就先寫出來，用原型或訪談看看它能不能成立。","想選哪種營運方式，先比較成本、客群、法規和自己能承擔的時間。","聽到市場新訊或供應商報價先核對來源，別把一個聲響當成必然商機。","本喵看到蝴蝶飛過也不一定追上去。客戶回饋值得留意，但先觀察哪些需求真的反覆出現，不必每次都翻新產品。","若實際營運和想的不一樣，可以縮小規模或換個做法。本喵跳歪了也懂得換姿勢。","剛起步先備好基本流程、必要許可和預算，別急著把事業做成大城堡。","資金或合約有異常時先停，確認真正的條件才作下一筆承諾。","創業的雜事一直冒出來時，先把客戶需求、現金與必要責任排好。","生意如果逐漸有真實回饋，維持品質並核對成本，別因興奮盲目擴張。","客群與市場條件會變，定期查看實際需求，讓經營模式跟著修正。","情緒起伏時先別因一場挫折或一筆訂單作重大投資決定。","可靠的夥伴、供應商和客戶關係需要長期互惠，不能只靠一紙承諾。","事業從試作到穩定經營需要時間，新方法可以分階段調整。","等待市場回饋時整理成本與測試結果，設定回顧時間，不必無限期等下去。"],"money":["錢要花在哪個真正重要的目標？本喵會先瞄準食盆，不亂撲其他罐頭。","站高一點看自己的整體財務，收入、支出和負債要放在一起想。","本喵碰到新的漏食玩具會先看看怎麼打開。陌生的賺錢方法也要查清楚成本、合法性和風險再決定。","不用每分鐘都忙著多賺一點，財務安排也該讓自己有休息的餘裕。","把力氣花在能改善收入或管理金錢的本事，勝過忙著追每個熱門消息。","光點再亮也未必抓得住，本喵很清楚。財富願望可以保留，實際報酬與可能損失仍需核實。","小額而穩定的收支習慣像每天踩奶，舒服又做得久比一時衝動有用。","本喵聽到開飯聲會飛快跑來，可不代表碗裡有很多食物。突然想賺一大筆錢時先確認成本與風險，不因興奮下注。","手上的帳單和存款分開整理，數得清楚的罐頭才是真的資源。","錢帶來的安心和選擇值得珍惜，不必永遠追著更大的數字跑。","如果某項財務安排讓你不安，先查證是哪個風險，不要只靠恐懼判斷。","金錢負擔若已讓你難以喘息，可以找可信的管道討論實際缺口。","想過上什麼樣的生活，就把願望變成能估算的金錢目標。","讓自己有一項清楚的用錢原則，像是先保留必要生活費，再安排其他目標。","不願承擔的金錢責任要說清楚，別因人情把自己的罐頭全交出去。","高回報的說法聽起來很香，先確認費用、來源和可能的損失。","看太多價格和消息會眼花，重大金錢決定可以等精神好再核對。","本喵在暗處看見輪廓，還要靠近才能辨認。錢的事應以實際數字和可靠資料作判斷，直覺不能當收益依據。","一隻貓也有需要幫忙的時候；若帳務複雜，可請合格專業人士協助，仍由自己決定。","讓收入、儲蓄與支出彼此配合，確認自己的財務目標和可負擔程度。","先確認自己能動用的資金、資產與應付債務，別把不同用途混在一起。","當不同的用錢目標互相拉扯時，先把金額、期限及風險列出來再取捨。","資源有限時先把真正需要的費用排好，不必因別人搶購就跟著搶。","帳務、稅務或契約看不懂時，不妨找合格的人協助確認。","沒接觸過的財務方案先看條件和安全性，不必馬上付款。","大家都喊好的投資或收入方式未必符合你，本喵的食量和別貓不同呀。","不必為了面子接受不合理的財務負擔，先訂下自己能承受的金額。","本喵只把已到手的罐頭算進食盆，別把未來可能到手的錢算成現金。","食盆空了先看看是收入不夠、支出太多還是臨時需要，才能找到缺口。","遇到意外開銷時先確認金額與必要性，再調整其他財務安排。","現在若有穩定收入或可靠支援，趁陽光還在替未來留些儲備，不把好條件當成永遠不變。","財務問題很多時先處理最急的帳單，其他逐步核對。","有新收入或理財選項可以了解，先弄懂再決定，不必看到門開就掏錢。","意外得到一筆錢也先確認來源及有無責任，再想怎麼安排。","本喵聞過貓薄荷，打兩個滾就心滿意足啦。只要負擔得起，小小的娛樂可以留下，別一時放鬆就超過預算。","清理不合適的帳務安排前，要弄清未付費用和契約責任。","回頭檢查真正的財務紀錄，哪些目標變清楚、哪些仍需準備？","對錢的恐懼可能來自過去，也要照見自己現在真實的財務狀況。","把希望獲利的想像和實際可以核對的金額分開看。","重大金錢承諾前先核對損失承受能力與退場條件，本喵跳上屋頂，可不會用猜的找落腳處。","新理財點子可以記下，先研究合法性和數字，不因夢到罐頭就買。","要存、花或重新安排資金時，先比較用途、期限和可能的代價。","聽聞金錢消息先核對可靠來源，鈴聲不等於真的有罐頭到貨。","窗外的麻雀跳來跳去，本喵不會每一次都跟著換位置。財務決策以用途和可靠資訊為準，不必對每個價格變動作反應。","計畫的收入或支出不如預期時，可以重新調整預算與做法。","開始一項財務安排前先懂基本規則和實際成本，從能承擔的規模準備。","付款前發現不明條款就停下來查清楚，別被催促的話推著走。","各種金錢需求擠滿桌面時，先排生活必需和已到期的責任。","若財務有了可核對的改善，保持有效習慣，不因短期順利就增加風險。","收入、物價或生活條件變化時，重新檢視原來的財務安排。","心情激動時不要急著用消費或投資證明什麼，清醒後再核算。","可靠的收入和支持能讓自己安心，仍要以實際條件為準。","財務習慣要慢慢建立，別期待一次調整就讓所有數字變漂亮。","等待一筆款項或目標達成時，先整理現有資源，不預支尚未到手的錢。"],"budget":["先挑出最需要改善的一項開銷，瞄準再調整，別一下砍掉整張生活清單。","把一整月收入和所有固定、變動支出放在一起看，才知道乾乾去哪了。","本喵試新砂盆會先看看進出方不方便。換記帳方法也能先試幾天，選自己長期用得順手的。","預算裡也能保留一點負擔得起的休息與小樂趣，別把自己逼到炸毛。","養成記下真實支出的習慣，比追求一張完美的預算表更有用。","看著寵物店的玩具櫃，本喵也會心動。想存多少錢得配合真實收入和支出，不必為了漂亮目標犧牲必需品。","每天順手記收支像踩踩軟毯，找到做得下去的節奏就好。","本喵會突然追著會滾的瓶蓋跑，但玩一會兒就停。想大幅節省或消費時，先作小幅調整，別讓下個月的預算難以為繼。","本喵把小球踢進沙發底下時，很容易忘記家裡竟然還有一顆。帳單、訂閱和零散費用也值得定期翻出來核對。","想想哪些不太花錢的日常也讓你滿足，不必把每份快樂都變成開銷。","擔心支出增加時，找出實際變貴的項目，再決定要不要調整。","耳朵往後縮時，本喵知道自己不太舒服。若某項花費超過能負擔的金額，就重新考量它的必要性。","想存下某個數目的錢，先把目標拆成每個月可行的預算。","試試替自己訂一個容易遵守的消費約定，例如想買的東西先等一天，再看是否符合預算。","超出預算的邀約或購買可以說不，本喵的食盆可沒有無底洞。","買一送一看起來香噴噴！本喵想問，那第二個罐頭你真的吃得完嗎？折扣前先看看需不需要。","對帳對到眼睛酸就先停一下，醒來核對金額比匆忙填錯好。","本喵聽到零食袋一響就抬頭，結果有時只是人類整理垃圾。花了多少要對照實際帳單，不能只相信印象。","本喵舔不到背時會找梳子幫忙。讓記帳工具和固定的檢查時間互相配合，整理自己的花費也能輕鬆些。","收入與支出就像兩條勾在一起的尾巴，彼此牽動。留出必要費用與儲蓄之後，再安排自己能自在花用的額度。","把房租、水電等固定費用和日常消費分開記，讓每類開銷都有自己的小地盤。","若想買的東西和預算打起架，先暫停付款。等帳目攤開，再決定這筆錢該留在哪裡。","可花的錢有限時，先訂必要支出的優先順序，不必每場優惠都參加。","本喵打不開零食罐就會找人類幫忙。看不懂的帳單可向正式客服查明細，記帳卡住也能試試順手的工具。","試用服務前先查續約、取消和扣款方式，別讓免費紙箱變成固定開銷。","別人都在買的東西不一定值得寫進你的預算，口袋大小可是各自不同。","不必為了面子買下超出預算的東西。若想拒絕昂貴邀約，可以坦白說明自己的花費界線。","真正留下的存款是看得見的成果，記帳時也能肯定自己的小累積。","月底不夠花時先找差額來源，不必只責怪那一杯飲料。","突然多了維修或其他必要費用，就重新調整當月安排，別假裝水沒灑。","若本月有實際節省下來的費用，可以分配到緊急預備或既有目標。","每一筆小錢都抓得緊緊的，也可能把自己累壞。先梳理最影響生活的固定開銷吧。","發現更適合的收支工具或費率，可以先比較總成本再換。","意外拿到退款或禮金，先確認金額，再想需不需要留一部分備用。","娛樂費不必完全歸零，小心別超出自己能支付的範圍啦。","用不到的訂閱可以停掉，記得確認取消是否生效及剩餘費用。","月底回想哪些花費真正讓生活更好，哪些只是習慣性按下購買。","想買東西可能是想安慰自己，先看看情緒和真正的日常需要。","標著「現省多少」的價格標籤，不一定代表真的省錢。先看看這筆消費實際讓荷包少了多少。","大筆購買前算清是否影響房租、生活費和應急存款，別只看分期月付。","突然想買新玩具可以先列入清單，等真正需要時再看是否買得起。","有幾個支出方案時比較長期總費用，也想想自己每天會不會用到。","扣款或帳單通知響起時，先檢查金額和來源，不要忽略異常。","本喵有時聞過新玩具便走開，沒必要每件都帶回家。非必要的購物車先放幾天，看看自己是否仍需要。","原預算太緊就修訂可行金額，長久維持比逼自己每月達標好。","剛開始記帳先記必要項目和實際金額，不用第一天就做出超級大表格。","看到不明扣款或計費說明先暫停付款並查證。","薪水入帳後先把必要費用排好，再想可自由使用的錢。","若已養成穩定的記帳習慣，保持簡單就好，不用越記越複雜。","房租、物價或收入改變時，更新實際預算，不必硬守舊數字。","購物衝動過去再決定是否真的需要，心情不用靠結帳證明。","讓自己有個可靠的生活費底氣：先留必要支出，再安排能持續的儲蓄或其他目標。","換毛不是一次把全部舊毛拔光，花費習慣也挑一項調整，慢慢換比較能持續。","想存到目標數字需要日子，定期查看進度，別為等不及就犧牲必要開銷。"],"income":["抓逗貓棒也得先瞄準呀！看清自己能提供的服務，再試一個具體的收入途徑。","別只看標示的報酬，收入扣掉時間、材料及交通後還剩多少呢？","本喵在門口聞到新味道也不會直接跟出去。新的接案或兼職先確認工作內容、付款和安全，再想要不要接。","賺錢的事也不能把睡覺時間都吃掉，本喵想看你能長久做下去。","多磨一項有人需要的能力，可能比急著追陌生的快速賺錢方式更有用。","掛在窗上的彩帶再漂亮，本喵也未必抓得到。高收入的想像要看真實需求和報酬，不是亮眼宣傳就能兌現。","建立可以持續交付服務的工作節奏，比偶爾一次猛接很多案子重要。","本喵跳上桌子又跳下來需要力氣，可不會整天跳。有接案衝勁時先算能完成的量，不必每個邀約都接。","整理作品、服務項目和付款紀錄，讓人看得清楚你能提供什麼。","回想哪種工作既能賺到報酬，也讓自己覺得值得花那份時間。","有收入邀約令人起疑時，先確認雇主、內容和費用要求的真實性。","報酬不合理或工作量超出約定時，別壓著耳朵忍耐，提早商量。","想像新的收入來源，可以從具體技能、客群和可投入時間開始規劃。","本喵這次可要先談好罐頭才開工。跟客戶友善溝通時，也把收費和交付條件說清楚。","額外工作與不合理的付款要求可以拒絕，不必為賺錢犧牲安全。","宣稱輕鬆高薪的邀約不一定可靠，查清楚是否需要先付款或交出資料。","本喵聽到好幾個玩具同時發出聲音，就會停下來分辨。收入消息太多時先分類、確認報酬和責任，不匆忙答應。","聽到熟悉的開門聲，本喵還會看看來的是誰。報酬和付款條件要以已確認的資料為準，不把別人的收入當保證。","一隻貓舔不到自己的背，合作就能補上本事。不過，收入怎麼分、誰負責哪些工作要先談好。","有穩定合作對象也能保留接其他工作的選擇，收入不必只靠默契。","服務範圍、額外收費和付款期限先劃清楚，免得一直免費加班。","客戶報酬有爭議時，本喵先收爪，保存紀錄，等能好好談清楚再溝通。","同類工作競爭激烈時，想想自己的能力能解決哪種實際需求。","需要介紹工作或了解收費行情，找真正做過這行的人問問。","陌生平台或收入模式先試低成本的方式，確認合法與安全。","大家都在做的副業未必適合你，自己的成本和時間才最重要。","希望提高報酬時就提出具體成果與條件，不必故意冷淡等別人猜。","人類說晚點開罐頭，本喵的食盆可還是空的。詢問還不等於訂單，約定的報酬也不等於已入帳；安排支出時，先看實際可動用的錢。","若收入不足以負擔必要生活，先看是工時、報酬或來源的缺口。","臨時被取消工作或延遲付款時，先核對契約與現金需求，調整安排。","有可信的工作機會或介紹資源時，可以進一步問明條件。","收入計畫像一團毛線時，先解開最值得花時間、也能完成的那顆結。","發現新的客源或工作機會，可以先了解需求，暫不承諾大型投入。","意外得到合作邀約，看看報酬、責任和付款是否符合自己需要。","賺到錢可以享受一下，別因工作很累就花掉會影響生活的全部報酬。","不再划算的兼職可以重新評估，離開前妥善處理已答應的工作。","回顧幾項收入來源的實際淨收益，哪些值得繼續、哪些只是很忙？","別因害怕收入不夠就接受每項工作，也看自己現有的本事和真實負荷。","廣告上的高薪數字要扣掉必要費用，才能看見真正拿到多少。","需要先付大額成本的收入計畫要特別核對風險、契約與可承擔的損失。","新服務的靈感先寫成簡單介紹，問問真正可能付費的對象。","不同工作或接案方向可比較收入穩定度、工時以及必要成本。","接到高報酬消息先查雇主和實際條件，鈴鐺響可不等於薪水來了。","人類拿著小魚玩具晃來晃去，本喵也有不想撲的時候。接到新客戶詢問，可以先了解需求，不必因怕失去就答應不合理交付。","如果原本的服務不好賣，試著調整內容、價格或客群，先小規模驗證。","想增加收入先把工具、技能和收費方式準備好，再試一項工作。","要先付錢才能拿到工作嗎？本喵耳朵豎起來了！遇到轉帳或不必要的個資要求時先查證。","正職、兼職和生活時間得重新排，別讓所有賺錢任務擠在一起。","若收入途徑已有實際成果，保持品質並核對淨收益，再考慮是否增加投入。","工作需求或市場報酬可能變動，查到真正資訊後再安排技能與時間。","收入突然變少難免不舒服，先冷靜核對原因，再想能做的調整。","有長期可靠的客戶或工作來源很珍貴，也別忽略書面條件。","新收入不會像按一下按鈕就冒出來，像換毛那樣慢慢累積，安排可承擔的試行期。","等付款或新案回覆時，整理紀錄、準備其他合理的途徑，不先花還沒收到的錢。"],"assets":["本喵不會對每個晃動的價格飛撲。先弄清楚資產要用在哪個長期目標，再研究配置。","櫃頂能看見不只一個食盆。資產、負債、現金和未來用錢的需求，也得放到同一張地圖上看。","本喵遇到從沒見過的開關會先聞一聞。陌生資產先理解運作規則、費用和風險，不急著交易。","投資資訊不是每秒都要盯，休息一下，重大決定仍以完整資料為準。","練習理解資產的基本特性和代價，比忙著模仿熱門配置更有用。","本喵追牆上的反光時，不會真的抓到那束光。報酬目標漂亮歸漂亮，還得查證可能的波動和損失。","定期檢視配置的習慣可以慢慢建立，別因短期漲跌失去原本節奏。","窗外鳥群忽然飛起，本喵會先蹲住看看。行情有動靜也不必追著交易，先確認資金用途與承受能力是否改變。","整理各帳戶、持有成本、契約和負債，知道手上真正有多少。","資產的目的可以是未來生活的安穩，並不只是讓數字越大越好。","看到價格大跳就想炸毛嗎？先看看資產實際曝險、流動性與產品特性，不用光靠害怕下判斷。","若某筆資產的負擔讓生活吃緊，就辨認需要調整的責任，不必硬撐。","想像未來生活的需要很好，也要估算時間、資金和不確定性。","替自己的資產安排訂下清楚的原則，了解用途、期限與可承受的波動，別只靠一時的信心。","不符合風險承受度的配置或推銷可以拒絕，自己的資金有底線。","罐頭包裝真香，但本喵還是會看裡面裝什麼。資產宣傳也先核對費用、條款和可能損失。","市場資訊太多就先歇一下，再以可靠資料核對重大決定。","本喵夜裡能看見東西，卻不會隔著窗戶知道鳥下一步飛哪。估值與風險要靠可核實的資訊，不能用預感當行情證據。","本喵梳不到背時會借助梳子。資產規劃若有不懂的地方，可以請合格專業人士補足資訊，仍按自己的目標作決定。","讓不同資產的用途互相配合，先確認自己需要多少流動資金，再檢視長期配置。","弄清楚自己名下資產的權利、限制及可動用程度，別把帳面金額全當作現金。","當保留現金與長期投入兩個目標拉扯時，先比較用錢期限、風險和流動性。","別的貓都衝去搶新窩，本喵未必要跟。資產選擇應看自己的目標和可負擔的風險。","看不懂資產條件時，找具資格的專業人士核對，別只聽賣方。","新產品先理解結構與退出方式，拿紙筆比較就好，不必先付款。","流行的配置方案不一定適合自己，本喵的窩只要合自己的身材。","看不懂管理費、贖回或其他條款就開口問，別因不好意思而接受不清楚的承諾。","金罐頭提醒本喵辨認已有資產與真實價值，預期獲利仍不是到手的錢。","櫃子裡罐頭很多，可是手邊一顆都拿不到也很傷腦筋。資產多時仍要留意流動性和生活需要。","市場或個人計畫遇到突發變化，依資料評估影響，不因慌張盲目處分。","若已有穩定且符合用途的安排，可定期檢視，不必天天換位置。","不同資產目標打結時先分出短期用錢和長期用途，再研究配置。","有新的資產選項可以先比較，別把機會浮現當成必須進場。","收到贈與、分配或新資產資訊時，先弄清權利、義務與相關成本。","資產規劃之外也留些生活享受，但不動用必需或應急的資源。","要結束不合適的資產安排，先弄清契約、稅費和退出代價。","定期檢視配置和長期目標是否仍相配，不必只看一時的報酬。","對虧損的恐懼或想追回損失的心情，可以先辨認再作理性評估。","別將過去的表現當成未來保證，核對資產真實狀況與風險。","承擔較大波動之前，要估算可能損失、流動性以及生活保障。","本喵夢裡的金罐頭可不能結帳。新配置先寫在紙上，用可靠資料比較。","資產安排有不同路線時，比較時間期限、成本與風險承受能力。","聽到市場或產品消息先查證來源，別因一聲鈴鐺就改變全部配置。","魚缸外的本喵可以安靜看魚游來游去，不必每次都伸爪。資產按用途安排檢視頻率，不用追著每次漲跌跑。","當目標或風險能力改變，重新評估配置，比死守原先比例更重要。","開始管理資產先懂基本規則與風險，別急著一次搬入不熟悉的產品。","本喵遇到陌生腳步聲會定在原地，把耳朵朝那邊轉。合約或價格資料不完整時先暫緩交易，向可靠來源確認。","各種資產資訊擠滿桌面時，先守住必需生活費與應急資金。","配置目前仍符合預期用途時，不必因短期順利就提高承受不了的風險。","風吹的方向變了，原本的落腳點也得再看看。利率、收入或用錢期限有變動時，重新核對配置。","受到短期漲跌影響心情時，等冷靜再回到目標與實際數據。","可靠的專業意見可以參考，但不代表任何人能替你保證收益。","人生階段改變也會改變資產需求，調整可循序進行。","長期目標需要耐心，按合適週期檢視，若實際條件變了也可修訂。"],"security":["想增加財務安全，先釐清最怕出現的缺口，再做一項能完成的準備。","站高一點看生活費、負債、保障及手上能立即使用的錢。","本喵見到陌生的外出提籠，會從入口先看看能不能舒服轉身。保障方案也要先了解適用範圍，不因害怕立刻買。","能放心睡一覺的財務安排很重要，但仍要知道緊急時能靠什麼。","磨好爪子才有力氣打獵。建立維持收入或管理風險的能力，是替未來的食盆打底。","本喵看見窗外日光，不代表晚上也一定不會下雨。安心的想像不能代替實際保障條件，先弄懂它能支援什麼。","定期存下能負擔的預備金像踩奶一樣有節奏，比一次猛存更做得久。","本喵受驚時可能一口氣跑到高處，但安全後會慢慢停住。想一次做足保障時，先留好日常生活費，不因慌張花完所有錢。","人類把外出提籠固定收在同一處，真的需要時就不必滿屋找。重要契約、帳戶和聯絡方式也整理在安全、可找到的地方。","食盆裡已有乾乾，本喵就能先呼嚕一下。你已備好的基本保障也值得珍惜，再看看還有哪些缺口。","如果擔心收入中斷或意外花費，先算出具體情況下的實際負擔。","若有財務負擔讓你難以喘息，先盤點必要支出和可用資源，不必默默硬撐。","想像一個讓自己能安心打盹的未來吧，再算算需要具備哪些保障條件。","替自己預想收入或生活出現變動時的備案，把可用資金、保障與求助管道記清楚。","別人的罐頭不能一直從你的食盆拿呀。為人情承擔不起的債務或擔保，可以守住底線。","看似很完整的保障產品也要閱讀條款、除外責任及費用。","保障資料看得混亂時先休息，重要合約可以請可信的專業人士協助。","本喵聞到外面的雨味也得看看窗戶有沒有關好。應急資源是否可用，要靠實際資格、條件與金額確認。","找出真正可靠的應急支援，例如正式的保障、諮詢管道或可動用的存款。","讓預備金和實際保障互相補足，先弄清各自能處理哪些生活風險。","保留自己能直接動用的應急資源，確認帳戶權限與提領條件。","保障費用與日常生活費若互相擠壓，先比對必要程度與可負擔金額。","保障預算有限時，先保住最重要的生活需要，而非和別人比買了多少。","有需要時可以找正式的社會支持、保險或財務專業管道了解資格。","不熟悉的保障方案先瞧瞧門縫：能不能申請、真的提供什麼，不必急著答應。","大家推薦的保障未必適合自己的生活與負擔，按實際缺口想。","不必假裝錢夠用；若有財務困難，可整理具體缺口並找可信的正式協助。","真正可動用的存款和可靠保障像到手的罐頭，清點它們才能安心。","應急金不足時，先估算必要開銷缺多少，再找可行的補足方法。","水杯打翻時本喵先避開濕地。意外支出出現，先看可用的現金或正式支援，再安排其他開銷。","若現在有穩定收入和可用的安全網，可以趁條件許可建立備案。","保險、債務與應急資金纏在一起時，先分清最急迫的保障缺口。","發現新的合法支援或保障方案，可以先查資格和費用再決定。","意外得到一筆資助時，弄清條件和是否需返還，再安排使用。","保障未來之餘也要顧好今天，量力而為的小休閒不必完全取消。","不再合適的契約先了解替代保障及終止影響，不要直接留下真空。","定期查看基本生活費和保障是否符合現在的需求，確認哪些已備妥。","過去經歷缺錢可能讓人一直緊張，別忘了用現在的實際數字評估。","想像有保障和真正有保障是兩回事，逐項核實可用金額、條件與限制。","重大財務承諾前先估算收入暫停時能不能繼續生活，給自己留退路。","想到新的應急安排就先寫下，研究實際能否執行，而非相信好預兆。","兩個看起來都安全的小窩，要看自己真的需要哪一個。保障也能比較費用、適用範圍與取得時間。","收到保障變動或帳款通知先核對正式來源，免得被不明訊息催促。","本喵不必一聽雷聲就換個躲藏處。有擔憂時先核對現有保障和必要缺口，不因焦慮而加滿支出。","收入或生活責任改變時，應急安排也可能需要調整。","剛開始做財務安全準備，可以先整理必要生活費和手上的應急資金。","不懂的扣款、貸款或保障條件先停下查清楚，別急著簽字。","眾多支出需要排隊時，住處、食物及必要義務要先顧好。","若應急準備已逐漸增加，維持能負擔的節奏，不用為速度壓縮生活。","費用、收入或保障制度變動時，重新確認現在真正能依靠的資源。","財務焦慮強烈時先穩住情緒，再看實際數字，避免倉促承諾。","可信的親友與正式支援能成為安全網，也得確認各自能提供多少。","不同人生階段的保障需求會變，給自己時間逐步更新。","沙漏還在滴答，保障若尚未生效，就先留好能用的現金，弄清真正的等待條件。"],"self":["選一件自己真正想做的事小小試一次吧，本喵可不想你一直為別人的目標飛撲。","站遠一點看看自己的生活，不只問現在做得好不好，也問這是不是想過的日子。","本喵有天聞了聞新鮮的貓草，才發現自己很喜歡這個味道。認識自己也可以試試以前沒留意的興趣。","本喵並不需要先做出成果才有資格睡覺。休息時也可以安心做自己。","有想長成的模樣就慢慢磨練，別把力氣全花在證明自己很厲害。","本喵追著地上的一小片反光時很開心，沒有真的抓到也不算白玩。喜歡的願望不必只靠成果證明價值。","找到讓自己心穩的小習慣，本喵熟悉的毯子就有這種魔力呢。","本喵偶爾突然在地毯上打滾，下一刻又伸懶腰。心裡想做的事有衝勁很好，也可以留力氣慢慢探索。","把混亂的日常和想法一點點理順，不必要求自己突然變成完美貓。","什麼時候你會像本喵一樣，不用做什麼就忍不住呼嚕？","不安可能在提醒你需要保護自己，先了解原因，不用急著責怪敏感的心。","把一直吞下去的感受聽一聽，耳朵都壓平了還裝沒事，多累呀。","窗外嚮往的生活是什麼模樣？也許可以先找出其中一個想實現的小部分。","先對自己慢眨一下眼吧，用友善的態度認識真實的自己。","自己不願接受的期待有權拒絕，做自己不需要每個人批准。","想呈現漂亮的一面很自然，也不用讓表面的形象定義全部的你。","想太多時暫時把問題留在一旁，給腦袋一個安靜的角落。","本喵聽見不尋常的聲響會歪頭等一下。自己的直覺值得聽，但也可以用實際經驗看看猜得對不對。","需要被支持時也可以接受幫忙，不必證明自己是一隻什麼都會的貓。","與重要的人連結之外，也留出只屬於自己的時間和興趣。","找到自己真正重視的界線，在哪裡自在，不該全由外界安排。","有時離開吵雜的環境一下，就能分辨自己真正想的是什麼。","不需要搶到別人眼中的最佳位置，先想那個位置是否真的適合你。","自己的需要值得被說出口，不必一直靠別人發現你的辛苦。","新的生活方式可以先從小地方嘗試，不必一下否定原有的日子。","別人的故事和看法都可以聽聽，但自己的人生不必照抄。","若你嘴上說不在乎，心裡卻很在意，可以先對自己誠實一點。","已經累積的能力和經驗值得看見，別老盯著那一罐還沒有得到的東西。","感到空空的時候，想想缺的是休息、支持、意義還是其他實際需要。","生活偶爾打翻水杯，處理好眼前的事，不必因此否定一路的努力。","你現在擁有的好條件與支持都是資源，允許自己享受和運用它們。","心事纏在一起時先挑一個最想理解的，慢慢找到自己的線頭。","新的興趣或選擇浮現，可以先看看喜不喜歡，不必先證明它有用。","有些意外經驗會讓你看到自己不同的一面，值得帶著好奇回想。","做一件沒什麼產出的快樂小事也很好，生活不是只有進度表。","不再合身的目標和標準可以收起來，過去的努力仍然有價值。","回顧走過的這一段，現在的你對自己多懂了哪一件事？","本喵影子裡也有不好看的角度。理解自己的缺點，並不等於責怪自己。","別把別人的評價當成一面完美的鏡子，你的全貌比那個倒影大得多。","想挑戰新的自己也要留安全退路，不必用冒險來證明勇敢。","夢裡和想像裡的自己可能提供靈感，醒來再看看哪些願望真的想實現。","遇到人生的岔路，可以把內心願望和現實條件都放進選擇裡。","外界的聲音有值得聽的，也有只是噪音的，不必每聲鈴都追。","有時小飛蟲停在本喵旁邊，我乾脆收爪等牠飛走。感受和興趣不一定要抓住不放，留一點探索空間呀。","原本的做法不合適可以換姿勢，適應環境不表示失去自己。","從一件容易做的小事開始，自己的成長不需要一早就完成大跳躍。","內心出現疑問時先停下觀察，停一會兒不代表沒有前進。","生活總是被別人的需求打斷時，重新把自己的需要排進去。","如果最近有一點活力或勇氣回來，慢慢享受，不必立即要求更多。","本喵到了換毛季會掉些舊毛，最近喜歡的睡姿也可能改了。現在的需要不一定和以前相同，不必因此否定曾經的自己。","等情緒平靜一點再聽自己的心，感受和決定不必同一秒完成。","可信任的支持能讓你安心，但你仍可以照自己的方式生活。","成長像換毛，有些習慣需要放下，有些原本的自己值得留下。","有些答案要經歷一段時間才明朗，等待時也能好好過現在的生活。"],"emotion":["想改善心情不必解決所有事，可以先做一個身體和心都能接受的小動作。","從櫃頂看底下的世界比較寬，試著拉開一點距離看今天的情緒。","本喵被聲音嚇到會壓低耳朵，有時又是因為想安靜才走開。除了表面的情緒，此刻還有其他感覺嗎？","如果感覺疲憊，就把自己攤成一張貓餅吧，休息不必通過考核。","不舒服時找個安全的出口，例如散步或寫下感受，別把爪子伸向自己。","本喵聞聞貓薄荷，有時開心打滾，有時卻只想趴著。興趣可以陪自己度過不順的日子，不用每次都把難過趕走。","呼嚕，熟悉的氣味、毯子或一首歌，也許能讓身心慢慢安定。","本喵突然炸毛會先拉開距離，等身體放鬆再靠近。情緒強烈時也可以停一停，別靠一口氣宣洩傷到自己或別人。","把心裡那堆感受分開命名吧，生氣、疲倦和失望未必是同一件事。","今天若有一小段真正舒服的時光，給那份感覺留個位置嘛。","炸毛是警戒的訊號，先找個安全位置，慢慢辨認是現實威脅還是內心警報。","一直忍住難受可能讓負擔累積，試著用自己的話說說哪裡不舒服。","想像比較自在的日常很好，也能找到一些現在做得到的微小調整。","對自己溫柔一點，像本喵慢眨眼一樣，不必急著把每種情緒趕走。","讓你不舒服的刺激可以暫時離開；需要拒絕時不用假裝沒感覺。","即使看起來很開朗，也可以有不開心的時候，不必維持漂亮的表情。","資訊與待辦太多時，先安靜坐幾分鐘，讓腦袋少接一點訊息。","本喵聽到陌生聲音會豎起耳朵，但得看清楚才知道發生什麼。焦慮的感覺值得聽見，也把事實和想像分開看。","心事可以找信得過的人一起理，不需要靠自己舔完整身亂毛。","有人陪伴很好，想獨處一下也可以，照自己的情緒需要安排。","留一個讓你覺得安全、不必一直應付他人的角落。","當下情緒太強可以先離開爭執現場，等身體舒服些再談。","好幾件壓力來源同時搶注意力時，先照顧最讓你吃不消的那件。","想有人陪陪時，可以試著說出希望對方怎麼幫你，而不是只忍著。","本喵看到陌生人會先躲在椅子下面觀察，不一定要立刻出來打招呼。新場合讓你緊張時，可以在安全距離慢慢熟悉。","其他人的心情和你的不必一樣，別因大家都開心就逼自己笑。","明明難受卻說沒事時，先承認真正的感受，再決定想不想讓人知道。","記得自己曾成功照顧好心情的方式，這些經驗就像留存的好罐頭。","覺得心裡空空的，不妨看看真正缺少的是睡眠、陪伴還是休息空間。","突發事情使情緒起伏很自然，先處理當下需要，不忙著責怪自己的反應。","若此刻有一點支持或舒服的環境，好好接住那份暖意就好。","很多煩惱纏著時先挑一個感受來理解，不必馬上把全部解開。","覺得某種方式也許能幫忙放鬆，可以小小試一次，感受不合再換。","意外讓你心情變好或變差的事情，都能是認識自己反應的線索。","做點喜歡的事能讓壓力鬆一點，但若困擾持續，仍值得適當求助。","不必假裝難受的經驗沒發生，安全地說說或寫下它，也是在收尾。","安靜感受此刻心情，和前幾天相比，有沒有哪一部分變得清楚？","不想承認的情緒也屬於你，理解它不代表必須跟著它行動。","心情低落時容易只看見自己不好的地方，但此刻的倒影不是你的全部。","面對讓人不安的挑戰時不必硬撐，安全、可退出的步伐比較重要。","夢醒後的感受可以記一小段，它也許提供自我理解的線索，而不是預言。","不知道該說、該休息還是該求助時，先想哪一種選擇能照顧眼前的需要。","身體和心情出現不同的訊號時，多留意它們，不必每個變化都往壞處猜。","本喵能靜靜望著窗上的雨滴滑下來。感受也會改變，不必急著抓住或趕走它。","若原本的放鬆方法不管用，可以換一種適合此刻身心的做法。","剛從疲憊或低潮中恢復一點時，不用急著排滿日程，慢慢伸展就好。","情緒突然拉高時，可以停一停看看身體訊號及周遭是否安全。","通知、待辦與別人的需求一擁而上時，替自己留段不被打擾的時間。","若心情稍微輕快了，享受一點好轉，不用規定明天也得一直開心。","情緒會隨情境與身體狀態變化，原本有效的方法也能再調整。","像等水窪的波紋慢慢靜下來，現在先容許自己感受，不急著決定。","有可信任的人願意聽就可以靠近一些；如果需要專業支持，也值得尋找。","情緒調整不必一次到位，有些反應需要時間學習新的應對方式。","某些心情需要時間消化，若長期影響生活，可以找適當支持陪你一起面對。"],"values":["做一件自己真心重視的事，比撲到別人頒的獎狀更能看見自己的價值。","從高處看自己一路走來的經驗，別讓一次表現變成全部的人生評分。","本喵明明有新逗貓棒，卻偏愛一顆舊瓶蓋。找找自己真正喜歡的事，不用先問別人會不會稱讚。","本喵躺成一張貓餅也還是本喵，你不必整天有產出才值得被尊重。","磨練能力是為了自己想成長的方向，不是為了討好每個評審。","本喵追不上小球時也還是一隻好貓呀。喜歡的夢想值得追，不必把沒有達成當成自己不夠好。","那些讓你感到安心、像自己一樣的小習慣，值得好好保留。","本喵玩得太累就攤平休息，才不為了向隔壁貓證明什麼。你也不必累到極限才覺得自己有價值。","把外界要求和自己在乎的事情分開理清，不用把所有標準都戴在身上。","不靠獎勵也能感到滿足的事，也許正透露你真正重視什麼。","被批評時豎起毛很自然，先分清有用的回饋和傷人的評價。","心裡不認同卻一直配合別人的標準，會讓自己默默累積委屈。","想成為怎樣的人，可以從價值觀出發，不必完全複製別人的成功樣子。","也對自己慢眨一下眼吧，你不需要一開口就先挑自己的缺點。","不合自己原則的要求可以拒絕，尊重自己不是任性。","外表、頭銜和數字不是一個人的全部價值，本喵可不會因為毛色不同，就少疼愛自己一點。","被比較得太累時可以暫時離開評分的聲音，回來聽聽自己的想法。","本喵沒收好舌頭被人笑了，也沒長出另一條尾巴。別人的片面評價不是全部事實，你的能力還要從實際經驗看。","接受支持並不減少你的價值，能互相照應的關係也很值得珍惜。","喜歡與別人一起做事，不表示獨處時就失去重要性。","把自己的原則和界線標清楚，不必住進別人替你畫好的領地。","面對意見不同可以先留點距離，你不用每次都急著說服別人認同。","別人的成就不會搶走你的價值，紙箱有很多種，舒服才重要。","希望被肯定是自然的，也可以用自己的話肯定已做到的事情。","不熟悉的自我表達方式值得試試，不必擔心每一次都有人喜歡。","群體認同不是唯一通行證，自己重視的原則也值得聽。","不用為想被看見感到羞愧，能坦白自己的需要比故作不在乎自在。","看見已累積的一點能力與經驗，成果不必特別耀眼才值得肯定。","若一直覺得自己不夠好，先看看真正缺的是什麼，而不是加上一堆責備。","一個失誤像打翻水杯，可以處理和學習，不必把整隻貓判成失敗。","若身旁有欣賞你真實樣子的人，可以珍惜那份不靠表現換來的支持。","自我要求太多時，先解開一條最困住你的標準，其他不用同時改。","發現新的價值或興趣時，可以多認識它，未必需要變成專業成就。","意外得到一句肯定時可以收下，不用馬上找理由證明對方說錯了。","本喵偶爾只想舔舔自己的腳掌，再悠閒地啃點貓草。純粹喜歡就能做的事也值得留下，不必每回都變成競賽。","過去用來衡量自己的標準若已不合適，可以好好放下它。","回想真正讓自己滿意的時刻，未必都是拿到好成績的那天。","不喜歡自己的某一面也可以慢慢理解，影子不會抹去身上的光。","你看到的自己可能被比較和期待改變了模樣，試著也看真實的付出。","堅持自己重視的事情仍要照顧安全，不必用吃苦多少證明原則。","夢裡想成為的樣子可以當作思考線索，醒來再分辨那是不是自己的願望。","面對不同人生價值的選擇時，問問哪個更符合自己真正在乎的事。","收到外界稱讚或批評時先辨認內容，不必讓一聲鈴決定自我評價。","本喵用爪子撥撥紙團只因為喜歡，沒打算參加比賽。給興趣一點自在的時間，不必把它變成績效。","價值觀改變不代表過去的自己做錯了，可以重新調整想走的方式。","從 果與高手比較，先想想你想成為怎樣熟練的人。"],"venture":["本喵昨天看見一個新來的玩具，大家卻先跑去研究它的包裝。咦，人類想做什麼樣的新生意呢？","本喵有個商業疑問：如果店裡的逗貓棒很漂亮，但客人偏偏愛紙袋，該怎麼辦呀？","喵！創業小地盤探險開始。除了好看的招牌，本喵還想看看裡面如何運轉。","一個事業從想法到可以持續經營，中間有顧客、成本、合作與日常營運等許多面向。","做生意不只是把想法推出去，本喵也想看看誰真正需要它、需要什麼條件。","從第一個點子到每天開門營業，會經過不同的選擇。牌面可以提供整理經營想法的角度。","你希望創造的不只是營收，或許也有一種想過的生活與想提供的價值。","事業的決定牽涉真實的資源和風險，本喵不會用一張牌替你保證市場結果。","如果創業仍在摸索階段，不用因為有未知就否定點子，也不用把未知當成承諾。","每一次經營選擇都有現實條件，讓我們從能驗證、能負擔的部分開始看。"],"money":["本喵聽見零食袋沙沙響，耳朵就豎起來了。不過人類的錢可比零食複雜，先看看今天在意的是哪件事。","喵，本喵的財務研究從食盆和罐頭庫開始，今天一起看看人類的版本。","如果數字會發出呼嚕聲就好了，本喵就能知道哪份財務安排最安心啦。","金錢與生活息息相關，不只有收入和數字，還有花費的目的與可以承擔的條件。","財務問題有許多種面向，牌面可以提供思考角度，實際決定仍要回到資料。","本喵想看看你期待金錢為生活帶來什麼，而不只是在帳面上多一個數字。","每個人在不同階段需要的資源不一樣，今天可以看看哪些財務問題對你更重要。","如果錢的事讓人不踏實，就從能確認的現況和必要生活支出想起。","不必用占卜決定要投入多少錢，本喵只陪你整理那些值得進一步了解的事。","財務得失沒有辦法靠卡牌預知，照顧現實生活與自己的承受能力更重要。"],"budget":["本喵老想趁人類沒注意時多偷吃一顆零食，可是每天多少還得算清楚嘛！來聊聊生活開銷吧。","人類的購物車好大，明明沒有輪子卻可以裝那麼多東西。本喵想看你的預算世界。","喵，今天的罐頭小帳本翻開啦。正餐、零食、娛樂，都有各自的格子呢。","預算是為了支持生活，不是把所有快樂都刪掉。今天的牌可以陪你看看分配。","每月的固定支出和臨時花費性質不同，本喵想看看你想調整的是哪一部分。","收支管理是一種日常安排，有些錢需要留下，有些花出去也值得。","本喵希望預算裡不只有該付的帳單，也有你真正在意的生活。","如果最近的開銷讓你緊張，先看看收入與必要費用，不必急著怪自己。","收支有時受到意外或生活變動影響，需要重新整理並不代表之前做錯了。","今天先用牌面找一個可以檢視的預算方向，真正的金額仍得看自己的帳目。"],"income":["要是本喵每天表演伸懶腰就有人付錢，想必很愉快吧！人類真正的收入機會還需要看看成本與本事。","喵，今天想看看有哪些多賺罐頭的方法？本喵很好奇人類究竟有什麼本領能派上用場。","如果每次把玩具叼回來都能收費，本喵的食盆早滿啦！一起看看收入機會吧。","增加收入牽涉能力、時間、需求與報酬，不一定是把工作時數變得更長。","本喵想看看你能提供什麼價值，以及可能的收入方式是否適合自己的生活。","一份工作或接案的價值，還得放在實際成本與付費條件裡看。","今天的牌可以用來想想新的收入選擇，不必把每個可能性都轉成一份工作。","如果收入機會還沒有明確條件，我們先從能核實的資料開始，不急著交錢或承諾。","追求更多收入不代表要放棄全部的休息，實際能負擔的工作量也很重要。","本喵不能預知賺多少，但可以陪你分辨報酬、代價與值得研究的方向。"],"assets":["本喵常常在沙發底下找到以前踢進去的玩具。人類管理資產可不能全靠找玩具的運氣，我們來看看眼前的安排。","喵，今天不是來猜哪罐會變大，而是來看看手上有哪些不同的資源與用途。","亮晶晶的包裝有時比罐頭還吸引貓，談資產前，本喵要記得看裡面真正裝了什麼。","資產規劃通常牽涉用途、期限、流動性與風險，今天可以從自己的生活目標想起。","本喵想陪你看看如何認識手上的資產，而不是用牌面猜下一次市場漲跌。","不同的人生階段有不同的資金需要，適合自己的安排未必和別人相同。","先分清可以長期安排的資源與需要隨時動用的錢，才能理解不同選擇的意義。","涉及資產的決定不宜只依占卜，重要的費用、限制與風險都值得核對。","就算看到讓人期待的機會，仍然可以先停在研究階段，保有自己的判斷。","如果資產狀況令人不安，先保留生活保障，必要時再尋求合格的專業協助。"],"security":["忽然聽到打雷時，本喵有個可以躲進去的角落就安心多了。人類的生活又有哪些保護和準備呢？","喵，今天聊的是替未來留 分。","工作、照顧、家庭與個人生活會在不同日子有不同重量，安排也能跟著調整。","一週的日常不必每一格都有成果，空白時間本身也有自己的用途。","如果事情一多就覺得力氣不夠，可以先辨認哪些責任最需要分擔與支持。","不是所有待辦都要同時完成，本喵希望基本的吃飯、睡覺與休息能被保留。","生活需要調整時不必先責怪自己，今天可以先想一個能讓日子比較過得下去的方向。"]};

 const cautious=p.some(c=>[11,12,15,17,23,29,30,32,36,38,39,40,43,47,48].includes(c.id))||getAnswers().slice(0,2).some(a=>a&&['risk','scarcity','constraint','boundary'].includes(a.tag));
